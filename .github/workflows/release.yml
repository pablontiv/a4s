name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

# Serialize inventory checks and immutable publication, including late CI completions.
concurrency:
  group: a4s-staged-publication
  cancel-in-progress: false

env:
  # This is the shipped-input contract, deliberately independent of workspace CI selection.
  A4S_SHIPPED_INPUTS: >-
    ["packages/issue-lifecycle/**","packages/hot-reload/**","packages/loader/**","packages/launcher/**","scripts/build-a4s.mjs","package.json","package-lock.json"]
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
          cache: npm
      - name: Verify validated SHA and publication eligibility
        id: publication
        run: node scripts/publish-a4s.mjs plan
      - if: steps.publication.outputs.publish == 'true'
        run: npm ci && node node_modules/bun/install.js
      - name: Build release archives
        if: steps.publication.outputs.publish == 'true'
        run: npm run build:a4s
      - name: Publish immutable staged build or verify matching rerun
        if: steps.publication.outputs.publish == 'true'
        run: node scripts/publish-a4s.mjs publish
