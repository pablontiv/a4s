name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
          cache: npm
      - name: Verify version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("packages/issue-lifecycle/package.json", "utf8"));
            if (process.env.TAG !== `v${version}`) {
              throw new Error(`Release tag ${process.env.TAG} does not match package version ${version}`);
            }
          '
      - run: npm ci && node node_modules/bun/install.js
      - name: Build release archives
        run: npm run build:a4s
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it or any asset" >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            dist/a4s-*.tar.gz dist/a4s-*.tar.gz.sha256
      - name: Move major compatibility tag
        run: |
          major=$(node -p '"v" + require("./packages/issue-lifecycle/package.json").version.split(".")[0]')
          commit=$(git rev-parse HEAD)
          git tag --force "$major" "$commit"
          git push --force origin "refs/tags/$major"
