name: CI

on:
  push:
    branches: [main, integration/v1]
  pull_request:
    branches: [main, integration/v1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}
    steps:
      # pull_request checks out the merge commit: HEAD^1 is the base branch, so a
      # depth of 2 is enough for the git fallback below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: workspaces
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          all='["context-management","orca-omp-integration","omp-dagu","synagent","message-bus","omp-cross-family-review","pi-tool-row-presentation","omp-hot-reload"]'
          # Application/package paths select their workspace; shared helper changes select all consumers.
          if [[ "$EVENT_NAME" == pull_request ]]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename') \
              || files=$(git diff --name-only HEAD^1 HEAD)
            names=$(printf '%s\n' "$files" | jq -Rsc --argjson all "$all" '
              split("\n") | map(select(length > 0)) |
              if any(.[]; ((startswith("packages/") or startswith("apps/")) | not) or startswith("packages/omp-hot-reload/")) then $all
              else map(if startswith("packages/synagent/core/") then "synagent"
                elif startswith("apps/message-bus/") then "message-bus"
                else split("/")[1] end) | unique end')
          else
            names=$all
          fi
          # @a4s/pi-tool-row-presentation typechecks against @pablontiv/pion, which CI does not install.
          workspaces=$(jq -cn --argjson names "$names" '$names | map({name: ("@a4s/" + .), typecheck: (. == "omp-hot-reload" or . == "context-management" or . == "orca-omp-integration" or . == "omp-dagu" or . == "synagent" or . == "message-bus")})')
          echo "workspaces=$workspaces" >> "$GITHUB_OUTPUT"
  test:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The @pablontiv/pion dev tarball (github.com/pablontiv/pi releases) is no
      # longer downloadable. Install without it, then restore the manifests that
      # the identity tests read.
      - &install-dependencies
        name: Install without @pablontiv/pion
        run: |
          pion='@pablontiv/pion'
          for manifest in packages/pi-tool-row-presentation/package.json; do
            jq --arg p "$pion" 'del(.devDependencies[$p])' "$manifest" > "$manifest.ci"
            mv "$manifest.ci" "$manifest"
          done
          jq --arg p "$pion" '
            del(.packages["node_modules/" + $p])
            | .packages |= with_entries(
                if .value.devDependencies then .value.devDependencies |= del(.[$p]) else . end)' \
            package-lock.json > package-lock.ci.json
          mv package-lock.ci.json package-lock.json
          npm ci
          git checkout -- package-lock.json packages
      - name: Install pinned Dagu
        if: matrix.workspace.name == '@a4s/omp-dagu'
        run: &install-pinned-dagu |
          version=$(node -p "require('./packages/omp-dagu/package.json').daguFeature.dagu")
          asset="dagu_${version}_linux_amd64.tar.gz"
          url="https://github.com/dagu-org/dagu/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/dagu-install" "$RUNNER_TEMP/dagu-bin"
          cd "$RUNNER_TEMP/dagu-install"
          echo "Asset: $url/$asset"
          curl --fail --location --show-error --silent "$url/$asset" -o "$asset"
          curl --fail --location --show-error --silent "$url/checksums.txt" -o checksums.txt
          awk -v asset="$asset" '$2 == asset { print; found=1 } END { if (!found) { print "Missing checksum for " asset > "/dev/stderr"; exit 1 } }' checksums.txt > checksum.txt
          cat checksum.txt
          sha256sum --check --strict checksum.txt
          tar -xzf "$asset" dagu
          install -m 0755 dagu "$RUNNER_TEMP/dagu-bin/dagu"
          echo "$RUNNER_TEMP/dagu-bin" >> "$GITHUB_PATH"
      - name: Check pinned Dagu
        if: matrix.workspace.name == '@a4s/omp-dagu'
        run: &check-pinned-dagu |
          version=$(node -p "require('./packages/omp-dagu/package.json').daguFeature.dagu")
          command -v dagu
          actual=$(dagu version)
          echo "$actual"
          if [[ "$actual" != "$version" ]]; then
            echo "::error::Expected dagu version $version; received $actual"
            exit 1
          fi
      - run: npm test --workspace "${{ matrix.workspace.name }}"
      - name: Typecheck
        if: matrix.workspace.typecheck
        run: npm run typecheck --workspace "${{ matrix.workspace.name }}"
  live:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.workspaces).*.name, '@a4s/omp-dagu')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [poc-template, poc-rendered, recovery, validation-admission, feature-remainder, other-live]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - *install-dependencies
      - name: Install pinned Dagu
        run: *install-pinned-dagu
      - name: Check pinned Dagu
        run: *check-pinned-dagu
      - name: Live Dagu tests
        working-directory: packages/omp-dagu
        env:
          A4S_LIVE_DAGU: "1"
          LANE: ${{ matrix.lane }}
        run: |
          # Match complete top-level names and their descendants. Skipping the
          # named groups retains new feature cases automatically in the remainder.
          poc_template='template real Dagu closes implementation runs and succeeds after enqueuing a PoC'
          poc_rendered='rendered DAG real Dagu closes implementation runs and succeeds after enqueuing a PoC'
          recovery='concurrent recovery fixtures keep distinct run identities'
          validation_admission='(?:template|rendered DAG) (?:optional validation uses native skip, SHA approval and iterative rejection|real Dagu checks primary freshness before admission and enqueues bootstrap after merge)'
          feature_groups="(?:${poc_template}|${poc_rendered}|${recovery}|${validation_admission})"
          case "$LANE" in
            poc-template) pattern="^${poc_template}(?:$| )" ;;
            poc-rendered) pattern="^${poc_rendered}(?:$| )" ;;
            recovery) pattern="^${recovery}(?:$| )" ;;
            validation-admission) pattern="^${validation_admission}(?:$| )" ;;
            feature-remainder)
              # Native exclusion also prevents file-parent selection from
              # admitting the named groups or their descendants.
              npx tsx --test --test-skip-pattern "^${feature_groups}(?:$| )" test/feature-template.test.ts
              exit
              ;;
            other-live)
              npx tsx --test test/live/*.test.ts test/bundle-cli.test.ts test/bundle-rebase.test.ts test/bundle-template.test.ts test/bundle.test.ts test/planning-template.test.ts test/reconcile-ci.test.ts test/reconcile-leftovers.test.ts
              exit
              ;;
          esac
          npx tsx --test --test-name-pattern "$pattern" test/feature-template.test.ts
  validate:
    needs: [changes, test, live]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          LIVE_RESULT: ${{ needs.live.result }}
          WORKSPACES: ${{ needs.changes.outputs.workspaces }}
        run: |
          echo "changes=$CHANGES_RESULT test=$TEST_RESULT live=$LIVE_RESULT"
          [[ "$CHANGES_RESULT" == success ]] || exit 1
          if [[ "$WORKSPACES" == '[]' ]]; then
            [[ "$TEST_RESULT" == skipped ]] || exit 1
          else
            [[ "$TEST_RESULT" == success ]] || exit 1
          fi
          if jq -e 'any(.[]; .name == "@a4s/omp-dagu")' <<< "$WORKSPACES" > /dev/null; then
            [[ "$LIVE_RESULT" == success ]]
          else
            [[ "$LIVE_RESULT" == skipped ]]
          fi
