name: CI

on:
  push:
    branches: [main, dagu-14steps]
  pull_request:
    branches: [main, dagu-14steps]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scoped gate diffs against the merge base with GATE_BASE
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Dagu 2.26.0
        env:
          DAGU_ASSET_URL: https://github.com/dagucloud/dagu/releases/download/v2.26.0/dagu_2.26.0_linux_amd64.tar.gz
        run: |
          archive="$RUNNER_TEMP/dagu_2.26.0_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "$DAGU_ASSET_URL" --output "$archive"
          # From the official v2.26.0 release's checksums.txt.
          echo "2b1cab5dbab7c7dc6607d807e2cbf6597f26d5a5d09442e2c2abcfe1acbf9e68  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/dagu-2.26.0"
          tar -xzf "$archive" -C "$RUNNER_TEMP/dagu-2.26.0" dagu
          echo "DAGU_BIN=$RUNNER_TEMP/dagu-2.26.0/dagu" >> "$GITHUB_ENV"
      # test what is in use plus what changes (#1120): @a4s/factory always, other workspaces only when this push or
      # pull request touches them (packages/factory/src/affected.mjs); an unknown base (new branch) tests all
      - name: Gate (scoped)
        run: bash scripts/gate.sh
        env:
          GATE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      # integration of the factory cycle (push, ci, close) against a bare remote and a gh stub; no model, no T3, no credentials
      - name: Factory stub selftest
        run: npm run selftest:stub
        working-directory: packages/factory
        timeout-minutes: 5
