name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}
    steps:
      - id: workspaces
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          all='["context-expert","orca-omp-integration","omp-dagu","synagent","synagent-bus","omp-cross-family-review","pi-tool-row-presentation"]'
          if [[ "$EVENT_NAME" == pull_request ]]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          else
            files=README.md
          fi
          names=$(printf '%s\n' "$files" | jq -Rsc --argjson all "$all" '
            split("\n") | map(select(length > 0)) |
            if any(.[]; startswith("packages/") | not) then $all
            else map(if startswith("packages/synagent/core/") then "synagent"
              elif startswith("packages/synagent/bus/") then "synagent-bus"
              else split("/")[1] end) | unique end')
          workspaces=$(jq -cn --argjson names "$names" '$names | map({name: ("@a4s/" + .), typecheck: (. == "context-expert" or . == "orca-omp-integration" or . == "omp-dagu" or . == "synagent" or . == "synagent-bus")})')
          workspaces=$(jq -c '. + [{"name":"@a4s/does-not-exist","typecheck":false}]' <<< "$workspaces")
          echo "workspaces=$workspaces" >> "$GITHUB_OUTPUT"
  test:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The @pablontiv/pion dev tarball (github.com/pablontiv/pi releases) is no
      # longer downloadable. Install without it, then restore the manifests that
      # the identity tests read.
      - name: Install without @pablontiv/pion
        run: |
          pion='@pablontiv/pion'
          for manifest in packages/context-expert/package.json packages/pi-tool-row-presentation/package.json; do
            jq --arg p "$pion" 'del(.devDependencies[$p])' "$manifest" > "$manifest.ci"
            mv "$manifest.ci" "$manifest"
          done
          jq --arg p "$pion" '
            del(.packages["node_modules/" + $p])
            | .packages |= with_entries(
                if .value.devDependencies then .value.devDependencies |= del(.[$p]) else . end)' \
            package-lock.json > package-lock.ci.json
          mv package-lock.ci.json package-lock.json
          npm ci
          git checkout -- package-lock.json packages
      - run: npm test --workspace "${{ matrix.workspace.name }}"
      - name: Typecheck
        if: matrix.workspace.typecheck
        run: npm run typecheck --workspace "${{ matrix.workspace.name }}"
  validate:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "changes=$CHANGES_RESULT test=$TEST_RESULT"
          [[ "$CHANGES_RESULT" == success && ( "$TEST_RESULT" == success || "$TEST_RESULT" == skipped ) ]]
