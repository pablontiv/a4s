name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Clasificar cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Clasificar rutas modificadas
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -eu
          echo "docs_only=false" >> "$GITHUB_OUTPUT"

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD"
              ;;
            push)
              base="$PUSH_BASE"
              head="$PUSH_HEAD"
              if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
                echo "La base del push no está disponible; se ejecutará la suite runtime."
                exit 0
              fi
              ;;
            *)
              echo "El evento no permite clasificar cambios; se ejecutará la suite runtime."
              exit 0
              ;;
          esac

          if ! git cat-file -e "$base^{commit}" || ! git cat-file -e "$head^{commit}"; then
            echo "No se pueden comparar los commits; se ejecutará la suite runtime."
            exit 0
          fi

          changed_paths="$RUNNER_TEMP/changed-paths"
          if ! git diff --name-only -z "$base" "$head" > "$changed_paths"; then
            echo "No se pudieron clasificar los cambios." >&2
            exit 1
          fi

          mapfile -d '' -t paths < "$changed_paths"
          echo "Rutas modificadas:"
          if (( ${#paths[@]} == 0 )); then
            echo "(ninguna)"
            exit 0
          fi

          docs_only=true
          for path in "${paths[@]}"; do
            printf 'changed_path=%q\n' "$path"
            if [[ "$path" != .workspace/docs/* ]]; then
              docs_only=false
            fi
          done
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  docs:
    name: Validar documentación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.1"
      - name: Instalar Rootline fijado
        run: >-
          go install
          github.com/pablontiv/rootline/cmd/rootline@14ee8aa4d5067c7ff6d0708d79e3aaebf27b7a56
      - name: Validar documentación gobernada
        run: rootline validate --all .workspace/docs -o json

  runtime:
    name: Probar runtime
    needs: classify
    if: always() && needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Test runtime
        run: npm test
      - name: Typecheck runtime
        run: npm run typecheck
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned Python test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --no-deps -r requirements-test.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.1"
      - name: Install pinned Rootline
        run: >-
          go install
          github.com/pablontiv/rootline/cmd/rootline@14ee8aa4d5067c7ff6d0708d79e3aaebf27b7a56
      - name: Test repository contract
        run: >-
          python -m unittest discover
          -s test
          -p "test_*.py"
          -v
      - name: Test profile contract
        run: >-
          python -m unittest discover
          -s profiles/pablontiv/tests
          -t profiles/pablontiv
          -p "test_*.py"
          -v
      - name: Test ADR workspace
        run: >-
          python -m unittest discover
          -s skills/adr/tests
          -t skills/adr
          -p "test_*.py"
          -v
      - name: Test GitHub communication style
        run: >-
          python -m unittest discover
          -s skills/gh-communication-style/tests
          -t skills/gh-communication-style
          -p "test_*.py"
          -v
      - name: Validate governed knowledge
        run: rootline validate --all profiles/pablontiv -o json
      - name: Test agent behavior doctor
        run: >-
          python -m unittest discover
          -s skills/agent-behavior-doctor/tests
          -t skills/agent-behavior-doctor
          -p "test_*.py"
          -v
      - name: Test systemic issue triage
        run: >-
          python -m unittest discover
          -s skills/systemic-issue-triage/tests
          -t skills/systemic-issue-triage
          -p "test_*.py"
          -v
      - name: Test context-save
        run: >-
          python -m unittest discover
          -s skills/context-save/tests
          -t skills/context-save
          -p "test_*.py"
          -v
      - name: Test sweep
        run: >-
          python -m unittest discover
          -s skills/sweep/tests
          -t skills/sweep
          -p "test_*.py"
          -v
      - name: Test Mission Control health
        run: >-
          python -m unittest discover
          -s skills/mission-control-health/tests
          -t skills/mission-control-health
          -p "test_*.py"
          -v
      - name: Test Herdr heartbeat H2 and reconciler
        run: >-
          python -m unittest discover
          -s skills/herdr/tests
          -t skills/herdr
          -p "test_*.py"
          -v
      - name: Test sweep assets
        run: sh skills/sweep/assets/test-assets.sh
      - name: Test context cleanup
        working-directory: skills/remove-gentle-context
        run: python -m unittest discover -s tests -t . -v
      - name: Compile context cleanup CLI
        working-directory: skills/remove-gentle-context
        run: python -m py_compile scripts/cleanup.py
      - name: Check context cleanup CLI
        working-directory: skills/remove-gentle-context
        run: python scripts/cleanup.py --help

  test:
    name: test (ubuntu-latest)
    needs:
      - classify
      - docs
      - runtime
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar resultados
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          test "$DOCS_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$RUNTIME_RESULT" = skipped
          else
            test "$RUNTIME_RESULT" = success
          fi
