name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-body:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - name: Validate PR body
        run: node packages/issue-lifecycle/bin/dagu-pr-body.mjs event
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}
    steps:
      # pull_request checks out the merge commit: HEAD^1 is the base branch, so a
      # depth of 2 is enough for the git fallback below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - id: workspaces
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          workspaces=$(node scripts/ci-workspaces.mjs changes)
          echo "workspaces=$workspaces" >> "$GITHUB_OUTPUT"
  # One job installs dependencies once, then runs every selected workspace's test
  # and typecheck concurrently; output is grouped per command.
  test:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Test and typecheck selected workspaces
        env:
          WORKSPACES: ${{ needs.changes.outputs.workspaces }}
        run: node scripts/ci-workspaces.mjs run
  validate:
    needs: [changes, test, pr-body]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY_RESULT: ${{ needs.pr-body.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WORKSPACES: ${{ needs.changes.outputs.workspaces }}
        run: node scripts/ci-workspaces.mjs aggregate
