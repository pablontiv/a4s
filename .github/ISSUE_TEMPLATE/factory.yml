name: Factory issue
description: Issue for the A4S factory (see packages/factory/CONTRACTS.md, "Issue contract")
labels: ["factory"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable checklist, one `- [ ] ...` item per line.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What must not be done here.
    validations:
      required: true
