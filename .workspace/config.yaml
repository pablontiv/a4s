---
workspace:
  purpose:
    outcome: >-
      A4S turns recurring multi-repository work into incremental capabilities
      for outer harnesses. Describe a capability as available only after its
      usable behavior has been delivered and verified.
    approach: >-
      Work adaptively because investigation and implementation reveal facts
      that an initial plan cannot settle. Agree on the result first, deliver
      verifiable increments, and revise the means when evidence changes.
  authority:
    source: >-
      This file, as integrated on the main branch, is the only normative
      source of this repository's way of working. A rule absent from it is
      not in force. A copy in a worktree or branch is a candidate until its
      PR is integrated.
    records: >-
      ADRs, specifications, plans, and reports record what was decided, when,
      and why; they do not govern. Records are append-only: an existing
      record is never edited, and a supersession is declared only in the new
      record that supersedes it.
    derived: >-
      The profile, AGENTS.md, README, and contract tests derive from this file.
      On conflict this file prevails and the derived artifact is corrected.
    mechanism: >-
      Skills and methods provide technique and read their policy from this
      file; they add no rule of their own.
    deviation: >-
      When an operator instruction contradicts this file, the executor names
      the affected rule and proceeds only after the operator explicitly
      approves that deviation for the bounded case. That approval waives the
      named repository control for that case, but never platform-enforced
      restrictions, credential safety, or an ambiguous destructive target.
      A deviation creates no lasting norm.
  roles:
    operator: >-
      States the need, chooses the result from investigated options, authorizes
      reserved actions, and approves normative changes to this way of working.
    executor: >-
      Investigates, proposes options and work units, coordinates the agreed
      scope, reports evidence and blockers, and returns changed decisions to
      the operator.
    implementer: >-
      Produces the assigned task result. The executor and implementer may be
      the same person or agent.
    reviewer: >-
      Checks the candidate against its acceptance criteria and applicable
      controls, independently of the implementer as accept_work.review
      requires.
  choose_work:
    intake: >-
      The operator presents a need. The executor investigates the repository,
      relevant records and documentation, and pertinent history. Proposals
      explain the available results, acceptance criteria, and their fit with
      purpose.outcome. The operator chooses the result.
    priority: >-
      Present dependencies, expected value for A4S, and material risks when
      proposing what to do next. The operator chooses the objective; the
      executor orders authorized tasks within its dependencies and scope.
    changed_decision: >-
      Adapt techniques and task sequence within the agreed result. When
      evidence changes the result, acceptance, scope, or authority, present
      updated options and obtain the operator's choice before proceeding.
    backlog_decisions: >-
      When presenting an existing Bead to the operator, the executor shows its human Description, Bead ID, observable Result, and Scope together. The human Description is primary; the Bead ID never substitutes for it. This presentation does not infer a value, affect readiness, mutate, or backfill the Bead; an absent field is shown as missing or unknown.
  define_work:
    units:
      epic: >-
        A non-executable objective grouping related tasks. State its result,
        boundaries, dependencies, and acceptance criteria of its own. It closes
        only after its tasks and those criteria have been verified.
      task: >-
        An executable unit with one accepted result, one primary kind, and a
        proportional Git-versioned artifact delivered by PR. An independent
        task needs no epic. Size the task for one execution session.
    classification: >-
      Classify a task by the result being accepted, not by the tools used or
      the format of its artifact. Split independently acceptable results of
      different kinds into separate tasks.
    kinds:
      research: >-
        Answer a question using identified sources and a stated comparison
        method. Deliver evidence, options, and a supported conclusion or
        decision. A written comparison of integration choices is research
        even though its artifact is Markdown.
      experiment: >-
        Test a question through an observable action. Agree on the expected
        observations and verdict conditions before running it; record the
        procedure, actual observations, verdict, provenance, and cleanup.
        A disposable run proving an integration path is an experiment even
        when it contains code.
      documentation: >-
        Deliver content for an identified audience and use in an agreed
        destination. Check it against authoritative sources and the validation
        required for its document class. A component usage guide is
        documentation.
      implementation: >-
        Change the system and verify the agreed behavior or preserved
        invariants. Features, bugfixes, and refactors are implementation:
        a bugfix starts from an observed symptom and investigates its cause
        during the task; a refactor checks that required behavior is preserved.
    beads: >-
      Beads represents objectives as epic and executable units as task. Each
      task carries exactly one label: kind-research, kind-experiment,
      kind-documentation, or kind-implementation. An epic has no kind label.
  prepare_work:
    shared_readiness: >-
      Before starting a task, agree on its result and acceptance criteria
      through the proposal-and-choice cycle. Record the initial state, scope
      and exclusions, applicable authority and invariants, dependencies,
      versioned artifact, and evidence required for each criterion. Classify
      each expected output as durable evidence, reproducible-disposable, or
      retained local evidence, and identify the exact resources its cleanup
      may remove. An epic also records its own observable criteria and child
      dependencies.
    by_kind:
      research: >-
        State the question, sources, comparison method, and what makes the
        answer sufficient for the pending decision.
      experiment: >-
        State the question, minimum procedure, environment, expected
        observations, verdict conditions, containment, and cleanup.
      documentation: >-
        State the audience, intended use, document class, sources,
        destination, required content, and validation.
      implementation: >-
        State the baseline, intended behavior or correction, constraints,
        applicable checks, and the end-to-end check from
        accept_work.end_to_end. An observed bug symptom is sufficient to
        begin diagnosis; its cause need not be assumed in advance.
    design: >-
      Implement a bounded task from its agreed result and criteria. Design
      and obtain approval for shared architecture, interfaces, or constraints
      before implementing tasks that depend on those decisions. Prefer direct,
      reversible operation over frameworks, migrations, or anticipated
      taxonomies, and apply DRY and KISS before adding a new layer.
    new_capability: >-
      Start with the smallest direct implementation whose risks and acceptance
      criteria are understood. Create a separate experiment only when a
      material unknown cannot be resolved safely inside the task; use its
      evidence to choose adoption, adaptation, or rejection before committing
      to a costly or hard-to-reverse design.
  do_work:
    starting_point: >-
      Before repository mutation, use the stable main checkout. Require the
      main branch and a clean working tree; run `git fetch origin main` and
      `git pull --ff-only origin main`, then verify the result. Work in a
      dedicated worktree under .workspace/worktrees/.
    safety: >-
      Inventory, planning, and other inspection never mutate. Stop any
      mutation whose precondition is ambiguous or cannot be verified,
      including unclear ownership, an unexpected path, a symlink, or an
      unsupported structure. A name or text match never authorizes deletion.
    modes:
      assignment: >-
        Execute the task or epic chosen by the operator within its agreed
        boundaries.
      autonomous: >-
        Select work across an epic or the A4S backlog only after an explicit
        operator request defining that scope. Report a blocked task and
        continue with independent executable tasks in scope. Stop when the
        scope has no executable work, a human decision is required, a
        finding is escalated under improve_work.review, a general control
        fails or remains unknown, or the operator cancels. A status question
        from the operator does not stop the loop.
      common_rule: >-
        Both modes use the same readiness, acceptance, review, delivery,
        security, and external-effect controls. Permission to select work
        does not by itself authorize a merge; only deliver_work.merge and
        reserved_authority do.
    investigation: >-
      Use a disposable probe only when a material unknown blocks a decision
      and a safe probe exists. State one question, run the smallest probe
      against no shared or production target, read its effect independently,
      classify the result as demonstrated, refuted, or inconclusive, and
      record the finding and verified cleanup. Never promote probe code into
      the product; an inconclusive result blocks only the dependent path.
      A probe does not replace the separate PoC task required for a new
      capability.
    external_effects: >-
      Inspect the real system read-only and establish its contract and
      variability. Derive local tests from sanitized observations, validate
      locally, and obtain operator authorization for the intended payload
      before a live mutation. Define signals, observation period, exit
      conditions, and recovery before the action; verify postconditions
      afterward. After a failed live attempt, establish its cause, reproduce
      it with a failing test, correct it, obtain independent review and
      renewed authorization before retrying.
    credentials: >-
      TypeSafe resolves credentials only through Pi's native provider.
      Store other services' credentials as SOPS ciphertext under
      .workspace/secrets/ and version public age recipient rules in
      .sops.yaml. Keep the private age identity in user configuration outside
      the repository. Decrypt only for an authorized operation; keep
      plaintext out of Git, logs, task evidence, and durable temporary files.
      Stop the credential-dependent action if its encrypted source or
      decryption identity cannot be established.
    knowledge: >-
      Keep decision records, specifications, plans, and durable research or
      experiment findings under .workspace/docs/, and use Rootline when
      consulting, writing, or validating Markdown there. Deliver a record in
      the same PR as the change it records. Component usage guides may live
      beside the component and must agree with this file. Keep execution
      evidence in the task record with links to versioned artifacts.
      AGENTS.md is a one-line entry that points to this file.
    decision_records: >-
      Record an ADR for an architectural change that other components, users,
      or future tasks depend on or that is costly to reverse: a contract
      between components, an external dependency or runtime, where state or
      data lives, or a security or credential boundary. Record ordinary policy
      corrections in the pull request. A refactor that keeps its interface, a
      bugfix, tests, and internal renames need no ADR.
    communication: >-
      Obtain operator approval before publishing a new issue or a substantive
      comment that changes commitments, scope, authority, or an external
      party's expected action. Routine factual status, evidence, and closure
      updates inside an already authorized task may be published without a
      separate approval. Pull requests and their descriptions need no prior
      approval. Publish generated text as the operator's own voice, without an
      AI disclosure on that ground alone.
    history: >-
      When prior work can affect the decision, run the official Backscroll
      preflight, search this project first, and widen once if empty. Search
      tool history for commands or errors when relevant. An unavailable
      required source remains unknown; current sources and this file govern
      over episodic history.
  accept_work:
    evidence: >-
      Map each agreed criterion to its check or observation and recorded
      result. Keep the durable evidence as a sanitized result in the task
      record with links to versioned artifacts. Raw session or provider
      output and other reproducible artifacts are disposable, not durable
      evidence, unless an acceptance criterion explicitly requires retention.
      Report passed, failed, unknown, or not applicable as appropriate.
      Accept a task only when its criteria and applicable controls have
      passed; accept an epic after its child results and its own criteria have
      been verified.
    kind_checks: >-
      Review research against its sources and conclusion. Check an
      experiment's independent observations, verdict, containment, and
      cleanup; a successful PoC authorizes a decision about operational
      work, not use of the PoC as a production capability. Validate and
      review documents against their sources and authority. Test changed
      software behavior and preserved invariants; a documentation-only
      task does not need newly written software tests.
    end_to_end: >-
      Require an end-to-end check when the task changes executable behavior
      and a safe representative entry point exists. Exercise the changed path
      in its real runtime or a non-production environment; run bundled scripts
      as real commands. Before a skill or agent definition is released or
      activated, invoke it in the consuming harness. During pre-release
      development, focused contract tests may verify behavior that cannot yet
      be activated. A pre-existing defect outside the changed path is recorded
      separately and does not fail a bounded task unless its acceptance
      criteria require that behavior. Documentation, research, configuration
      policy, and non-executable records need no end-to-end check.
    public_api: >-
      When an implementation changes a public API, updating its documentation
      is an acceptance criterion. A public API is a package's exports, a
      command or CLI, a skill's invocation and arguments, or a key of this
      file.
    review: >-
      Use one fresh independent review of the complete candidate when a PR
      changes executable behavior, a public API, a security or credential
      boundary, shared architecture, or this normative file. Prefer a reviewer
      from a different model family or provider when readily available; lack
      of one does not block delivery after the executor records a focused
      self-review. Documentation and other low-risk changes need source
      validation and diff review, not an additional reviewer by default.
      Do not stack specialist reviews when one complete review covers the
      acceptance criteria.
  deliver_work:
    mechanism: >-
      Deliver every task's proportional, Git-versioned artifact through a
      pull request. Use conventional commits with a `Bead: <id>` trailer, and
      run applicable checks before committing. Bot-authored PRs are exempt
      from the trailer. A task may be integrated
      before its epic is complete; report that distinction. If PR delivery
      is unavailable, preserve the candidate and stop delivery; never push
      directly to main.
    cadence: >-
      Integrate each task as soon as it is accepted. Consumers load a skill
      from this repository or a released version; A4S does not require a
      user-global skill installation.
    merge: >-
      Require applicable local checks, risk-based review under
      accept_work.review, no unresolved HIGH security findings, and passing
      remote CI when its jobs execute. Merge an accepted candidate promptly.
      A changed head requires new evidence only when the candidate diff or a
      relevant dependency changed; a history-only rebase may reuse review and
      focused local evidence after verifying an equivalent patch and passing
      required CI on the new head. Use --match-head-commit when supported.
    external_prs: >-
      A bot-authored PR, or any other PR the operator did not originate,
      passes the same merge controls as any other PR. Process it when the
      operator requests it or within an autonomous scope that includes it.
      Merge it when the controls pass. If a control fails, fix the cause in
      the same PR. If required remote CI cannot run, leave the PR pending and
      report the unavailable control; do not invent an implicit exception.
    close: >-
      Confirm the reviewed PR was integrated. In the stable main checkout,
      run `git fetch origin main` and `git pull --ff-only origin main`.
      Verify that the task record contains its durable evidence and exact
      cleanup set, that the PR head, task branch and dedicated worktree
      identities agree, and that no unintegrated change or retained output
      would be removed. Then delete reproducible-disposable outputs, remove
      the dedicated task worktree and local branch, and delete the remote
      branch when it still names the integrated PR head. Close only when main
      equals origin/main, `git status --porcelain` is empty, and those task
      resources are absent. A failed command, conflict, divergence, wrong
      branch, dirty tree, identity ambiguity or retained evidence blocks
      cleanup and closure.
    reserved_authority: >-
      Obtain explicit operator authorization for every change to this file
      and every live external effect or destructive cleanup that is not part
      of the bounded post-merge cleanup authorized by improve_work.cleanup.
      Authorization identifies the proposed action. It waives another control
      only when the operator explicitly approves a bounded deviation under
      workspace.authority.deviation.
  track_work:
    progress: >-
      Report accepted criteria and their evidence, pending criteria,
      dependencies, and blockers. A count of closed tasks is context,
      not the measure of an epic's completion.
    blockers: >-
      Record why a task is unready or failed and inform the operator.
      An autonomous loop skips that task and may continue independent
      authorized tasks; it never marks the blocked objective complete.
    controller_identity: env:PI_SESSION_ID
  improve_work:
    review: >-
      Review this way of working when an epic closes, a control misses an
      incident, or recurring delay or rework indicates a systemic problem.
      Batch related findings into one decision. A finding is evidence, not new
      scope: escalate only when it would change the current result, scope, or
      authority; otherwise record it for a later bounded review without
      creating work automatically.
    early_review: >-
      Review sooner after contradictory authority, an ineffective gate,
      an incident that passed a control, or recurring blockage or rework
      attributable to the process. The operator may request a review at
      any time.
    change: >-
      Propose a normative change with its reason, expected effect, and
      rollback. Apply it only after operator approval. Record an ADR only when
      the change establishes shared architecture, an external dependency,
      state ownership, or a security boundary; the pull request records other
      policy corrections. Preserve existing historical records.
    cleanup: >-
      After verified integration, cleanup is mandatory and preauthorized only
      for the exact task worktree, its local branch, a remote branch that still
      names the integrated PR head, and outputs classified in readiness as
      reproducible-disposable. First verify synchronized main, the merged PR
      and head identities, durable evidence in the task record, no
      unintegrated changes, and no retained output. If any identity,
      classification or postcondition is failed or unknown, delete nothing
      and block closure. Every other destructive cleanup requires explicit
      operator authorization.
  product:
    skills: >-
      Each skill is self-contained under skills/<name>/ with no dependency on
      sibling skills. Its SKILL.md declares metadata.author: pablontiv and
      metadata.updated: "YYYY-MM-DD"; update the date in the same commit that
      changes the skill's behavior or content, not for metadata-only changes.
      Roadmap may coordinate repository work but never edits its own files;
      Roadmap changes use a separate bounded change and the same risk-based
      controls as other skills.
    structure: >-
      Configuration and runtime are layers of the same product, not parallel
      products or decision logs. Add a top-level family only when it has real
      content.
    providers: >-
      Treat external runtimes and tools as integrated providers, not as A4S
      code. Projects listed in .workspace/docs/references/related-projects.md
      are references, not implicit migration candidates.
repository:
  id: pablontiv/a4s
  url: https://github.com/pablontiv/a4s.git
  base_branch: main
  entry_point: AGENTS.md
