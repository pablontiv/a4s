schema_version: workspace-control/v1

profile:
  id: pablontiv/a4s
  version: 2
  based_on:
    name: engineering-handbook
    version: "1.4"
    digest: f5455e3eced13690358b02823053a1e00a6c7c06de5f17d9716805bf0a0cff26

workspace:
  context_sources:
    - |
      Backscroll es obligatorio cuando la historia pueda afectar el trabajo:
      buscar primero por proyecto, ampliar una vez si no hay resultados y
      conservar unknown si la fuente requerida no está disponible.
  workflow:
    base_branch: main
    sync_strategy: |
      Antes de trabajo mutante, ejecutar pull explícito de origin/main sobre la
      rama base local. Si el pull falla, genera conflictos no resueltos o no
      puede verificarse, conservar unknown y detener la fase afectada.
    isolation_strategy: dedicated-worktree
    development_workflow: |
      Aplicar diseño proporcional e implementar directamente; usar un probe
      sólo cuando un unknown material requiera evidencia.
    commit_policy: |
      Usar conventional commits y ejecutar los checks aplicables antes del commit.
    delivery_mode: pull-request
    delivery_gate: |
      Merge autónomo por squash con --match-head-commit permitido cuando, para el SHA de cabeza del PR, se cumplen CADA UNO DE LOS: test/ci-local.sh en verde; aprobación de un reviewer subagente fresco sobre ese SHA; sin hallazgos de seguridad HIGH; marca 'Delivery-Override: ci-billing' mientras CI siga bloqueado; evidencia que registra el SHA y el resultado de cada gate (ADR 0047). Se mantiene gate humano (autorización explícita del operador) para: cambios a la política de delivery o autonomía (incluido este eje y delivery_overrides); efectos externos fuera del repositorio; operaciones destructivas; sustituir un ADR aceptado. Revocable volviendo este texto a gate humano.
    delivery_overrides:
      ci-billing:
        status: active
        adr: 0046-permitir-merge-de-pr-sin-ci-mientras-actions-este-bloqueado
        tracking_bead: a4s-1cy
        since: "2026-09-19"
        scope: |
          Sólo el gate de CI. La entrega sigue siendo pull-request; se permite
          mergear con checks en rojo únicamente si los jobs muestran la anotación
          de billing o spending limit con 0 steps.
        compensating_controls:
          - test/ci-local.sh debe ejecutarse en verde sobre el SHA candidato, con salida resumida en la evidencia.
          - Revisión del diff completo antes del merge.
          - Autorización del operador ligada al SHA o, en modo autónomo, los gates autónomos de delivery_gate registrados contra ese SHA (un cambio posterior invalida ambas).
          - Marca 'Delivery-Override: ci-billing' en el commit o cuerpo del PR.
        fallback: |
          Push directo a main sólo si un PR es imposible, con autorización explícita
          por caso y marca 'Delivery-Override: direct-push'.
        expires_when: |
          Un job de CI vuelve a iniciar (steps mayor que 0). Entonces ejecutar el
          workflow sobre la cabeza de main, abrir Bead de regresión ante fallo y
          retirar esta excepción.
  pre_checks:
    - Revisar el ADR aceptado que gobierna el cambio.
    - Confirmar Rootline antes de escribir conocimiento gobernado.
    - Consultar Backscroll cuando la historia pueda cambiar la decisión.
  acceptance_checks:
    - Mapear cada criterio de la spec aprobada a evidencia verificable.
  review_checks:
    - Obtener al menos una revisión antes de integrar.
  post_checks:
    - Confirmar que la revisión aprobada quedó realmente integrada.
    - Cierre obligatorio - pull y push. Hacer pull de origin/main y push de todo
      commit local de la entrega; verificar que main local y origin/main apuntan
      al mismo commit y que el working tree queda limpio. Sin esto no hay cierre.
  monitoring: |
    No aplica a cambios puramente documentales; el comportamiento operativo
    debe definir monitoreo antes de mutar sistemas externos.
  external_effects: |
    Operar read-only hasta obtener autorización explícita y ligada al payload.
  credential_policy: |
    Usar únicamente mecanismos declarados y no persistir secretos.
  knowledge_policy: |
    Rootline gobierna ADRs, specs, planes e historia bajo .workspace/docs/.
    No existe fallback activo a docs/.
  cleanup_policy: |
    Ofrecer cleanup y no eliminar automáticamente.
  custom_rules:
    - Las herramientas oficiales del perfil no admiten sustituciones implícitas.
    - La versión 2 declara compatibilidad únicamente con Pi.

groups:
  a4s:
    workflow:
      delivery_mode: pull-request

repositories:
  pablontiv/a4s:
    repo:
      id: pablontiv/a4s
      path: unknown
      group: a4s
      managed: true
      verified_revision: unknown
    context_sources:
      - AGENTS.md
