# dagu-feature-bundle: @a4s/omp-dagu@0.2.0 source=pablontiv/a4s@89aa686cbb6ca4fa2fc9275b4221b441af078c7a bootstrap=bootstrap-a4s-v0-2-0 dagu=2.26.0
labels:
  - workspace=a4s
  - dagu-feature-bundle=0.2.0
queue: a4s
type: graph
dotenv: []
shell: /run/current-system/sw/bin/bash
max_active_steps: 1
max_clean_up_time_sec: 120
params:
  - name: ISSUE
    type: string
    required: true
    pattern: '^[1-9][0-9]*$'
  - name: PR_NUMBER
    type: string
    default: ""
  - name: PRIMARY
    type: string
    required: true
  - name: BRANCH
    type: string
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
  - name: BASE_BRANCH
    type: string
    default: "dagu-14steps"
    pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
  - name: GATE
    type: string
    default: "bash scripts/gate.sh"
  - name: REQUIRED_CHECK
    type: string
    default: "validate"
  - name: OMP_SESSION_ID
    type: string
    default: ""
  - name: POC_BASIS
    type: string
    default: ""
env:
  - WORKTREE: ${PRIMARY}/.workspace/worktrees/issue-${ISSUE}
  - RUN: ${context.run.id}
  - DAGU_FEATURE_BUNDLE: "dagu-feature-bundle=0.2.0 source=pablontiv/a4s@89aa686cbb6ca4fa2fc9275b4221b441af078c7a bootstrap=bootstrap-a4s-v0-2-0"
steps:
  - id: triage
    action: human.task
    with:
      prompt: >-
        A PoC is required when implementation depends on unexercised external or
        runtime behavior that can change the implementation path. Reuse of demonstrated
        behavior proceeds directly. Bug reproduction is not a PoC.
        Provide POC=yes|no, QUESTION, BASIS (prior PASS/merged PR URL or reason),
        and REVIEW (reviewer subagent output reference, required for POC=no).
        For promotion cite this PASS URL as BASIS: ${POC_BASIS}.
      form:
        type: object
        properties:
          POC:
            type: string
            enum: ['yes', 'no']
          QUESTION:
            type: string
            minLength: 1
          BASIS:
            type: string
            minLength: 1
          REVIEW:
            type: string
        required: [POC, QUESTION, BASIS]

  - id: triage_decision
    depends: triage
    env:
      - POC: ${steps.triage.outputs.POC}
      - QUESTION: ${steps.triage.outputs.QUESTION}
      - BASIS: ${steps.triage.outputs.BASIS}
      - REVIEW: ${steps.triage.outputs.REVIEW}
    run: |
      set -euo pipefail
      verify_triage_reviewer() {
        local canonical home tmp encoded sessions_dir transcript expected_parent
        local rest triage_count cutoff required
        for required in PRIMARY OMP_SESSION_ID REVIEW RUN; do
          if [[ -z "${!required:-}" ]]; then
            printf 'check.params=FAIL name=%s\nVERIFIER=FAIL\n' "$required"
            return 1
          fi
        done
        printf 'check.params=PASS\n'
        case "$REVIEW" in
          ''|.|..|*[!A-Za-z0-9._-]*)
            printf 'check.review_name=FAIL value=%q\nVERIFIER=FAIL\n' "$REVIEW"
            return 1
            ;;
          *) printf 'check.review_name=PASS\n' ;;
        esac

        printf 'rest.url=http://127.0.0.1:%s/api/v1/dag-runs/feature/%s\n' "${DAGU_PORT:-8080}" "$RUN"
        if ! rest=$(curl -fsS "http://127.0.0.1:${DAGU_PORT:-8080}/api/v1/dag-runs/feature/$RUN"); then
          printf 'check.rest=FAIL\nVERIFIER=FAIL\n'
          return 1
        fi
        if ! triage_count=$(jq -er '[.dagRunDetails.nodes[]? | select(.step.id == "triage")] | length' <<<"$rest"); then
          printf 'check.rest_json=FAIL\nVERIFIER=FAIL\n'
          return 1
        fi
        printf 'triage.node_count=%s\n' "$triage_count"
        if [[ "$triage_count" != 1 ]]; then
          printf 'check.rest_triage_node=FAIL\nVERIFIER=FAIL\n'
          return 1
        fi
        if ! cutoff=$(jq -er '[.dagRunDetails.nodes[]? | select(.step.id == "triage")][0].startedAt | select(type == "string" and length > 0)' <<<"$rest"); then
          printf 'triage.startedAt=<missing>\ncheck.rest_triage_startedAt=FAIL\nVERIFIER=FAIL\n'
          return 1
        fi
        printf 'triage.startedAt=%s\ncheck.rest_triage_node=PASS\n' "$cutoff"

        if ! canonical=$(cd "$PRIMARY" 2>/dev/null && pwd -P); then
          printf 'check.primary=FAIL value=%q\nVERIFIER=FAIL\n' "$PRIMARY"
          return 1
        fi
        if ! home=$(cd "$HOME" 2>/dev/null && pwd -P); then
          printf 'check.home=FAIL value=%q\nVERIFIER=FAIL\n' "$HOME"
          return 1
        fi
        if ! tmp=$(cd "${TMPDIR:-/tmp}" 2>/dev/null && pwd -P); then
          printf 'check.tmp=FAIL value=%q\nVERIFIER=FAIL\n' "${TMPDIR:-/tmp}"
          return 1
        fi
        encode_relative() {
          local prefix=$1 relative=$2 result
          result=${relative//\//-}
          result=${result//\\/-}
          result=${result//:/-}
          if [[ -z "$result" ]]; then
            printf '%s' "$prefix"
          elif [[ "$prefix" == *- ]]; then
            printf '%s%s' "$prefix" "$result"
          else
            printf '%s-%s' "$prefix" "$result"
          fi
        }
        if [[ "$canonical" == "$tmp" ]]; then
          encoded=$(encode_relative -tmp '')
        elif [[ "$canonical" == "$tmp/"* ]]; then
          encoded=$(encode_relative -tmp "${canonical#"$tmp/"}")
        elif [[ "$canonical" == "$home" ]]; then
          encoded=$(encode_relative - '')
        elif [[ "$canonical" == "$home/"* ]]; then
          encoded=$(encode_relative - "${canonical#"$home/"}")
        else
          encoded=${canonical#/}
          encoded=${encoded//\//-}
          encoded=${encoded//\\/-}
          encoded=${encoded//:/-}
          encoded="--${encoded}--"
        fi
        sessions_dir="$HOME/.omp/agent/sessions/$encoded"
        printf 'primary.canonical=%s\nprimary.encoded=%s\nsessions.dir=%s\n' \
          "$canonical" "$encoded" "$sessions_dir"

        shopt -s nullglob
        matches=("$sessions_dir"/*_"$OMP_SESSION_ID"/"$REVIEW".jsonl)
        printf 'transcript.match_count=%d\n' "${#matches[@]}"
        if [[ ${#matches[@]} -ne 1 ]]; then
          printf 'session.parentSession=<unavailable>\n'
          printf 'session_init.agent=<unavailable>\n'
          printf 'session_init.task=<unavailable>\n'
          printf 'session_init.timestamp=<unavailable>\n'
          printf 'last_yield.details.data.poc=<unavailable>\n'
          printf 'check.transcript_unique=FAIL\nVERIFIER=FAIL\n'
          return 1
        fi
        transcript=${matches[0]}
        expected_parent="${transcript%/*}.jsonl"
        printf 'transcript.path=%s\nexpected.parentSession=%s\ncheck.transcript_unique=PASS\n' \
          "$transcript" "$expected_parent"

        jq -ser --arg expected_parent "$expected_parent" --arg run "$RUN" --arg cutoff "$cutoff" '
          def rfc3339_epoch:
            if type != "string" then null
            else try (
              capture("^(?<base>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})(?:\\.(?<frac>[0-9]+))?(?<zone>Z|(?<sign>[+-])(?<hour>[0-9]{2}):(?<minute>[0-9]{2}))$")
              | ((.base + "Z") | fromdateiso8601) as $base
              | (("0." + (.frac // "0")) | tonumber) as $fraction
              | (if .zone == "Z" then 0
                 else (((.hour | tonumber) * 3600 + (.minute | tonumber) * 60) * (if .sign == "+" then 1 else -1 end))
                 end) as $offset
              | $base + $fraction - $offset
            ) catch null end;
          . as $rows
          | ($rows | map(select(.type == "session")) | first) as $session
          | ($rows | map(select(.type == "session_init")) | first) as $init
          | ($rows | map(select(.type == "message" and .message.role == "toolResult" and .message.toolName == "yield")) | last) as $yield
          | ($init.timestamp | rfc3339_epoch) as $started
          | ($cutoff | rfc3339_epoch) as $cutoff_epoch
          | {
              fields: {
                parentSession: $session.parentSession,
                agent: $init.agent,
                task: $init.task,
                timestamp: $init.timestamp,
                poc: $yield.message.details.data.poc
              },
              checks: {
                parentSession: ($session.parentSession == $expected_parent),
                agent: ($init.agent == "triage-reviewer"),
                task: (($init.task // "") | contains("TRIAGE_REVIEW AGENT=triage-reviewer DAG=feature RUN=\($run) ")),
                timestamp: ($started != null and $cutoff_epoch != null and $started > $cutoff_epoch),
                poc: ($yield.message.details.data.poc == "no")
              }
            }
          | .overall = ([.checks[]] | all)
          | "session.parentSession=\(.fields.parentSession // "<missing>")",
            "session_init.agent=\(.fields.agent // "<missing>")",
            "session_init.task=\((.fields.task // "<missing>") | @json)",
            "session_init.timestamp=\(.fields.timestamp // "<missing>")",
            "last_yield.details.data.poc=\(.fields.poc // "<missing>")",
            "cutoff=\($cutoff)",
            "check.parentSession=\(if .checks.parentSession then "PASS" else "FAIL" end)",
            "check.agent=\(if .checks.agent then "PASS" else "FAIL" end)",
            "check.task_run_marker=\(if .checks.task then "PASS" else "FAIL" end)",
            "check.timestamp_after_cutoff=\(if .checks.timestamp then "PASS" else "FAIL" end)",
            "check.last_yield_poc_no=\(if .checks.poc then "PASS" else "FAIL" end)",
            "VERIFIER=\(if .overall then "PASS" else "FAIL" end)",
            (if .overall then empty else halt_error(1) end)
        ' "$transcript"
      }
      if [[ "$POC" == no ]]; then
        verify_triage_reviewer
      fi

      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      mkdir -p "$STATE"
      if test -f "$STATE/dependencies"; then
        cp "$STATE/dependencies" "$STATE/reviewed-dependencies"
      fi
      {
        printf '<!-- poc-triage:%s run:%s -->\n\n' "$POC" "$RUN"
        printf '## Pregunta\n\n%s\n\n## BASIS\n\n%s\n\n## REVIEW\n\n%s\n' "$QUESTION" "$BASIS" "${REVIEW:-}"
      } > "$STATE/triage.md"
      cd "$PRIMARY"
      gh issue comment "$ISSUE" --body-file "$STATE/triage.md"
      if [[ "$POC" == yes ]]; then
        dagu enqueue --queue a4s --labels "issue=$ISSUE,kind=poc" --run-id "poc-$RUN" "$PRIMARY/.workspace/dagu/dags/poc.yaml" -- \
          ISSUE="$ISSUE" QUESTION="$QUESTION" PRIMARY="$PRIMARY" BASE_BRANCH="$BASE_BRANCH" \
          OMP_SESSION_ID="$OMP_SESSION_ID"
      fi

  - id: start_gate
    depends: triage_decision
    env:
      - POC: ${steps.triage.outputs.POC}
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "no"
    run: |
      set -euo pipefail
      printf '%s\n' "$DAGU_FEATURE_BUNDLE"
      umask 0022
      test -n "$PRIMARY"
      test -n "$GATE" && test -n "$REQUIRED_CHECK"
      test "$(git -C "$PRIMARY" rev-parse --show-toplevel)" = "$PRIMARY"
      test "$(git -C "$PRIMARY" rev-parse --absolute-git-dir)" = "$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-common-dir)"
      git -C "$PRIMARY" check-ignore -q "$WORKTREE"
      test "$(git -C "$PRIMARY" branch --show-current)" = "$BASE_BRANCH"
      test -z "$(git -C "$PRIMARY" status --porcelain)"
      git -C "$PRIMARY" fetch origin
      git -C "$PRIMARY" merge --ff-only "origin/$BASE_BRANCH"
      if test -e "$WORKTREE"; then
        test "$(git -C "$WORKTREE" rev-parse --show-toplevel)" = "$WORKTREE"
        test "$(git -C "$WORKTREE" branch --show-current)" = "$BRANCH"
        test -z "$(git -C "$WORKTREE" status --porcelain)"
      fi
      git -C "$PRIMARY" rev-parse --verify "origin/$BASE_BRANCH^{commit}"

  - id: worktree
    depends: start_gate
    working_dir: ${PRIMARY}
    action: git.worktree.add
    with:
      path: ${WORKTREE}
      branch: ${BRANCH}
      create_branch: true
      # Dagu prefixes refs/heads/ and refs/remotes/origin/; start_gate fast-forwards BASE_BRANCH to origin.
      base: ${BASE_BRANCH}

  - id: implement
    depends: worktree
    action: human.task
    with:
      prompt: "Implement issue #${ISSUE} in ${WORKTREE}. Leave one commit on ${BRANCH} rebased onto origin/${BASE_BRANCH}, with conflicts resolved, and a clean worktree. After a conflict push-back, the files are listed in <git-dir>/dagu-feature/runs/${RUN}/conflict-files."

  - id: checkpoint_push
    outputs:
      - name: action
    depends: implement
    run: |
      set -euo pipefail
      umask 0022
      test "$(git -C "$WORKTREE" branch --show-current)" = "$BRANCH"
      test -z "$(git -C "$WORKTREE" status --porcelain)"
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      repo=$WORKTREE base=$(git -C "$WORKTREE" merge-base HEAD "origin/$BASE_BRANCH") head=HEAD
      blob() { git -C "$repo" show "$1:$2" 2>/dev/null || true; }
      extract() {
        jq -Rrs --arg path "$1" '
          def matches($r): [scan($r) | if type == "array" then .[0] else . end] | unique;
          if $path | endswith("package.json") then
            (fromjson? // {}) | [.dependencies, .devDependencies, .peerDependencies, .optionalDependencies] | map(. // {} | keys) | add | unique
          elif $path | endswith("go.mod") then
            matches("(?m)^\\s*(?:require\\s+)?([A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+)\\s+v[0-9]")
          elif $path | test("(^|/)requirements[^/]*\\.txt$") then
            matches("(?m)^\\s*([A-Za-z0-9][A-Za-z0-9_.-]*)(?:\\[|[<>=!~; ]|$)")
          elif $path | endswith("pyproject.toml") then
            ([scan("(?s)(?:dependencies|optional-dependencies)\\s*=\\s*\\[(.*?)\\]") | .[0] | scan("[\"\u0027]([A-Za-z0-9][A-Za-z0-9_.-]*)") | .[0]] +
             [scan("(?ms)^\\[(?:tool\\.poetry(?:\\.group\\.[^.]+)?\\.dependencies)\\]\\s*([^\\[]*)") | .[0] | scan("(?m)^([A-Za-z0-9_.-]+)\\s*=") | .[0]]) | unique
          elif $path | test("\\.(csproj|props)$") then
            matches("<(?:PackageReference|PackageVersion)\\s+Include=\"([^\"]+)\"")
          elif $path | test("\\.ya?ml$") then
            ([scan("(?m)^\\s*(image|chart|url):\\s*[\"\u0027]?([^\\s\"\u0027]+)") | if .[0] == "image" then .[1] | sub("(@sha256:.*|:[^/:]+)$"; "") else .[1] end] +
             (if $path | endswith("Chart.yaml") then
               [scan("(?ms)^dependencies:\\s*(.*)") | .[0] | scan("(?m)^\\s*-\\s*name:\\s*([^\\s]+)") | .[0]]
              else [] end)) | unique
          else [] end
        '
      }
      relationships() {
        git -C "$repo" ls-tree -r --name-only "$1" |
        jq -Rr 'select(test("(^|/)(package\\.json|go\\.mod|pyproject\\.toml|requirements[^/]*\\.txt)$|\\.(ya?ml|csproj|props)$"))' |
        while IFS= read -r path; do
          dependencies=$(blob "$1" "$path" | extract "$path")
          jq -nr --arg path "$path" --argjson dependencies "$dependencies" \
            '$dependencies[] | "dependency\t\($path)\t\(.)"'
        done |
        jq -Rsc 'split("\n") | map(select(length > 0)) | unique'
      }
      base_relationships=$(relationships "$base")
      head_relationships=$(relationships "$head")
      jq -nr --argjson before "$base_relationships" --argjson after "$head_relationships" \
        '$after - $before | .[]' > "$STATE/dependencies"
      dirs() {
        git -C "$repo" ls-tree -r --name-only "$1" | jq -Rrs '
          split("\n") | map(select(length > 0)) | map(
            if test("^(packages|apps|extensions)/[^/]+/") then split("/")[0:2] | join("/")
            elif test("^(\\.pi|\\.omp)/extensions/[^/]+") then split("/")[0:3] | join("/")
            elif endswith("/__init__.py") then sub("/__init__\\.py$"; "")
            elif endswith("/package.json") or endswith("/go.mod") or endswith("/pyproject.toml") then split("/")[0:-1] | join("/")
            else empty end) | unique'
      }
      before=$(dirs "$base")
      after=$(dirs "$head")
      jq -nr --argjson before "$before" --argjson after "$after" '$after - $before | .[] | "package-or-extension\t\(.)"' >> "$STATE/dependencies"
      if test -s "$STATE/dependencies" && ! cmp -s "$STATE/dependencies" "$STATE/reviewed-dependencies"; then
        review_action=rewind
      else
        review_action=complete
      fi
      git -C "$WORKTREE" push --force-with-lease --set-upstream origin "HEAD:$BRANCH"
      printf 'checkpoint_sha=%s\n' "$(git -C "$WORKTREE" rev-parse HEAD)"
      printf 'action=%s\n' "$review_action" >> "$DAGU_OUTPUT_FILE"

  - id: dependency_action
    depends: checkpoint_push
    action: state.set
    with:
      key: issue-${ISSUE}/${RUN}/review-action
      value: ${steps.checkpoint_push.outputs.action}

  - id: dependency_review
    depends: dependency_action
    action: human.task
    with:
      prompt: "Dependency net checkpoint: the scheduled reconciler completes unchanged dependencies or pushes back to triage."
      push_back:
        rewind_to: triage

  - id: rebase
    outputs:
      - name: action
    depends: dependency_review
    run: |
      set -euo pipefail
      umask 0022
      test "$(git -C "$WORKTREE" branch --show-current)" = "$BRANCH"
      test -z "$(git -C "$WORKTREE" status --porcelain)"
      git -C "$WORKTREE" fetch origin
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      if git -C "$WORKTREE" rebase "origin/$BASE_BRANCH"; then
        printf 'action=complete\n' >> "$DAGU_OUTPUT_FILE"
        test "$(git -C "$WORKTREE" rev-list --count "origin/$BASE_BRANCH..HEAD")" -eq 1
        printf 'rebased_sha=%s\n' "$(git -C "$WORKTREE" rev-parse HEAD)"
      else
        git -C "$WORKTREE" diff --name-only --diff-filter=U > "$STATE/conflict-files"
        git -C "$WORKTREE" rebase --abort
        test -z "$(git -C "$WORKTREE" status --porcelain)"
        test -s "$STATE/conflict-files"
        printf 'action=rewind\n' >> "$DAGU_OUTPUT_FILE"
        sed 's/^/conflict_files=/' "$STATE/conflict-files"
        exit 0
      fi

  - id: conflict_action
    depends: rebase
    action: state.set
    with:
      key: issue-${ISSUE}/${RUN}/review-action
      value: ${steps.rebase.outputs.action}

  - id: conflict_review
    depends: conflict_action
    action: human.task
    with:
      prompt: "Rebase conflict checkpoint: the scheduled reconciler completes a clean rebase or pushes back to implement with the conflict files."
      push_back:
        rewind_to: implement

  - id: gate
    depends: conflict_review
    retry_policy:
      limit: 1
      interval_sec: 5
    run: |
      set -euo pipefail
      umask 0022
      cd "$WORKTREE"
      env -u GH_TOKEN -u GITHUB_TOKEN bash -euo pipefail -c "$GATE"
      test -z "$(git status --porcelain)"
      printf 'tested_sha=%s\n' "$(git rev-parse HEAD)"

  - id: push
    depends: gate
    run: |
      set -euo pipefail
      umask 0022
      git -C "$WORKTREE" push --force-with-lease --set-upstream origin "HEAD:$BRANCH"

  - id: pr
    depends: push
    run: |
      set -euo pipefail
      cd "$WORKTREE"
      if test -n "$PR_NUMBER"; then
        test "$(gh pr view "$PR_NUMBER" --json state --jq .state)" = OPEN
        test "$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)" = "$BRANCH"
        gh pr view "$PR_NUMBER" --json number,url,headRefOid
      elif gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
        gh pr view "$BRANCH" --json number,url,headRefOid
      else
        gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --fill --body "Closes #${ISSUE}"
      fi

  - id: auto_merge
    outputs:
      - name: repo
      - name: pr
    depends: pr
    run: |
      set -euo pipefail
      cd "$WORKTREE"
      sha=$(git rev-parse HEAD)
      pr_ref=${PR_NUMBER:-$BRANCH}
      test "$(gh pr view "$pr_ref" --json headRefOid --jq .headRefOid)" = "$sha"
      gh pr merge "$pr_ref" --auto --squash --match-head-commit "$sha"
      printf 'repo=%s\npr=%s\n' \
        "$(gh repo view --json nameWithOwner --jq .nameWithOwner)" \
        "$(gh pr view "$pr_ref" --json number --jq .number)" >> "$DAGU_OUTPUT_FILE"
      printf 'head_sha=%s\n' "$sha"

  - id: await_merge
    depends: auto_merge
    action: dag.run
    with:
      dag: poll-pr-merged
      params:
        REPO: ${steps.auto_merge.outputs.repo}
        PR: ${steps.auto_merge.outputs.pr}
    output: MERGE_POLL_RESULT
    repeat_policy:
      repeat: until
      condition: ${MERGE_POLL_RESULT.outputValues.ready}
      expected: "true"
      interval_sec: 60

  - id: verify_merge_poll
    depends: await_merge
    env:
      MERGED: ${MERGE_POLL_RESULT.outputValues.merged}
      RECOVERY: ${MERGE_POLL_RESULT.outputValues.recovery}
      OBSERVATION: ${MERGE_POLL_RESULT.outputValues.observation}
    run: |
      set -euo pipefail
      printf 'merge observation: %s\n' "$OBSERVATION" >&2
      test "$MERGED" = true || test "$RECOVERY" = true

  - id: merge_review
    depends: verify_merge_poll
    preconditions:
      - condition: ${MERGE_POLL_RESULT.outputValues.recovery}
        expected: "true"
    continue_on: skipped
    action: human.task
    with:
      prompt: "PR is BEHIND or DIRTY. The scheduled reconciler pushes back to rebase, reruns the gate, pushes and enables guarded auto-merge again."
      push_back:
        rewind_to: rebase

  - id: verify_merged
    depends: merge_review
    env:
      MERGED: ${MERGE_POLL_RESULT.outputValues.merged}
    run: |
      set -euo pipefail
      test "$MERGED" = true

  - id: close_gate
    depends: verify_merged
    action: dag.run
    with:
      dag: close-feature
      params:
        ISSUE: ${ISSUE}
        RUN: ${RUN}
        PRIMARY: ${PRIMARY}
        WORKTREE: ${WORKTREE}
        BRANCH: ${BRANCH}
        BASE_BRANCH: ${BASE_BRANCH}
        PR_NUMBER: ${steps.auto_merge.outputs.pr}
        REQUIRED_CHECK: ${REQUIRED_CHECK}

handler_on:
  exit:
    action: dag.run
    with:
      dag: report-feature-exit
      params:
        ISSUE: ${ISSUE}
        RUN: ${RUN}
        PRIMARY: ${PRIMARY}
        WORKTREE: ${WORKTREE}
        BRANCH: ${BRANCH}

---
name: poll-pr-merged
type: graph
shell: /run/current-system/sw/bin/bash
params:
  - name: REPO
    required: true
  - name: PR
    required: true
secrets:
  - name: GH_TOKEN
    provider: env
    key: GH_TOKEN
steps:
  - id: get_pr
    action: http.request
    with:
      method: GET
      url: https://api.github.com/repos/${REPO}/pulls/${PR}
      headers:
        Authorization: Bearer ${GH_TOKEN}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
      json: true
      timeout: 30
    output:
      body:
        from: stdout
        decode: json
        select: .body

  - id: is_merged
    depends: get_pr
    action: jq.filter
    with:
      filter: .merged
      data: ${steps.get_pr.outputs.body}
    stdout:
      outputs:
        field: merged
        decode: json

  - id: classify_pr
    stdout:
      outputs:
        decode: json
    depends: is_merged
    env:
      RESPONSE: ${steps.get_pr.outputs.body}
      MERGED: ${steps.is_merged.outputs.merged}
    run: |
      set -euo pipefail
      test "$MERGED" = true || test "$MERGED" = false
      state=$(jq -er '.state | ascii_upcase' <<< "$RESPONSE")
      merge_state=$(jq -r '.mergeable_state // "UNKNOWN" | ascii_upcase' <<< "$RESPONSE")
      active=$(jq -r '.auto_merge != null' <<< "$RESPONSE")
      draft=$(jq -r '.draft' <<< "$RESPONSE")
      ready=true recovery=false
      if test "$MERGED" = true; then
        :
      elif test "$state" = OPEN && test "$draft" = false && test "$active" = true; then
        case "$merge_state" in
          BEHIND|DIRTY) recovery=true ;;
          CLEAN|BLOCKED|UNSTABLE|UNKNOWN) ready=false ;;
        esac
      fi
      jq -cn --argjson ready "$ready" --argjson recovery "$recovery" \
        --arg observation "state=$state/mergeStateStatus=$merge_state/autoMerge=$active/draft=$draft" \
        '{ready: $ready, recovery: $recovery, observation: $observation}'

---
name: close-feature
type: graph
shell: /run/current-system/sw/bin/bash
params:
  - name: ISSUE
    required: true
  - name: RUN
    required: true
  - name: PRIMARY
    required: true
  - name: WORKTREE
    required: true
  - name: BRANCH
    required: true
  - name: BASE_BRANCH
    required: true
  - name: PR_NUMBER
    required: true
  - name: REQUIRED_CHECK
    required: true
steps:
  - id: reset_close_gate
    action: state.delete
    with:
      scope: root_dag
      key: issue-${ISSUE}/${RUN}/close-gate-succeeded

  - id: prepare_close_gate
    outputs:
      - name: worktree
      - name: pr
      - name: tested_sha
      - name: origin_base_sha
    depends: reset_close_gate
    run: |
      set -euo pipefail
      umask 0022
      fail() { printf 'close_gate: %s\n' "$*" >&2; exit 1; }
      repo=$(git -C "$PRIMARY" remote get-url origin) ||
        fail "PRIMARY $PRIMARY origin lookup failed, expected repository"
      pr_ref=${PR_NUMBER:-$BRANCH}
      if ! pr=$(gh pr view "$pr_ref" --repo "$repo" --json number --jq .number); then
        fail "PR lookup for $pr_ref failed, expected PR number"
      fi
      [[ -n "$pr" ]] || fail "PR lookup for $pr_ref returned empty, expected PR number"
      state=$(gh pr view "$pr" --repo "$repo" --json state --jq .state) ||
        fail "PR #$pr state lookup failed, expected MERGED"
      [[ "$state" == MERGED ]] || fail "PR #$pr state=$state, expected MERGED"
      tested_sha=$(gh pr view "$pr" --repo "$repo" --json headRefOid --jq .headRefOid) ||
        fail "PR #$pr headRefOid lookup failed, expected tested SHA"
      branch_sha=$(git -C "$PRIMARY" rev-parse "refs/heads/$BRANCH") ||
        fail "local branch $BRANCH lookup failed, expected $tested_sha"
      [[ "$branch_sha" == "$tested_sha" ]] ||
        fail "local branch $BRANCH SHA=$branch_sha, expected $tested_sha"
      check_state=$(gh pr checks "$pr" --repo "$repo" --required --json name,state \
        --jq 'map(select(.name == env.REQUIRED_CHECK)) | if length == 0 then "MISSING" else .[0].state end') ||
        fail "required check $REQUIRED_CHECK lookup failed, expected SUCCESS"
      [[ "$check_state" == SUCCESS ]] ||
        fail "required check $REQUIRED_CHECK state=$check_state, expected SUCCESS"
      primary_branch=$(git -C "$PRIMARY" branch --show-current) ||
        fail "PRIMARY $PRIMARY branch lookup failed, expected $BASE_BRANCH"
      [[ "$primary_branch" == "$BASE_BRANCH" ]] ||
        fail "PRIMARY $PRIMARY on branch $primary_branch, expected $BASE_BRANCH"
      primary_status=$(git -C "$PRIMARY" status --porcelain --untracked-files=no) ||
        fail "PRIMARY $PRIMARY status lookup failed, expected clean"
      if [[ -n "$primary_status" ]]; then
        printf 'close_gate: PRIMARY %s has local changes, expected clean\n' "$PRIMARY" >&2
        printf '%s\n' "$primary_status" >&2
        exit 1
      fi
      git -C "$PRIMARY" fetch origin ||
        fail "PRIMARY $PRIMARY fetch origin failed, expected success"
      git -C "$PRIMARY" merge --ff-only "origin/$BASE_BRANCH" ||
        fail "PRIMARY $PRIMARY ff-only merge failed, expected origin/$BASE_BRANCH"
      base_sha=$(git -C "$PRIMARY" rev-parse HEAD) ||
        fail "PRIMARY $PRIMARY HEAD lookup failed, expected origin/$BASE_BRANCH"
      origin_base_sha=$(git -C "$PRIMARY" rev-parse "origin/$BASE_BRANCH") ||
        fail "origin/$BASE_BRANCH lookup failed, expected commit SHA"
      [[ "$base_sha" == "$origin_base_sha" ]] ||
        fail "PRIMARY $PRIMARY HEAD=$base_sha, expected $origin_base_sha"
      worktree_real=$(cd "$WORKTREE" && pwd -P) ||
        fail "worktree $WORKTREE canonicalization failed, expected directory"
      printf 'worktree=%s\npr=%s\ntested_sha=%s\norigin_base_sha=%s\n' "$worktree_real" "$pr" "$tested_sha" "$origin_base_sha" >> "$DAGU_OUTPUT_FILE"

  - id: remove_worktree
    depends: prepare_close_gate
    working_dir: ${PRIMARY}
    action: git.worktree.remove
    with:
      path: ${steps.prepare_close_gate.outputs.worktree}
      branch: ${BRANCH}
      delete_branch: true
      force_delete_branch: true

  - id: finish_close_gate
    depends: remove_worktree
    env:
      worktree_real: ${steps.prepare_close_gate.outputs.worktree}
      pr: ${steps.prepare_close_gate.outputs.pr}
      tested_sha: ${steps.prepare_close_gate.outputs.tested_sha}
      origin_base_sha: ${steps.prepare_close_gate.outputs.origin_base_sha}
    run: |
      set -euo pipefail
      fail() { printf 'close_gate: %s\n' "$*" >&2; exit 1; }
      git -C "$PRIMARY" worktree prune ||
        fail "worktree prune failed, expected success"
      git -C "$PRIMARY" fetch --prune origin ||
        fail "origin prune failed, expected success"
      remote=absent
      if git -C "$PRIMARY" show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
        git -C "$PRIMARY" push origin --delete "$BRANCH" ||
          fail "remote branch $BRANCH deletion failed, expected removed"
        remote=deleted
      fi
      git -C "$PRIMARY" fetch --prune origin ||
        fail "origin final prune failed, expected success"
      worktree_list=$(git -C "$PRIMARY" worktree list --porcelain) ||
        fail "worktree list failed, expected readable"
      if [[ -e "$WORKTREE" || -e "$worktree_real" ]] ||
         grep -Fqx "worktree $WORKTREE" <<<"$worktree_list" ||
         grep -Fqx "worktree $worktree_real" <<<"$worktree_list"; then
        fail "worktree $WORKTREE remains, expected removed"
      fi
      if git -C "$PRIMARY" show-ref --verify --quiet "refs/heads/$BRANCH"; then
        fail "local branch $BRANCH remains, expected removed"
      fi
      if git -C "$PRIMARY" show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
        fail "remote branch $BRANCH remains, expected removed"
      fi
      primary_branch=$(git -C "$PRIMARY" branch --show-current) ||
        fail "PRIMARY $PRIMARY final branch lookup failed, expected $BASE_BRANCH"
      [[ "$primary_branch" == "$BASE_BRANCH" ]] ||
        fail "PRIMARY $PRIMARY on branch $primary_branch, expected $BASE_BRANCH"
      primary_status=$(git -C "$PRIMARY" status --porcelain --untracked-files=no) ||
        fail "PRIMARY $PRIMARY final status lookup failed, expected clean"
      [[ -z "$primary_status" ]] || fail "PRIMARY $PRIMARY has local changes, expected clean"
      base_sha=$(git -C "$PRIMARY" rev-parse HEAD) ||
        fail "PRIMARY $PRIMARY final HEAD lookup failed, expected $origin_base_sha"
      [[ "$base_sha" == "$origin_base_sha" ]] ||
        fail "PRIMARY $PRIMARY HEAD=$base_sha, expected $origin_base_sha"
      printf 'pr=%s\ntested_sha=%s\nbase_sha=%s\ncleanup worktree=%s branch=%s remote=%s\n' \
        "$pr" "$tested_sha" "$base_sha" "$WORKTREE" "$BRANCH" "$remote"

  - id: mark_close_gate
    depends: finish_close_gate
    action: state.set
    with:
      scope: root_dag
      key: issue-${ISSUE}/${RUN}/close-gate-succeeded
      value: true

---
name: report-feature-exit
type: graph
shell: /run/current-system/sw/bin/bash
params:
  - name: ISSUE
    required: true
  - name: RUN
    required: true
  - name: PRIMARY
    required: true
  - name: WORKTREE
    required: true
  - name: BRANCH
    required: true
steps:
  - id: close_state
    action: state.get
    with:
      scope: root_dag
      key: issue-${ISSUE}/${RUN}/close-gate-succeeded
      default: false
    output: CLOSE_STATE

  - id: report_exit
    depends: close_state
    env:
      CLOSED: ${CLOSE_STATE.value}
    run: |
      set -euo pipefail
      if test "$CLOSED" = true; then
        printf 'Cleanup completed by close_gate: branch %s; worktree %s\n' "$BRANCH" "$WORKTREE"
      else
        printf 'Work kept: branch %s; worktree %s\n' "$BRANCH" "$WORKTREE"
        printf 'Recovery: inspect run %s and retry its failed step using the locations above.\n' "$RUN"
      fi

