type: graph
dotenv: []
shell: bash
max_active_steps: 1
params:
  - name: PRIMARY
    type: string
    required: true
  - name: SKILL_DIR
    type: string
    required: true
  - name: BASE_BRANCH
    type: string
    default: ""
steps:
  - id: detect
    run: |
      set -euo pipefail
      for tool in git gh jq dagu python3 dagu-codeql dagu-feature-bundle dagu-feature-protect dagu-gate dagu-poc-scope dagu-pr-body dagu-role-jobs dagu-stale-recovery; do
        command -v "$tool" >/dev/null || { printf 'bootstrap detect: required command not found: %s\n' "$tool" >&2; exit 1; }
      done
      python3 -c 'import fcntl'
      gh auth status >/dev/null
      test -f "$SKILL_DIR/feature.yaml"
      test -f "$SKILL_DIR/poc.yaml"
      test -f "$SKILL_DIR/discovery.yaml"
      test -f "$SKILL_DIR/planning.yaml"
      test -f "$SKILL_DIR/reconcile.yaml"
      package_dir=$(cd "$SKILL_DIR/../.." && pwd -P)
      package_json="$package_dir/package.json"
      test -f "$package_json"
      bundle_name=$(jq -er '.name | select(type == "string" and length > 0)' "$package_json")
      bundle_version=$(jq -er '.version | select(type == "string" and length > 0)' "$package_json")
      source_root=$(git -C "$SKILL_DIR" rev-parse --show-toplevel)
      package_prefix=$(git -C "$package_dir" rev-parse --show-prefix)
      test -z "$(git -C "$source_root" status --porcelain --untracked-files=all -- "${package_prefix%/}")"
      source_sha=$(git -C "$source_root" rev-parse HEAD)
      test "${#source_sha}" = 40
      git -C "$source_root" fetch origin
      git -C "$source_root" remote set-head origin -a >/dev/null
      source_default=$(git -C "$source_root" symbolic-ref --quiet refs/remotes/origin/HEAD)
      git -C "$source_root" merge-base --is-ancestor "$source_sha" "$source_default"
      source_url=$(git -C "$source_root" remote get-url origin)
      source_path=${source_url#git@*:}
      source_path=${source_path#http://*/}
      source_path=${source_path#https://*/}
      source_path=${source_path#ssh://*/}
      source_path=${source_path#file://}
      source_path=${source_path%.git}
      source_path=${source_path%/}
      source_repo=${source_path##*/}
      source_owner_path=${source_path%/*}
      source_owner=${source_owner_path##*/}
      test -n "$source_owner" && test -n "$source_repo"
      source_nwo="$source_owner/$source_repo"
      dagu_version=$(dagu version)
      test "$(git -C "$PRIMARY" rev-parse --show-toplevel)" = "$PRIMARY"
      test "$(git -C "$PRIMARY" rev-parse --absolute-git-dir)" = "$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-common-dir)"
      cd "$PRIMARY"
      repo=$(gh repo view --json name --jq .name)
      nwo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
      base=${BASE_BRANCH:-$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)}
      git check-ref-format "refs/heads/$base"
      gh api "repos/$nwo/branches/$base" >/dev/null
      if ! required=$(gh api "repos/$nwo/branches/$base/protection/required_status_checks" --jq '.contexts | join(",")' 2>/dev/null); then
        required=""
      fi
      last_pr=$(gh pr list --state merged --limit 1 --json number --jq '.[0].number // empty')
      checks=""
      if test -n "$last_pr"; then
        checks=$(gh pr checks "$last_pr" --json name --jq '[.[].name] | unique | join(",")' 2>/dev/null || true)
      fi
      config_file="$(pwd -P)/.workspace/dagu/config.json"
      current_queue_concurrency=1
      current_gate=not-configured
      current_check=not-configured
      current_tests=not-configured
      current_resolver=""
      current_validation=""
      current_blocker_reporting=ask
      current_codeql_security=high_or_higher
      current_codeql_alerts=errors
      current_code_scanning=required
      if test -f "$config_file"; then
        current_gate=$(jq -er '.gate' "$config_file")
        current_check=$(jq -er '.requiredCheck' "$config_file")
        current_resolver=$(jq -er '.rebaseResolver' "$config_file")
        current_validation=$(jq -er '.validation' "$config_file")
        current_blocker_reporting=$(jq -er '.blockerReporting' "$config_file")
        current_codeql_security=$(jq -er '.codeqlSecurityThreshold' "$config_file")
        current_codeql_alerts=$(jq -er '.codeqlAlertsThreshold' "$config_file")
        current_code_scanning=$(jq -er '.codeScanning' "$config_file")
        current_tests=$(jq -er '.testPaths' "$config_file")
        current_queue_concurrency=$(jq -er '.queueConcurrency' "$config_file")
      fi
      for entry in pushbacks:PUSHBACKS:3 findings:FINDINGS:2 seconds:SECONDS:3600 ciBlocked:CI_BLOCKED:2 pocInconclusive:POC_INCONCLUSIVE:2; do
        field=${entry%%:*}
        rest=${entry#*:}
        key="ESCALATION_${rest%%:*}"
        fallback=${rest#*:}
        value=""
        if test -f "$config_file"; then value=$(jq -er --arg field "$field" '.escalation[$field]' "$config_file"); fi
        printf 'CURRENT_%s=%s\n' "$key" "${value:-$fallback}" >> "$DAGU_OUTPUT_FILE"
      done
      {
        printf 'REPO=%s\n' "$repo"
        printf 'NWO=%s\n' "$nwo"
        printf 'BASE_BRANCH=%s\n' "$base"
        printf 'REQUIRED_NOW=%s\n' "${required:-none}"
        printf 'RECENT_CHECKS=%s\n' "${checks:-none}"
        printf 'STAGE=%s\n' "$config_file"
        printf 'BUNDLE_NAME=%s\n' "$bundle_name"
        printf 'BUNDLE_VERSION=%s\n' "$bundle_version"
        printf 'DAGU_VERSION=%s\n' "$dagu_version"
        printf 'SOURCE_NWO=%s\n' "$source_nwo"
        printf 'SOURCE_SHA=%s\n' "$source_sha"
        printf 'CURRENT_GATE=%s\n' "${current_gate:-not-configured}"
        printf 'CURRENT_REQUIRED_CHECK=%s\n' "${current_check:-not-configured}"
        printf 'CURRENT_TEST_PATHS=%s\n' "${current_tests:-not-configured}"
        printf 'CURRENT_REBASE_RESOLVER=%s\n' "$current_resolver"
        printf 'CURRENT_VALIDATION=%s\n' "$(jq -nc --arg value "$current_validation" '$value')"
        printf 'CURRENT_A4S_BLOCKER_REPORTING=%s\n' "$current_blocker_reporting"
        printf 'CURRENT_CODEQL_SECURITY_THRESHOLD=%s\n' "${current_codeql_security:-high_or_higher}"
        printf 'CURRENT_CODEQL_ALERTS_THRESHOLD=%s\n' "${current_codeql_alerts:-errors}"
        printf 'CURRENT_CODE_SCANNING=%s\n' "$current_code_scanning"
        printf 'CURRENT_QUEUE_CONCURRENCY=%s\n' "$current_queue_concurrency"
      } >> "$DAGU_OUTPUT_FILE"
    outputs:
      - name: REPO
      - name: NWO
      - name: BASE_BRANCH
      - name: REQUIRED_NOW
      - name: RECENT_CHECKS
      - name: STAGE
      - name: BUNDLE_NAME
      - name: BUNDLE_VERSION
      - name: DAGU_VERSION
      - name: SOURCE_NWO
      - name: SOURCE_SHA
      - name: CURRENT_GATE
      - name: CURRENT_REQUIRED_CHECK
      - name: CURRENT_TEST_PATHS
      - name: CURRENT_REBASE_RESOLVER
      - name: CURRENT_VALIDATION
      - name: CURRENT_A4S_BLOCKER_REPORTING
      - name: CURRENT_CODEQL_SECURITY_THRESHOLD
      - name: CURRENT_CODEQL_ALERTS_THRESHOLD
      - name: CURRENT_CODE_SCANNING
      - name: CURRENT_QUEUE_CONCURRENCY
      - name: CURRENT_ESCALATION_PUSHBACKS
      - name: CURRENT_ESCALATION_FINDINGS
      - name: CURRENT_ESCALATION_SECONDS
      - name: CURRENT_ESCALATION_CI_BLOCKED
      - name: CURRENT_ESCALATION_POC_INCONCLUSIVE

  - id: config
    depends: detect
    action: human.task
    with:
      prompt: >-
        Configure the dagu-feature lifecycle for ${steps.detect.outputs.NWO}
        (default branch ${steps.detect.outputs.BASE_BRANCH}).
        Bootstrap writes one config file at .workspace/dagu/config.json.
        Its schema version is independent of the package version. Package releases
        do not require a new consumer commit when this config stays the same.
        GATE: local gate command run in the issue worktree with bash -euo pipefail -c
        (current: ${steps.detect.outputs.CURRENT_GATE}).
        REQUIRED_CHECK: GitHub check the default branch will require (strict)
        (current: ${steps.detect.outputs.CURRENT_REQUIRED_CHECK}).
        Required now: ${steps.detect.outputs.REQUIRED_NOW}.
        Checks on the last merged PR: ${steps.detect.outputs.RECENT_CHECKS}.
        TEST_PATHS: Bash ERE matching this repository's test paths
        (current: ${steps.detect.outputs.CURRENT_TEST_PATHS}; for a4s: (^|/)(test|tests)/|\.test\.(ts|cjs)$).
        REBASE_RESOLVER: repository command run in the conflicted worktree, or empty
        (current: ${steps.detect.outputs.CURRENT_REBASE_RESOLVER}; for a4s: node packages/issue-lifecycle/bin/dagu-bundle-rebase.mjs).
        VALIDATION: optional repository procedure after the gate and before push;
        empty means skip (current JSON: ${steps.detect.outputs.CURRENT_VALIDATION}).
        Adoption fixes this value; feature enqueue overrides are rejected.
        A4S_BLOCKER_REPORTING: ask requires consent before publishing a blocker;
        auto explicitly authorizes scoped A4S blocker reporting to the identified native owner.
        Empty preserves the installed choice (current: ${steps.detect.outputs.CURRENT_A4S_BLOCKER_REPORTING}; initial: ask).
        CODE_SCANNING: required waits for CodeQL before merge; off neither observes nor waits for CodeQL
        (current: ${steps.detect.outputs.CURRENT_CODE_SCANNING}; initial: required).
        Blank preserves the installed choice. Choose off when this repository cannot enable code scanning,
        including a private repository on a GitHub Free or Pro user account.
        CODEQL_SECURITY_THRESHOLD: minimum security severity used when code scanning is required
        (current: ${steps.detect.outputs.CURRENT_CODEQL_SECURITY_THRESHOLD}; initial: high_or_higher).
        CODEQL_ALERTS_THRESHOLD: non-security findings used when code scanning is required
        (current: ${steps.detect.outputs.CURRENT_CODEQL_ALERTS_THRESHOLD}; initial: errors).
        Blank preserves installed thresholds. required needs CodeQL analysis and permission to read code-scanning alerts.
        QUEUE_CONCURRENCY: positive integer; blank keeps the committed config value
        (${steps.detect.outputs.CURRENT_QUEUE_CONCURRENCY}; initial: 1). For a4s, select 8
        to preserve the operator-approved installed capacity on first adoption.
        Bootstrap derives the repository's global queue and restarts its matching
        launchd scheduler only when the entry changes; waiting human tasks persist.
        Escalation budgets: positive integers, blank preserves installed policy.
        Push-backs ${steps.detect.outputs.CURRENT_ESCALATION_PUSHBACKS} (initial 3);
        repeated findings ${steps.detect.outputs.CURRENT_ESCALATION_FINDINGS} (initial 2);
        elapsed seconds ${steps.detect.outputs.CURRENT_ESCALATION_SECONDS} (initial 3600);
        identical CI BLOCKED observations ${steps.detect.outputs.CURRENT_ESCALATION_CI_BLOCKED} (initial 2);
        access/scope INCONCLUSIVE PoCs ${steps.detect.outputs.CURRENT_ESCALATION_POC_INCONCLUSIVE} (initial 2).
      form:
        type: object
        additionalProperties: false
        properties:
          GATE:
            type: string
            minLength: 1
          REQUIRED_CHECK:
            type: string
            minLength: 1
          TEST_PATHS:
            type: string
            minLength: 1
          REBASE_RESOLVER:
            type: string
          VALIDATION:
            type: string
            default: ""
          A4S_BLOCKER_REPORTING:
            type: string
            enum: ["", ask, auto]
            default: ""
          CODE_SCANNING:
            type: string
            enum: ["", required, "off"]
            default: ""
          CODEQL_SECURITY_THRESHOLD:
            type: string
            enum: ["", none, critical, high_or_higher, medium_or_higher, all]
            default: ""
          CODEQL_ALERTS_THRESHOLD:
            type: string
            enum: ["", none, errors, errors_and_warnings, all]
            default: ""
          QUEUE_CONCURRENCY:
            type: string
            default: ""
            pattern: "^([1-9][0-9]*)?$"
          ESCALATION_PUSHBACKS: {type: string, pattern: '^$|^[1-9][0-9]*$', default: ""}
          ESCALATION_FINDINGS: {type: string, pattern: '^$|^[1-9][0-9]*$', default: ""}
          ESCALATION_SECONDS: {type: string, pattern: '^$|^[1-9][0-9]*$', default: ""}
          ESCALATION_CI_BLOCKED: {type: string, pattern: '^$|^[1-9][0-9]*$', default: ""}
          ESCALATION_POC_INCONCLUSIVE: {type: string, pattern: '^$|^[1-9][0-9]*$', default: ""}
        required: [GATE, REQUIRED_CHECK, TEST_PATHS, REBASE_RESOLVER]

  - id: worktrees
    depends: config
    run: |
      set -euo pipefail
      if ! git -C "$PRIMARY" check-ignore -q "$PRIMARY/.workspace/worktrees/issue-1"; then
        printf '/.workspace/worktrees/\n' >> "$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path info/exclude)"
        printf 'worktrees=ignored\n'
      fi
      git -C "$PRIMARY" check-ignore -q "$PRIMARY/.workspace/worktrees/issue-1"

  - id: render
    depends: worktrees
    env:
      - GATE: ${steps.config.outputs.GATE}
      - REQUIRED_CHECK: ${steps.config.outputs.REQUIRED_CHECK}
      - REPO: ${steps.detect.outputs.REPO}
      - BASE_BRANCH: ${steps.detect.outputs.BASE_BRANCH}
      - STAGE: ${steps.detect.outputs.STAGE}
      - TEST_PATHS: ${steps.config.outputs.TEST_PATHS}
      - REBASE_RESOLVER: ${steps.config.outputs.REBASE_RESOLVER}
      - VALIDATION: ${steps.config.outputs.VALIDATION}
      - A4S_BLOCKER_REPORTING: ${steps.config.outputs.A4S_BLOCKER_REPORTING}
      - CURRENT_A4S_BLOCKER_REPORTING: ${steps.detect.outputs.CURRENT_A4S_BLOCKER_REPORTING}
      - CODEQL_SECURITY_THRESHOLD: ${steps.config.outputs.CODEQL_SECURITY_THRESHOLD}
      - CODEQL_ALERTS_THRESHOLD: ${steps.config.outputs.CODEQL_ALERTS_THRESHOLD}
      - CURRENT_CODEQL_SECURITY_THRESHOLD: ${steps.detect.outputs.CURRENT_CODEQL_SECURITY_THRESHOLD}
      - CURRENT_CODEQL_ALERTS_THRESHOLD: ${steps.detect.outputs.CURRENT_CODEQL_ALERTS_THRESHOLD}
      - CODE_SCANNING: ${steps.config.outputs.CODE_SCANNING}
      - CURRENT_CODE_SCANNING: ${steps.detect.outputs.CURRENT_CODE_SCANNING}
      - QUEUE_CONCURRENCY: ${steps.config.outputs.QUEUE_CONCURRENCY}
      - CURRENT_QUEUE_CONCURRENCY: ${steps.detect.outputs.CURRENT_QUEUE_CONCURRENCY}
      - ESCALATION_PUSHBACKS: ${steps.config.outputs.ESCALATION_PUSHBACKS}
      - ESCALATION_FINDINGS: ${steps.config.outputs.ESCALATION_FINDINGS}
      - ESCALATION_SECONDS: ${steps.config.outputs.ESCALATION_SECONDS}
      - ESCALATION_CI_BLOCKED: ${steps.config.outputs.ESCALATION_CI_BLOCKED}
      - ESCALATION_POC_INCONCLUSIVE: ${steps.config.outputs.ESCALATION_POC_INCONCLUSIVE}
      - CURRENT_ESCALATION_PUSHBACKS: ${steps.detect.outputs.CURRENT_ESCALATION_PUSHBACKS}
      - CURRENT_ESCALATION_FINDINGS: ${steps.detect.outputs.CURRENT_ESCALATION_FINDINGS}
      - CURRENT_ESCALATION_SECONDS: ${steps.detect.outputs.CURRENT_ESCALATION_SECONDS}
      - CURRENT_ESCALATION_CI_BLOCKED: ${steps.detect.outputs.CURRENT_ESCALATION_CI_BLOCKED}
      - CURRENT_ESCALATION_POC_INCONCLUSIVE: ${steps.detect.outputs.CURRENT_ESCALATION_POC_INCONCLUSIVE}
      - BUNDLE_NAME: ${steps.detect.outputs.BUNDLE_NAME}
      - BUNDLE_VERSION: ${steps.detect.outputs.BUNDLE_VERSION}
      - DAGU_VERSION: ${steps.detect.outputs.DAGU_VERSION}
      - SOURCE_NWO: ${steps.detect.outputs.SOURCE_NWO}
      - SOURCE_SHA: ${steps.detect.outputs.SOURCE_SHA}
    run: |
      set -euo pipefail
      umask 0022
      test -n "${DAG_RUN_ID:-}"
      PRIMARY=$(cd "$PRIMARY" && pwd -P)
      # Empty integer-text inputs preserve the committed repository policy.
      export QUEUE_CONCURRENCY=${QUEUE_CONCURRENCY:-${CURRENT_QUEUE_CONCURRENCY:-1}}
      node -e 'const v=process.env.QUEUE_CONCURRENCY; if (!/^[1-9][0-9]*$/.test(v) || !Number.isSafeInteger(Number(v))) process.exit(1)'
      A4S_BLOCKER_REPORTING=${A4S_BLOCKER_REPORTING:-${CURRENT_A4S_BLOCKER_REPORTING:-ask}}
      case "$A4S_BLOCKER_REPORTING" in ask|auto) ;; *) echo 'A4S_BLOCKER_REPORTING must be ask or auto' >&2; exit 1 ;; esac
      CODEQL_SECURITY_THRESHOLD=${CODEQL_SECURITY_THRESHOLD:-${CURRENT_CODEQL_SECURITY_THRESHOLD:-high_or_higher}}
      CODEQL_ALERTS_THRESHOLD=${CODEQL_ALERTS_THRESHOLD:-${CURRENT_CODEQL_ALERTS_THRESHOLD:-errors}}
      case "$CODEQL_SECURITY_THRESHOLD" in none|critical|high_or_higher|medium_or_higher|all) ;; *) echo 'Invalid CodeQL security threshold' >&2; exit 1 ;; esac
      case "$CODEQL_ALERTS_THRESHOLD" in none|errors|errors_and_warnings|all) ;; *) echo 'Invalid CodeQL alerts threshold' >&2; exit 1 ;; esac
      CODE_SCANNING=${CODE_SCANNING:-${CURRENT_CODE_SCANNING:-required}}
      case "$CODE_SCANNING" in required|off) ;; *) echo 'CODE_SCANNING must be required or off' >&2; exit 1 ;; esac
      for entry in PUSHBACKS:3 FINDINGS:2 SECONDS:3600 CI_BLOCKED:2 POC_INCONCLUSIVE:2; do
        key="ESCALATION_${entry%:*}"
        current="CURRENT_$key"
        value=${!key:-${!current:-${entry#*:}}}
        [[ "$value" =~ ^[1-9][0-9]*$ ]] || { echo "$key must be a positive integer" >&2; exit 1; }
        export "$key=$value"
      done
      mkdir -p "$(dirname "$STAGE")"
      export A4S_BLOCKER_REPORTING CODEQL_SECURITY_THRESHOLD CODEQL_ALERTS_THRESHOLD CODE_SCANNING
      export VALIDATION="${VALIDATION-}" REBASE_RESOLVER="${REBASE_RESOLVER-}"
      node "$SKILL_DIR/../../bin/dagu-feature-bundle.ts" write-config "$STAGE"
      node "$SKILL_DIR/../../bin/dagu-feature-bundle.ts" config-check "$STAGE"
      printf 'config=%s\n' "$STAGE"

  - id: reconcile
    depends: render
    env:
      - STAGE: ${steps.detect.outputs.STAGE}
    run: |
      set -euo pipefail
      destination="${DAGU_HOME:-$HOME/.dagu}/dags/reconcile.yaml"
      node "$SKILL_DIR/../../bin/dagu-feature-bundle.ts" install-reconciler "$STAGE" "$destination"
      dagu validate "$destination"
      queue_status=$(node "$SKILL_DIR/../../bin/dagu-feature-bundle.ts" queue-reconcile "$STAGE")
      printf 'QUEUE_STATUS=%s\n' "$queue_status" >> "$DAGU_OUTPUT_FILE"
      printf 'reconcile=%s\n' "$destination"
    outputs:
      - name: QUEUE_STATUS

  - id: github
    depends: reconcile
    env:
      - REQUIRED_CHECK: ${steps.config.outputs.REQUIRED_CHECK}
      - NWO: ${steps.detect.outputs.NWO}
      - BASE_BRANCH: ${steps.detect.outputs.BASE_BRANCH}
    run: |
      set -euo pipefail
      settings=$(gh api "repos/$NWO" --jq '[.allow_auto_merge, .allow_squash_merge] | map(tostring) | join(" ")')
      if test "$settings" != "true true"; then
        gh api -X PATCH "repos/$NWO" -F allow_auto_merge=true -F allow_squash_merge=true >/dev/null
        printf 'repo_settings=updated\n'
      fi
      protection_url="repos/$NWO/branches/$BASE_BRANCH/protection"
      if ! before=$(gh api "$protection_url" 2>&1); then
        grep -q 'Branch not protected' <<<"$before"
        jq -n --arg c "$REQUIRED_CHECK" '{
            required_status_checks: {strict: true, contexts: [$c]},
            enforce_admins: null,
            required_pull_request_reviews: null,
            restrictions: null
          }' | gh api -X PUT "$protection_url" --input - >/dev/null
        printf 'protection=created\n'
      elif jq -e '.required_status_checks != null' <<<"$before" >/dev/null; then
        jq --arg c "$REQUIRED_CHECK" '{
            strict: true,
            contexts: ((.required_status_checks.contexts + [$c]) | unique)
          }' <<<"$before" \
          | gh api -X PATCH "$protection_url/required_status_checks" --input - >/dev/null
        printf 'required_status_checks=updated\n'
      else
        jq -e '(.required_pull_request_reviews.dismissal_restrictions // null) == null
          and (.required_pull_request_reviews.bypass_pull_request_allowances // null) == null' \
          <<<"$before" >/dev/null
        jq --arg c "$REQUIRED_CHECK" '{
            required_status_checks: {strict: true, contexts: [$c]},
            enforce_admins: (.enforce_admins.enabled // false),
            required_pull_request_reviews: (.required_pull_request_reviews
              | if . == null then null else {
                  dismiss_stale_reviews, require_code_owner_reviews,
                  required_approving_review_count, require_last_push_approval
                } end),
            restrictions: (.restrictions
              | if . == null then null else {
                  users: [.users[].login], teams: [.teams[].slug], apps: [.apps[].slug]
                } end),
            required_linear_history: (.required_linear_history.enabled // false),
            allow_force_pushes: (.allow_force_pushes.enabled // false),
            allow_deletions: (.allow_deletions.enabled // false),
            block_creations: (.block_creations.enabled // false),
            required_conversation_resolution: (.required_conversation_resolution.enabled // false),
            lock_branch: (.lock_branch.enabled // false),
            allow_fork_syncing: (.allow_fork_syncing.enabled // false)
          }' <<<"$before" | gh api -X PUT "$protection_url" --input - >/dev/null
        after=$(gh api "$protection_url")
        normalize='del(.required_status_checks) | walk(if type == "object" then del(.url, .contexts_url) else . end)'
        test "$(jq -S "$normalize" <<<"$before")" = "$(jq -S "$normalize" <<<"$after")"
        printf 'protection=required_status_checks_added\n'
      fi

  - id: confirm
    depends: github
    env:
      - REQUIRED_CHECK: ${steps.config.outputs.REQUIRED_CHECK}
      - NWO: ${steps.detect.outputs.NWO}
      - BASE_BRANCH: ${steps.detect.outputs.BASE_BRANCH}
      - STAGE: ${steps.detect.outputs.STAGE}
      - QUEUE_STATUS: ${steps.reconcile.outputs.QUEUE_STATUS}
    run: |
      set -euo pipefail
      test "$(gh api "repos/$NWO" --jq '.allow_auto_merge and .allow_squash_merge')" = true
      test "$(gh api "repos/$NWO/branches/$BASE_BRANCH/protection/required_status_checks" \
        --jq '.strict and (.contexts | index(env.REQUIRED_CHECK) != null)')" = true
      git -C "$PRIMARY" check-ignore -q "$PRIMARY/.workspace/worktrees/issue-1"
      node "$SKILL_DIR/../../bin/dagu-feature-bundle.ts" config-check "$STAGE"
      destination="${DAGU_HOME:-$HOME/.dagu}/dags/reconcile.yaml"
      node "$SKILL_DIR/../../bin/dagu-feature-bundle.ts" install-reconciler "$STAGE" "$destination"
      dagu validate "$destination"
      node "$SKILL_DIR/../../bin/dagu-feature-bundle.ts" queue-check "$STAGE"
      printf '%s\n' "$QUEUE_STATUS"
      printf 'config=%s\n' "$STAGE"
      printf 'reconcile=%s\n' "$destination"
      printf 'scheduler=ok\nrepo=%s\nbase_branch=%s\nrequired_check=%s\nstage=%s\n' \
        "$NWO" "$BASE_BRANCH" "$REQUIRED_CHECK" "$STAGE"
