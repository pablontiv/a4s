description: Reconciles every waiting feature run's await_merge with its PR and reports waiting runs whose issue is closed.
labels:
  - dagu-feature-bundle=__DAGU_FEATURE_VERSION__
schedule: "* * * * *"
catchup_window: ""
overlap_policy: skip
hist_retention_runs: 1440
type: graph
shell: bash
env:
  - CI_OBSERVATION_ID: ${context.run.id}
  - ESCALATION_CI_BLOCKED: __ESCALATION_CI_BLOCKED__
steps:
  - id: recover_stale
    run: |
      set -euo pipefail
      "$A4S_BIN" stale-recovery recover-scheduled
  - id: discover
    run: |
      set -euo pipefail
      resolve_primary_binding() {
        local value=$1 workspace=$2 home sentinel
        sentinel='${A4S_'"PRIMARY}"
        if [[ "$value" != "$sentinel" ]]; then
          [[ "$value" == /* && "$value" != *'$'* && "$value" != *[[:space:]] && "$value" != [[:space:]]* ]] || return 1
          printf '%s\n' "$value"
          return 0
        fi
        home=${DAGU_HOME:-$HOME/.dagu}
        if [[ "$workspace" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ && -f "$home/primaries/$workspace" ]]; then
          value=$(tr -d '\r\n' < "$home/primaries/$workspace")
        elif [[ -n ${A4S_PRIMARY:-} ]]; then
          value=$A4S_PRIMARY
        elif [[ -f "$home/a4s-primary" ]]; then
          value=$(tr -d '\r\n' < "$home/a4s-primary")
        else
          return 1
        fi
        [[ "$value" == /* && "$value" != *'$'* && "$value" != *[[:space:]] && "$value" != [[:space:]]* ]] || return 1
        printf '%s\n' "$value"
      }
      # Page the local API from the Unix epoch. A creation-time window or a single
      # response cap must not drop an active Waiting run. A repeated cursor fails
      # closed instead of emitting a partial selection.
      BOUND_STARTED_MS=$("$A4S_BIN" reconcile now)
      CALL_TIMEOUT=${RECONCILE_CALL_TIMEOUT_SECONDS:-8}
      BOUND_BUDGET=${RECONCILE_DISCOVER_TIMEOUT_SECONDS:-20}
      TMP=$(mktemp -d)
      trap 'rm -rf "$TMP"' EXIT
      : >"$TMP/calls"
      : >"$TMP/cursors"
      : >"$TMP/seen-runs"
      : >"$TMP/primaries"
      : >"$TMP/repos"
      : >"$TMP/rows"
      : >"$TMP/raw"
      bounded() {
        printf '1\n' >>"$TMP/calls"
        local rc=0
        "$A4S_BIN" reconcile bounded discover "$BOUND_BUDGET" "$BOUND_STARTED_MS" "$CALL_TIMEOUT" "$@" || rc=$?
        if [[ "$rc" -eq 124 ]]; then printf '1\n' >>"$TMP/deadline"; fi
        return "$rc"
      }
      base="http://127.0.0.1:${DAGU_PORT:-8080}/api/v1/dag-runs/feature"
      cursor=""
      pages=0
      while true; do
        pages=$((pages + 1))
        args=(--get --data-urlencode "status=7" --data-urlencode "fromDate=0" --data-urlencode "limit=100")
        if [[ -n "$cursor" ]]; then args+=(--data-urlencode "cursor=$cursor"); fi
        if ! bounded curl -fsS "${args[@]}" "$base" >"$TMP/page"; then
          echo "discover: waiting-run page unavailable" >&2
          exit 1
        fi
        jq -c '.dagRuns[]?' "$TMP/page" >>"$TMP/raw"
        next=$(jq -r 'if .nextCursor == null then "" else (.nextCursor | tostring) end' "$TMP/page")
        if [[ -z "$next" ]]; then break; fi
        if [[ "$next" == "$cursor" ]] || grep -Fxq -- "$next" "$TMP/cursors"; then
          echo "discover: cursor did not advance" >&2
          exit 1
        fi
        printf '%s\n' "$next" >>"$TMP/cursors"
        cursor=$next
      done
      input=0 selected=0 skipped=0 spec_lookups=0 repo_lookups=0
      while IFS= read -r row; do
        [[ -n "$row" ]] || continue
        input=$((input + 1))
        run=$(jq -r '.RUN // empty' <<<"$row")
        if [[ -z "$run" ]] || grep -Fxq -- "$run" "$TMP/seen-runs"; then
          skipped=$((skipped + 1))
          continue
        fi
        printf '%s\n' "$run" >>"$TMP/seen-runs"
        if [[ "$(jq -r '.PRIMARY // empty' <<<"$row")" == "" ]]; then
          spec_lookups=$((spec_lookups + 1))
          encoded=$(jq -nr --arg run "$run" '$run|@uri')
          if ! bounded curl -fsS "http://127.0.0.1:${DAGU_PORT:-8080}/api/v1/dag-runs/feature/$encoded/spec" >"$TMP/spec"; then
            echo "discover: spec unavailable for $run" >&2
            exit 1
          fi
          if ! primary=$(jq -er '.spec | split("\n")[] | select(startswith("  - PRIMARY: ")) | ltrimstr("  - PRIMARY: ") | fromjson' "$TMP/spec"); then
            echo "discover: spec unavailable for $run" >&2
            exit 1
          fi
          workspace=$(jq -r '[.spec | split("\n")[] | select(startswith("  - workspace=")) | ltrimstr("  - workspace=")] | first // ""' "$TMP/spec")
          if ! primary=$(resolve_primary_binding "$primary" "$workspace"); then
            echo "discover: cannot resolve PRIMARY for $run" >&2
            exit 1
          fi
          row=$(jq -c --arg primary "$primary" '.PRIMARY = $primary | .BRANCH = ("dagu/issue-" + .ISSUE)' <<<"$row")
        fi
        primary=$(jq -r .PRIMARY <<<"$row")
        if ! grep -Fxq -- "$primary" "$TMP/primaries"; then
          printf '%s\n' "$primary" >>"$TMP/primaries"
          origin=$(git -C "$primary" remote get-url origin)
          repo_lookups=$((repo_lookups + 1))
          if ! repo=$(bounded gh repo view "$origin" --json nameWithOwner --jq .nameWithOwner); then
            echo "discover: repository lookup failed for $primary" >&2
            exit 1
          fi
          jq -nc --arg primary "$primary" --arg repo "$repo" '{primary:$primary,repo:$repo}' >>"$TMP/repos"
        fi
        repo=$(jq -r --arg primary "$primary" 'select(.primary == $primary) | .repo' "$TMP/repos" | head -1)
        jq -c --arg repo "$repo" '.REPO = $repo' <<<"$row" >>"$TMP/rows"
        selected=$((selected + 1))
      done < <(jq -c '
        def param($key):
          .params as $params
          | (try ($params | capture("(^| )" + $key + "=(?<value>[^ ]*)($| )").value) catch "") // "";
        select(.dagRunId != null) | {
          RUN: .dagRunId,
          ISSUE: param("ISSUE"),
          PRIMARY: param("PRIMARY"),
          BRANCH: param("BRANCH"),
          PR_NUMBER: param("PR_NUMBER")
        }
      ' "$TMP/raw")
      calls=$(wc -l <"$TMP/calls" | tr -d ' ')
      latency=$(( $("$A4S_BIN" reconcile now) - BOUND_STARTED_MS ))
      printf 'reconcile-metric %s\n' "$(jq -nc \
        --argjson pages "$pages" --argjson inputRuns "$input" --argjson selected "$selected" \
        --argjson skipped "$skipped" --argjson repoLookups "$repo_lookups" --argjson specLookups "$spec_lookups" \
        --argjson latencyMs "$latency" --argjson calls "$calls" \
        --argjson callTimeoutSeconds "$CALL_TIMEOUT" --argjson discoverTimeoutSeconds "$BOUND_BUDGET" \
        '{phase:"discover",pages:$pages,inputRuns:$inputRuns,selected:$selected,skipped:$skipped,repoLookups:$repoLookups,specLookups:$specLookups,calls:$calls,latencyMs:$latencyMs,callTimeoutSeconds:$callTimeoutSeconds,discoverTimeoutSeconds:$discoverTimeoutSeconds}')" >&2
      jq -sc '.' "$TMP/rows"
    output: RUNS

  - id: classify
    depends: discover
    run: |
      set -euo pipefail
      : "${CI_OBSERVATION_ID:?Missing reconcile tick identity}"
      TMP=$(mktemp -d)
      trap 'rm -rf "$TMP"' EXIT
      "$A4S_BIN" reconcile classify "$TMP/outputs"
      # Dagu reads declared outputs only from this file. Stdout is the step log.
      tee -a "${DAGU_OUTPUT_FILE:?Missing Dagu output file}" <"$TMP/outputs"
    outputs:
      - name: children
      - name: actions
      - name: failures

  - id: tick
    depends: classify
    preconditions:
      - condition: "${steps.classify.outputs.children}"
        expected: "re:^\\[.+\\]$"
    action: dag.run
    with:
      dag: reconcile-run
    parallel:
      items: ${steps.classify.outputs.children}
      # Protected-transition fan-out for independent runs. Distinct from repository queue capacity.
      max_concurrent: 4

  - id: act
    depends: classify
    preconditions:
      - condition: "${steps.classify.outputs.actions}"
        expected: "re:^\\[.+\\]$"
    action: dag.run
    with:
      dag: reconcile-run
    parallel:
      items: ${steps.classify.outputs.actions}
      max_concurrent: 4

---
name: reconcile-run
type: graph
shell: bash
env:
  - CI_OBSERVATION_ID: ${context.run.id}
  - ESCALATION_CI_BLOCKED: __ESCALATION_CI_BLOCKED__
params:
  - name: RUN
    type: string
    required: true
  - name: ISSUE
    type: string
    required: true
  - name: PRIMARY
    type: string
    required: true
  - name: BRANCH
    type: string
    required: true
  - name: PR_NUMBER
    type: string
    default: ""
  - name: REPO
    type: string
    default: ""
steps:
  - id: observe
    run: |
      set -euo pipefail
      exec "$A4S_BIN" run --primary "$PRIMARY" --run "$RUN" -- reconcile step observe
      # Receipt-bound implementation.
      BOUND_STARTED_MS=$("$A4S_BIN" reconcile now)
      CALL_TIMEOUT=${RECONCILE_CALL_TIMEOUT_SECONDS:-8}
      BOUND_BUDGET=${RECONCILE_OBSERVE_TIMEOUT_SECONDS:-20}
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      mkdir -p "$STATE"
      TMP=$(mktemp -d)
      trap 'rm -rf "$TMP"' EXIT
      : >"$TMP/calls"
      bounded() {
        printf '1\n' >>"$TMP/calls"
        local rc=0
        "$A4S_BIN" reconcile bounded observe "$BOUND_BUDGET" "$BOUND_STARTED_MS" "$CALL_TIMEOUT" "$@" || rc=$?
        if [[ "$rc" -eq 124 ]]; then printf '1\n' >>"$TMP/deadline"; fi
        return "$rc"
      }
      skipped_repo=0
      if [[ -n "${REPO:-}" ]]; then
        skipped_repo=1
      elif REPO=$(bounded gh repo view "$(git -C "$PRIMARY" remote get-url origin)" --json nameWithOwner --jq .nameWithOwner); then
        :
      else
        REPO=""
      fi
      STATUS=""
      if [[ -n "$REPO" ]] && STATUS=$(bounded dagu status feature --run-id "$RUN"); then
        :
      else
        STATUS=""
      fi
      ITERATION=$(sed -nE 's/.*push-back iteration: ([0-9]+).*/\1/p' <<<"$STATUS" | head -1)
      ITERATION=${ITERATION:-0}
      STEP=$(LC_ALL=C sed -nE 's/^(├─|└─)([A-Za-z0-9_-]+) .*\[waiting\]$/\2/p' <<<"$STATUS" | head -1)
      CLASS=PENDING ACTION=WAIT SHA= CHECK= LOG= CAUSE= PR= WORKTREE="$PRIMARY/.workspace/worktrees/issue-$ISSUE" RETRY_RUN= FINDINGS='[]'
      OBSERVATION="$STEP"
      if [[ -z "$REPO" || -z "$STATUS" ]]; then
        CLASS=BLOCKED ACTION=WAIT
        CAUSE="GitHub observation unavailable; check repository permissions and authentication"
        OBSERVATION=UNAVAILABLE
      elif [[ "$STATUS" != Waiting* ]]; then
        ACTION=NONE
        OBSERVATION=NOT_WAITING
      elif [[ "$STEP" == await_ci || "$STEP" == await_merge ]]; then
        pr_ref=${PR_NUMBER:-$BRANCH}
        CLASS=BLOCKED
        CAUSE="GitHub observation unavailable; check repository permissions and authentication"
        if bounded gh pr view "$pr_ref" -R "$REPO" --json number,state,mergeStateStatus,autoMergeRequest,headRefOid,statusCheckRollup >"$TMP/pr"; then
          PR=$(jq -r .number "$TMP/pr")
          SHA=$(jq -r .headRefOid "$TMP/pr")
          pr_state=$(jq -r .state "$TMP/pr")
          merge_state=$(jq -r .mergeStateStatus "$TMP/pr")
          auto=$(jq -r '.autoMergeRequest != null' "$TMP/pr")
          OBSERVATION="$STEP $pr_state/$merge_state/$auto"
          CLASS=PENDING CAUSE="Required checks not yet published"
          # gh exits 1 for failed checks and 8 for pending checks, with valid JSON.
          rc=0
          bounded gh pr checks "$PR" -R "$REPO" --required --json name,state,link >"$TMP/required" 2>"$TMP/error" || rc=$?
          unpublished=0
          # gh's observed exit-1/stdout sentinel is not JSON. It proves neither
          # protection configuration nor publication; independently establish both.
          if [[ "$rc" == 1 && ! -s "$TMP/error" ]] &&
             [[ "$(cat "$TMP/required")" =~ ^no\ required\ checks\ reported\ on\ the\ \'.+\'\ branch$ ]]; then
            unpublished=1
            if bounded "$A4S_BIN" reconcile required-policy "$REPO" "$PR" "$SHA" >"$TMP/policy" 2>"$TMP/error" &&
               jq -e '.class == "PENDING"' "$TMP/policy" >/dev/null; then
              jq '.required' "$TMP/policy" >"$TMP/required"
              rc=0
            elif jq -e '(.class == "BLOCKED" or .class == "STALE_SHA") and (.cause | type == "string")' "$TMP/policy" >/dev/null 2>&1; then
              CLASS=$(jq -r .class "$TMP/policy")
              CAUSE=$(jq -r .cause "$TMP/policy")
            else
              CLASS=BLOCKED CAUSE="Required-check policy unavailable; check authentication, permissions and protection: $(cat "$TMP/error")"
            fi
          fi
          if [[ "$unpublished" == 1 && "$rc" != 0 ]]; then
            :
          elif [[ "$rc" != 0 && "$rc" != 1 && "$rc" != 8 ]] || ! jq -e 'type == "array"' "$TMP/required" >/dev/null 2>&1; then
            CLASS=BLOCKED CAUSE="Required-check lookup failed (exit $rc); check authentication, permissions and protection: $(cat "$TMP/error" "$TMP/required")"
          elif ! bounded gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs" >"$TMP/runs" 2>"$TMP/error" ||
               ! bounded gh api --paginate --slurp "repos/$REPO/commits/$SHA/status?per_page=100" >"$TMP/status-pages" 2>>"$TMP/error"; then
            CLASS=BLOCKED CAUSE="SHA-bound checks unavailable: $(cat "$TMP/error")"
          elif ! jq -e 'type == "array" and length > 0 and all(.[]; (.check_runs | type == "array") and
                 all(.check_runs[]; (.name | type == "string") and (.head_sha | type == "string") and
                   (.status | type == "string") and (if .status == "completed" then (.conclusion | type == "string") else true end)))' "$TMP/runs" >/dev/null ||
               ! jq -e 'type == "array" and length > 0 and all(.[]; (.sha | type == "string") and (.statuses | type == "array") and
                 all(.statuses[]; (.context | type == "string") and (.state | type == "string")))' "$TMP/status-pages" >/dev/null; then
            CLASS=BLOCKED CAUSE="Incomplete or unbound current-head check/status response; inspect GitHub API permissions and publication"
          elif jq -e --arg sha "$SHA" 'any(.[]; .sha != $sha)' "$TMP/status-pages" >/dev/null; then
            CLASS=STALE_SHA CAUSE="Discarded status response for another SHA; reobserve current head"
          else
            jq '{sha: .[0].sha, statuses: [.[].statuses[]]}' "$TMP/status-pages" >"$TMP/statuses"
            jq -s --arg sha "$SHA" '
              [ (.[0][] .check_runs[] | {name, sha: .head_sha, app_id: .app.id, state: (if .status == "completed" then .conclusion | ascii_upcase else "PENDING" end), link: .details_url, id, text: ((.output.title // "") + "\n" + (.output.summary // "") + "\n" + (.output.text // ""))}),
                (.[1] as $s | $s.statuses[] | {name: .context, sha: $s.sha, state: (.state | ascii_upcase), link: .target_url, id, text: .description}) ]
            ' "$TMP/runs" "$TMP/statuses" >"$TMP/checks"
            "$A4S_BIN" reconcile required-results "$SHA" "$TMP/required" "$TMP/checks" >"$TMP/result"
            CLASS=$(jq -r .class "$TMP/result")
            CAUSE=$(jq -r .cause "$TMP/result")
            CHECK=$(jq -r '.check.name // ""' "$TMP/result")
            if [[ "$CLASS" == BLOCKED ]]; then
              check=$(jq -c .check "$TMP/result")
              result=$(jq -r .state <<<"$check")
              LOG=$(jq -r '.text // ""' <<<"$check")
              link=$(jq -r '.link // ""' <<<"$check")
              RETRY_RUN=
              if [[ "$link" =~ /actions/runs/([0-9]+) ]]; then
                RETRY_RUN=${BASH_REMATCH[1]}
                job_id=
                if [[ "$link" =~ /job/([0-9]+) ]]; then job_id=${BASH_REMATCH[1]}; fi
                : >"$TMP/failed-logs"
                if [[ -n "$job_id" ]] && bounded gh run view "$RETRY_RUN" -R "$REPO" --job "$job_id" --log-failed >"$TMP/job-log" 2>"$TMP/error"; then
                  cat "$TMP/job-log" >>"$TMP/failed-logs"
                fi
                # An aggregate required check fails in its own job with only a summary.
                # Candidate and infrastructure evidence is in the failed needed jobs of
                # this same Actions run and SHA. Transient evidence still wins below.
                if bounded gh run view "$RETRY_RUN" -R "$REPO" --log-failed >"$TMP/run-log" 2>"$TMP/error"; then
                  cat "$TMP/run-log" >>"$TMP/failed-logs"
                fi
                if [[ -s "$TMP/failed-logs" ]]; then
                  LOG="$LOG $(head -c 16000 "$TMP/failed-logs")"
                fi
              fi
              # Conclusions alone never establish who caused a failure.
              if [[ "$LOG" =~ [Rr]unner.*(lost.communication|unavailable|shutdown)|[Ff]ailed.to.download.action|[Nn]etwork.*(timed.out|unreachable)|502.Bad.Gateway|503.Service.Unavailable|HTTP.429 ]]; then
                CLASS=TRANSIENT CAUSE="Infrastructure failure in $CHECK ($result)"
              elif [[ "$LOG" =~ [Aa]ssertion[Ee]rror|[Tt]est(s|.suite)?.*failed|[Ff]ailing.tests|error.TS[0-9]+|[Bb]uild.failed|[Ll]int.errors ]]; then
                CLASS=CODE_FAIL CAUSE="Candidate failure in $CHECK ($result)"
              else
                CLASS=BLOCKED CAUSE="Unproven cause for $CHECK ($result); inspect $link and resolve permissions, protection or operator action"
              fi
            fi
          fi
          # Observe code scanning independently: CodeQL findings can block a
          # ruleset even when required-check lookup does not expose that rule.
          policy="$STATE/codeql-policy.json"
          # Retained runs use their original checks-only contract until publication
          # explicitly supplies a candidate-bound CodeQL policy. mode=off keeps
          # that checks-only contract even after publication.
          if [[ -f "$policy" && ! ( "$unpublished" == 1 && ( "$CLASS" == BLOCKED || "$CLASS" == STALE_SHA ) ) ]]; then
            if [[ "$(jq -r .sha "$policy")" != "$SHA" ]]; then
              CLASS=STALE_SHA CHECK=CodeQL CAUSE="CodeQL policy belongs to another published candidate"
            elif [[ "$(jq -r '.mode // "required"' "$policy")" == off ]]; then
              :
            elif [[ "$(jq -r '.mode // "required"' "$policy")" != required ]]; then
              CLASS=BLOCKED CHECK=CodeQL CAUSE="Invalid code scanning policy mode"
            else
              if bounded "$A4S_BIN" codeql "$REPO" "$PR" "$SHA" "$(jq -r .security "$policy")" "$(jq -r .alerts "$policy")" >"$STATE/codeql-observation.json"; then
                codeql_class=$(jq -r .class "$STATE/codeql-observation.json")
                if [[ "$codeql_class" != PASS && ! ( "$CLASS" == BLOCKED && "$codeql_class" == PENDING ) ]]; then
                  CLASS=$codeql_class CHECK=CodeQL RETRY_RUN=
                  CAUSE=$(jq -r .cause "$STATE/codeql-observation.json")
                  FINDINGS=$(jq -c .findings "$STATE/codeql-observation.json")
                  LOG=$(jq -r '[.findings[] | "\(.rule) (\(.severity)) \(.path):\(.line): \(.message)"] | join("\n")' "$STATE/codeql-observation.json")
                fi
              else
                CLASS=BLOCKED CHECK=CodeQL RETRY_RUN=
                CAUSE="CodeQL observation unavailable before the observation deadline"
              fi
            fi
          fi
          current=""
          if [[ "$unpublished" == 1 && -s "$TMP/policy" ]] && jq -e '.binding != null' "$TMP/policy" >/dev/null; then
            if ! bounded gh api "repos/$REPO/pulls/$PR" >"$TMP/current-binding" 2>"$TMP/error"; then
              CLASS=BLOCKED ACTION=WAIT CAUSE="PR/base binding could not be rechecked: $(cat "$TMP/error")"
            elif ! jq -e '(.number | type == "number") and (.base.repo.id | type == "number") and
              (.base.repo.full_name | type == "string") and (.base.ref | type == "string") and
              (.base.sha | type == "string") and (.head.sha | type == "string")' "$TMP/current-binding" >/dev/null; then
              CLASS=BLOCKED ACTION=WAIT CAUSE="Incomplete PR/base binding reread; inspect GitHub permissions and response"
            elif ! jq -e --slurpfile policy "$TMP/policy" '
              {pr:.number,repo:.base.repo.full_name,repositoryId:.base.repo.id,ref:.base.ref,base:.base.sha,head:.head.sha} == $policy[0].binding
            ' "$TMP/current-binding" >/dev/null; then
              CLASS=STALE_SHA CAUSE="PR/head/base binding moved during required-policy observation; discard this observation"
            fi
          fi
          if current=$(bounded gh pr view "$PR" -R "$REPO" --json headRefOid --jq .headRefOid); then
            :
          else
            current=""
            CLASS=BLOCKED ACTION=WAIT
            CAUSE="GitHub observation unavailable; head could not be rechecked before transition"
          fi
          if [[ "$CLASS" == BLOCKED && "$ACTION" == WAIT && "$CAUSE" == "GitHub observation unavailable; head could not be rechecked before transition" ]]; then
            :
          elif [[ "$current" != "$SHA" ]]; then
            CLASS=STALE_SHA CAUSE="Head moved from $SHA to $current; discard this observation"
          elif [[ "$CLASS" == STALE_SHA ]]; then
            :
          elif [[ "$pr_state" == OPEN && ( "$merge_state" == BEHIND || "$merge_state" == DIRTY ) ]]; then
            ACTION=REBASE STEP=await_merge
          elif [[ "$CLASS" == CODE_FAIL && "$pr_state" == OPEN ]]; then
            ACTION=IMPLEMENT STEP=await_ci
          elif [[ "$CLASS" == TRANSIENT && "$pr_state" == OPEN ]]; then
            ACTION=RETRY
          elif [[ "$CLASS" == PASS && "$pr_state" == MERGED ]]; then
            ACTION=COMPLETE
          elif [[ -f "$policy" && "$CLASS" == PASS && "$pr_state" == OPEN && "$auto" != true && "$merge_state" != DRAFT && "$merge_state" != HAS_HOOKS ]]; then
            ACTION=MERGE
          elif [[ "$pr_state" != OPEN && "$pr_state" != MERGED ]] || [[ "$pr_state" == OPEN && ( ( ! -f "$policy" && "$auto" != true ) || "$merge_state" == DRAFT || "$merge_state" == HAS_HOOKS ) ]]; then
            CLASS=BLOCKED CAUSE="PR $pr_state/$merge_state auto-merge=$auto; operator action required"
          fi
          if [[ "$CLASS" == STALE_SHA ]]; then ACTION=WAIT; fi
          if [[ "$ACTION" == RETRY ]]; then
            retry="$STATE/ci-retry-$SHA.json"
            if [[ -z "$RETRY_RUN" ]] || { [[ -f "$retry" ]] &&
              (( $(jq -r .attempts "$retry") >= 2 && $(date +%s) >= $(jq -r .next_at "$retry") )); }; then
              CLASS=BLOCKED ACTION=WAIT
              CAUSE+="; deterministic retry exhausted or no rerunnable Actions run; operator must restore infrastructure"
            fi
          fi
        fi
      elif [[ -n "$STEP" ]]; then
        issue_state=""
        if issue_state=$(bounded gh issue view "$ISSUE" -R "$REPO" --json state,closedAt --jq '"\(.state) closed_at=\(.closedAt // "")"'); then
          OBSERVATION="$STEP issue=$issue_state"
        else
          CLASS=BLOCKED ACTION=WAIT
          CAUSE="GitHub issue observation unavailable; check repository permissions and authentication"
          OBSERVATION="$STEP issue=unavailable"
        fi
      fi
      calls=$(wc -l <"$TMP/calls" | tr -d ' ')
      latency=$(( $("$A4S_BIN" reconcile now) - BOUND_STARTED_MS ))
      deadline=0
      [[ -f "$TMP/deadline" ]] && deadline=1
      printf 'reconcile-metric %s\n' "$(jq -nc --arg run "$RUN" --arg class "$CLASS" --arg action "$ACTION" \
        --argjson calls "$calls" --argjson skippedRepoLookup "$skipped_repo" --argjson latencyMs "$latency" \
        --argjson deadline "$deadline" --argjson callTimeoutSeconds "$CALL_TIMEOUT" --argjson observeTimeoutSeconds "$BOUND_BUDGET" \
        '{phase:"observe",run:$run,class:$class,action:$action,calls:$calls,skippedRepoLookup:($skippedRepoLookup==1),latencyMs:$latencyMs,deadline:($deadline==1),callTimeoutSeconds:$callTimeoutSeconds,observeTimeoutSeconds:$observeTimeoutSeconds}')" >&2
      jq -n --arg repo "$REPO" --arg run "$RUN" --arg pr "$PR" --arg worktree "$WORKTREE" \
        --arg step "$STEP" --argjson iteration "$ITERATION" --arg sha "$SHA" --arg class "$CLASS" \
        --arg action "$ACTION" --arg check "$CHECK" --arg log "${LOG:0:3000}" --arg cause "$CAUSE" --arg retry_run "$RETRY_RUN" --argjson findings "$FINDINGS" \
        '{repo:$repo,run:$run,pr:$pr,worktree:$worktree,step:$step,iteration:$iteration,sha:$sha,class:$class,action:$action,check:$check,log:$log,cause:$cause,retry_run:$retry_run,findings:$findings}' >"$STATE/ci-observation.tmp"
      mv "$STATE/ci-observation.tmp" "$STATE/ci-observation.json"
      "$A4S_BIN" reconcile ci-no-progress "$STATE" "${CI_OBSERVATION_ID:?Missing reconcile tick identity}" "${ESCALATION_CI_BLOCKED:-2}"
      printf 'run=%s\nrepo=%s\nissue=%s\niteration=%s\nobservation=%s\nclassification=%s\n' \
        "$RUN" "$REPO" "$ISSUE" "$ITERATION" "$OBSERVATION" "$CLASS" | tee -a "$DAGU_OUTPUT_FILE"
      cat "$STATE/ci-observation.json"
    outputs:
      - name: run
      - name: repo
      - name: issue
      - name: iteration
      - name: observation
      - name: classification

  - id: transition
    depends: observe
    run: |
      set -euo pipefail
      exec "$A4S_BIN" run --primary "$PRIMARY" --run "$RUN" -- reconcile step transition
      # Receipt-bound implementation.
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      file="$STATE/ci-observation.json"
      action=$(jq -r .action "$file")
      if [[ "$action" == NONE || "$action" == WAIT ]]; then
        printf 'reconcile-metric %s\n' "$(jq -nc --arg action "$action" --arg run "$RUN" '{phase:"transition",run:$run,action:$action,applied:false,cause:"no-side-effect",calls:0,latencyMs:0}')" >&2
        exit 0
      fi
      repo=$(jq -r .repo "$file")
      pr=$(jq -r .pr "$file")
      common=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-common-dir)
      mkdir -p "$STATE" "$common/dagu-feature/transition-locks"
      locks="$STATE/transition.lock"
      if [[ -n "$pr" && "$pr" != null ]]; then
        key=$(printf '%s\n%s\n' "$repo" "$pr" | "$A4S_BIN" reconcile sha256)
        locks="$locks"$'\n'"$common/dagu-feature/transition-locks/$key.lock"
      fi
      export RECONCILE_LOCKS="$locks"
      export RECONCILE_TRANSITION_STARTED_MS=$("$A4S_BIN" reconcile now)
      # Hold the run lock and, for a PR mutation, the shared PR lock across the
      # immediate state/iteration/SHA guard and the single side effect.
      exec "$A4S_BIN" reconcile lock bash -euo pipefail -c "$(cat <<'TRANSITION_BODY'
      set -euo pipefail
      CALL_TIMEOUT=${RECONCILE_CALL_TIMEOUT_SECONDS:-8}
      BOUND_BUDGET=${RECONCILE_TRANSITION_TIMEOUT_SECONDS:-20}
      BOUND_STARTED_MS=$RECONCILE_TRANSITION_STARTED_MS
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      file="$STATE/ci-observation.json"
      action=$(jq -r .action "$file")
      repo=$(jq -r .repo "$file")
      pr=$(jq -r .pr "$file")
      sha=$(jq -r .sha "$file")
      iteration=$(jq -r .iteration "$file")
      step=$(jq -r .step "$file")
      TMP=$(mktemp -d)
      emitted=0
      : >"$TMP/calls"
      cleanup() {
        local status=$?
        if [[ "$emitted" -eq 0 ]]; then
          printf 'reconcile-metric %s\n' "$(jq -nc --arg action "$action" --arg run "$RUN" --argjson status "$status" '{phase:"transition",run:$run,action:$action,applied:false,cause:("exit-"+($status|tostring)),calls:0,latencyMs:0}')" >&2
        fi
        rm -rf "$TMP"
        exit "$status"
      }
      trap cleanup EXIT
      finish() {
        local applied=$1 cause=$2 latency calls
        emitted=1
        latency=$(( $("$A4S_BIN" reconcile now) - RECONCILE_TRANSITION_STARTED_MS ))
        calls=$(wc -l <"$TMP/calls" | tr -d ' ')
        printf 'reconcile-metric %s\n' "$(jq -nc --arg action "$action" --arg run "$RUN" --arg cause "$cause" --argjson applied "$applied" --argjson calls "$calls" --argjson latencyMs "$latency" '{phase:"transition",run:$run,action:$action,applied:($applied==1),cause:$cause,calls:$calls,latencyMs:$latencyMs}')" >&2
      }
      bounded() {
        printf '1\n' >>"$TMP/calls"
        local rc=0
        "$A4S_BIN" reconcile bounded transition "$BOUND_BUDGET" "$BOUND_STARTED_MS" "$CALL_TIMEOUT" "$@" || rc=$?
        return "$rc"
      }
      if [[ "$action" == NONE || "$action" == WAIT ]]; then
        finish 0 no-side-effect
        exit 0
      fi
      guard() {
        local status current head_now
        if ! status=$(bounded dagu status feature --run-id "$RUN"); then
          echo "Run status unavailable before the transition deadline" >&2
          finish 0 status-unavailable
          exit 1
        fi
        [[ "$status" == Waiting* ]] || { echo "Run is resuming; reobserve next tick"; finish 0 not-waiting; exit 1; }
        current=$(sed -nE 's/.*push-back iteration: ([0-9]+).*/\1/p' <<<"$status" | head -1)
        [[ "${current:-0}" == "$iteration" ]] || { echo "Stale iteration $iteration; current ${current:-0}" >&2; finish 0 stale-iteration; exit 1; }
        [[ "$status" == *"$step [waiting]"* ]] || { echo "Checkpoint $step is not waiting" >&2; finish 0 checkpoint; exit 1; }
        if ! head_now=$(bounded gh pr view "$pr" -R "$repo" --json headRefOid --jq .headRefOid); then
          echo "STALE_SHA: head could not be rechecked" >&2
          finish 0 head-unavailable
          exit 1
        fi
        [[ "$head_now" == "$sha" ]] || { echo "STALE_SHA: head changed before transition" >&2; finish 0 stale-sha; exit 1; }
      }
      guard
      cause=applied
      case "$action" in
        MERGE)
          worktree=$(jq -r .worktree "$file")
          merge_body=$(printf 'Closes #%s\n\n%s' "$ISSUE" "$(git -C "$worktree" log -1 --format=%b "$sha")")
          bounded gh pr merge "$pr" -R "$repo" --auto --squash --match-head-commit "$sha" --body "$merge_body"
          cause=merge
          ;;
        IMPLEMENT|REBASE)
          # A corrected head must wait for fresh analysis, not inherit auto-merge.
          auto_on=""
          if ! auto_on=$(bounded gh pr view "$pr" -R "$repo" --json autoMergeRequest --jq '.autoMergeRequest != null'); then
            echo "auto-merge state unavailable before transition" >&2
            finish 0 auto-merge-unavailable
            exit 1
          fi
          if [[ "$auto_on" == true ]]; then
            bounded gh pr merge "$pr" -R "$repo" --disable-auto
          fi
          # The diagnostic is durable before the new implement opening reaches OMP.
          if [[ "$action" == IMPLEMENT ]]; then cp "$file" "$STATE/ci-return.json"; fi
          bounded dagu human-task push-back feature --run-id "$RUN" --step "$step" --expected-iteration "$iteration"
          cause=push-back
          ;;
        COMPLETE)
          # complete has no expected-iteration flag. Reobserve before each async
          # resume; authorize_ci independently checks the published SHA afterwards.
          bounded dagu human-task complete feature --run-id "$RUN" --step "$step"
          cause=complete
          ;;
        RETRY)
          check=$(jq -r .check "$file")
          retry_run=$(jq -r .retry_run "$file")
          retry="$STATE/ci-retry-$sha.json"
          attempts=0 next_at=0
          if [[ -f "$retry" ]]; then
            attempts=$(jq -r .attempts "$retry")
            next_at=$(jq -r .next_at "$retry")
          fi
          now=$(date +%s)
          if (( now < next_at )); then
            printf 'TRANSIENT backoff: attempt=%s next_at=%s now=%s\n' "$attempts" "$next_at" "$now"
            cause=backoff
          elif (( attempts >= 2 )) || [[ -z "$retry_run" ]]; then
            jq '.class="BLOCKED" | .action="WAIT" | .cause += "; deterministic retry exhausted or no rerunnable Actions run; operator must restore infrastructure"' "$file" >"$file.tmp"
            mv "$file.tmp" "$file"
            cat "$file"
            cause=exhausted
          else
            # Persist the budget before the external request, including a failed request.
            attempts=$((attempts + 1))
            next_at=$((now + 60 * (1 << (attempts - 1))))
            jq -n --arg sha "$sha" --arg check "$check" --argjson attempts "$attempts" --argjson next_at "$next_at" \
              '{sha:$sha,check:$check,attempts:$attempts,next_at:$next_at}' >"$retry"
            bounded gh run rerun "$retry_run" -R "$repo" --failed
            printf 'TRANSIENT rerun=%s attempt=%s next_at=%s\n' "$retry_run" "$attempts" "$next_at"
            cause=rerun
          fi
          ;;
      esac
      if [[ "$cause" == backoff || "$cause" == exhausted ]]; then finish 0 "$cause"; else finish 1 "$cause"; fi
      TRANSITION_BODY
      )"

  - id: orphan
    depends: observe
    preconditions:
      - condition: "${steps.observe.outputs.observation}"
        expected: "re:^(triage|implement) issue=CLOSED "
    run: echo "ORPHAN ${steps.observe.outputs.repo}#${steps.observe.outputs.issue} ${steps.observe.outputs.run} ${steps.observe.outputs.observation}"
