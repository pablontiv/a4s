labels:
  - workspace=TEMPLATE_REPO
  - dagu-feature-bundle=__DAGU_FEATURE_VERSION__
queue: TEMPLATE_REPO
type: graph
dotenv: []
shell: bash
max_active_steps: 1
max_clean_up_time_sec: 120
params:
  type: object
  additionalProperties: true
  required: [ISSUE]
  properties:
    ISSUE:
      type: string
      pattern: '^[1-9][0-9]*$'
    PR_NUMBER:
      type: string
      default: ""
    OMP_SESSION_ID:
      type: string
      minLength: 1
    POC_BASIS:
      type: string
      default: ""
env:
  - PRIMARY: __PRIMARY__
  - BASE_BRANCH: TEMPLATE_BASE_BRANCH
  - VALIDATION: __VALIDATION__
  - BRANCH: dagu/issue-${ISSUE}
  - GATE: __GATE__
  - REBASE_RESOLVER: __REBASE_RESOLVER__
  - REQUIRED_CHECK: __REQUIRED_CHECK__
  - CODEQL_SECURITY_THRESHOLD: __CODEQL_SECURITY_THRESHOLD__
  - CODEQL_ALERTS_THRESHOLD: __CODEQL_ALERTS_THRESHOLD__
  - CODE_SCANNING: __CODE_SCANNING__
  - A4S_BLOCKER_REPORTING: __A4S_BLOCKER_REPORTING__
  - ESCALATION_PUSHBACKS: __ESCALATION_PUSHBACKS__
  - ESCALATION_FINDINGS: __ESCALATION_FINDINGS__
  - ESCALATION_SECONDS: __ESCALATION_SECONDS__
  - ESCALATION_POC_INCONCLUSIVE: __ESCALATION_POC_INCONCLUSIVE__
  - ESCALATION_CI_BLOCKED: __ESCALATION_CI_BLOCKED__
  - WORKTREE: ${PRIMARY}/.workspace/worktrees/issue-${ISSUE}
  - RUN: ${context.run.id}
  - DAGU_FEATURE_BUNDLE: "__DAGU_FEATURE_IDENTITY__"
  - DAGU_RESOURCE_GUARD: |
      lifecycle_fetch() (
        local repository=$1 attempt status stderr
        shift
        stderr=$(mktemp) || return
        trap 'rm -f "$stderr"' EXIT
        # Linked worktrees share remote refs; retry only their transient lock conflicts.
        for attempt in 1 2 3; do
          if LC_ALL=C git -C "$repository" fetch "$@" 2>"$stderr"; then
            cat "$stderr" >&2
            return 0
          else
            status=$?
          fi
          cat "$stderr" >&2
          [[ "$attempt" -lt 3 ]] && grep -Fq 'cannot lock ref' "$stderr" || return "$status"
          sleep 1 || return
        done
      )
      resolve_primary_binding() {
        local value=$1 workspace=$2 home sentinel
        sentinel='${A4S_'"PRIMARY}"
        if [[ "$value" != "$sentinel" ]]; then
          [[ "$value" == /* && "$value" != *'$'* && "$value" != *[[:space:]] && "$value" != [[:space:]]* ]] || return 1
          printf '%s\n' "$value"
          return 0
        fi
        home=${DAGU_HOME:-$HOME/.dagu}
        if [[ "$workspace" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ && -f "$home/primaries/$workspace" ]]; then
          value=$(tr -d '\r\n' < "$home/primaries/$workspace")
        elif [[ -n ${A4S_PRIMARY:-} ]]; then
          value=$A4S_PRIMARY
        elif [[ -f "$home/a4s-primary" ]]; then
          value=$(tr -d '\r\n' < "$home/a4s-primary")
        else
          return 1
        fi
        [[ "$value" == /* && "$value" != *'$'* && "$value" != *[[:space:]] && "$value" != [[:space:]]* ]] || return 1
        printf '%s\n' "$value"
      }
      resource_owner_run() {
        local target=$1 predecessor=$RESOURCE_PREVIOUS_OWNER seen=" $RUN " common row status candidate branch issue worktree spec workspace
        [[ "$target" != "$RUN" ]] || return 0
        common=$(git -C "$PRIMARY" rev-parse --absolute-git-dir) || return 1
        # Claims can advance before start_gate transfers either candidate record.
        # Verify each link back to the recorded owner, never an unrelated run.
        while [[ -n "$predecessor" ]]; do
          [[ "$predecessor" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ && "$seen" != *" $predecessor "* ]] || return 1
          seen+="$predecessor "
          dagu history feature --format json --from 1970-01-01 --run-id "$predecessor" --limit 1000 > "$RESOURCE_LOCK/owner-history" || return 1
          row=$(jq -er --arg run "$predecessor" '
            [.[] | select(.dagRunId == $run)] |
            if length == 1 then .[0] else error("predecessor missing or ambiguous") end |
            if (.params|type) != "string" then error("params must be a string") else . end |
            def p($k): (try (.params|capture("(^| )"+$k+"=(?<v>.*?)(?= [A-Z_]+=|$)").v | if startswith("\"") or startswith("\u0027") then .[1:-1] else . end) catch "") // "";
            [(.status|ascii_downcase), (p("PRIMARY") | if . == "" then "@snapshot" else . end),
             (p("BRANCH") as $branch | if $branch == "" then "dagu/issue-" + p("ISSUE") else $branch end),
             (p("ISSUE") | if . == "" then "-" else . end),
             (p("WORKTREE") | if . == "" then "-" else . end)] | @tsv' "$RESOURCE_LOCK/owner-history") || return 1
          IFS=$'\t' read -r status candidate branch issue worktree <<<"$row"
          case "$status" in
            succeeded|failed|aborted|rejected|partially_succeeded) ;;
            *) return 1 ;;
          esac
          if [[ "$candidate" == @snapshot ]]; then
            spec=$(curl -fsS "http://127.0.0.1:${DAGU_PORT:-8080}/api/v1/dag-runs/feature/$(jq -nr --arg run "$predecessor" '$run|@uri')/spec") || return 1
            candidate=$(jq -er '.spec | split("\n")[] | select(startswith("  - PRIMARY: ")) | ltrimstr("  - PRIMARY: ") | fromjson' <<<"$spec") || return 1
            workspace=$(jq -r '[.spec | split("\n")[] | select(startswith("  - workspace=")) | ltrimstr("  - workspace=")] | first // ""' <<<"$spec") || return 1
            candidate=$(resolve_primary_binding "$candidate" "$workspace") || return 1
          fi
          [[ -d "$candidate" ]] || return 1
          candidate=$(cd "$candidate" && pwd -P) || return 1
          [[ "$candidate" == "$PRIMARY" && "$branch" == "$BRANCH" && "$issue" == "$ISSUE" &&
             ( "$worktree" == - || "$worktree" == "$WORKTREE" ) ]] || return 1
          [[ "$predecessor" != "$target" ]] || return 0
          [[ -f "$common/dagu-feature/runs/$predecessor/previous-owner" ]] || return 1
          predecessor=$(cat "$common/dagu-feature/runs/$predecessor/previous-owner") || return 1
        done
        return 1
      }
      resource_lock() {
        local operation=$1 primary root expected actual common key attempt owner run status candidate branch issue jq_status
        command -v jq >/dev/null 2>&1 ||
          { echo 'dagu-feature: required command not found: jq' >&2; exit 127; }
        primary=$(cd "$PRIMARY" && pwd -P)
        root=$(cd "$(git -C "$PRIMARY" rev-parse --show-toplevel)" && pwd -P)
        [[ "$root" == "$primary" ]] || { echo 'dagu-feature: PRIMARY must be the main checkout' >&2; exit 1; }
        [[ "$(git -C "$primary" rev-parse --absolute-git-dir)" == "$(git -C "$primary" rev-parse --path-format=absolute --git-common-dir)" ]] ||
          { echo 'dagu-feature: PRIMARY must be the main checkout' >&2; exit 1; }
        [[ "$RUN" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'dagu-feature: invalid run identity' >&2; exit 1; }
        [[ "$ISSUE" =~ ^[1-9][0-9]*$ && "$BRANCH" == dagu/* ]] ||
          { echo 'dagu-feature: invalid resource identity' >&2; exit 1; }
        expected="$primary/.workspace/worktrees/issue-$ISSUE"
        if [[ -e "$WORKTREE" && "$(cd "$WORKTREE" && pwd -P)" == "$primary" ]]; then
          echo "dagu-feature: protected primary or unmanaged target $WORKTREE" >&2; exit 1
        fi
        mkdir -p "$primary/.workspace/worktrees"
        actual="$(cd "$(dirname "$WORKTREE")" && pwd -P)/$(basename "$WORKTREE")"
        if [[ -e "$WORKTREE" ]]; then actual=$(cd "$WORKTREE" && pwd -P); fi
        [[ "$actual" == "$expected" && "$actual" != "$primary" && "$BRANCH" != "$(git -C "$primary" branch --show-current)" ]] ||
          { printf 'dagu-feature: protected primary or unmanaged target %s %s\n' "$WORKTREE" "$BRANCH" >&2; exit 1; }
        common=$(git -C "$primary" rev-parse --absolute-git-dir)
        key="$common/dagu-feature/owners/issue-$ISSUE"
        mkdir -p "$(dirname "$key")"
        attempt=0
        # The syscall result must distinguish creation from a concurrent EEXIST.
        until mkdir "$key.lock" 2>/dev/null; do
          attempt=$((attempt + 1))
          [[ "$attempt" -lt 100 ]] || { echo "dagu-feature: ownership lock unavailable $key.lock" >&2; exit 1; }
          sleep 0.1
        done
        RESOURCE_LOCK="$key.lock"
        trap 'code=$?; rm -f "$RESOURCE_LOCK/history" "$RESOURCE_LOCK/rows" "$RESOURCE_LOCK/owner" "$RESOURCE_LOCK/owner-history"; rmdir "$RESOURCE_LOCK"; if [[ "$code" != 0 && "${cleanup_diagnosed:-false}" != true ]] && declare -F diagnostic >/dev/null; then diagnostic "resource proof or cleanup operation failed (exit $code)"; fi' EXIT
        if [[ -e "$WORKTREE" ]]; then
          [[ "$(git -C "$WORKTREE" rev-parse --path-format=absolute --git-common-dir)" == "$(git -C "$primary" rev-parse --absolute-git-dir)" &&
             "$(git -C "$WORKTREE" branch --show-current)" == "$BRANCH" &&
             "$(cd "$(git -C "$WORKTREE" rev-parse --show-toplevel)" && pwd -P)" == "$expected" ]] ||
            { echo 'dagu-feature: candidate worktree identity mismatch; preserved' >&2; exit 1; }
        fi
        if ! dagu history feature --format json --from 1970-01-01 --status queued,running,waiting --limit 1000 > "$key.lock/history"; then
          echo 'dagu-feature: feature ownership history read failed' >&2; exit 1
        fi
        if jq -er 'if type == "array" and length < 1000 then . else error("ownership history incomplete: expected array below 1000 rows") end | .[] |
          if (.params|type) != "string" then error("params must be a string") else . end |
          def p($k): (try (.params|capture("(^| )"+$k+"=(?<v>.*?)(?= [A-Z_]+=|$)").v | if startswith("\"") or startswith("\u0027") then .[1:-1] else . end) catch "") // "";
          [.dagRunId, (.status|ascii_downcase), (p("PRIMARY") | if . == "" then "@snapshot" else . end),
           (p("BRANCH") as $branch | if $branch == "" then "dagu/issue-" + p("ISSUE") else $branch end),
           (p("ISSUE") | if . == "" then "-" else . end)] | @tsv' \
          "$key.lock/history" > "$key.lock/rows"; then
          :
        else
          jq_status=$?
          if [[ "$jq_status" == 126 || "$jq_status" == 127 ]]; then
            echo 'dagu-feature: required command unavailable: jq' >&2; exit "$jq_status"
          fi
          # jq -e returns 4 for an empty, valid history.
          jq -e 'type == "array" and length == 0' "$key.lock/history" >/dev/null || {
            jq_status=$?
            if [[ "$jq_status" == 126 || "$jq_status" == 127 ]]; then
              echo 'dagu-feature: required command unavailable: jq' >&2; exit "$jq_status"
            fi
            echo 'dagu-feature: malformed ownership history' >&2; exit 1
          }
        fi
        owner=
        if [[ -f "$key" ]]; then IFS=$'\t' read -r owner branch < "$key"; fi
        if [[ -n "$owner" && "$branch" != "$BRANCH" ]]; then
          printf 'dagu-feature: retained candidate branch mismatch; resource=%s requesting_run=%s observed_owner=%s observed_branch=%s expected_branch=%s; preserved\n' "$expected" "$RUN" "$owner" "$branch" "$BRANCH" >&2; exit 1
        fi
        if [[ -n "$owner" && "$owner" != "$RUN" ]]; then
          if ! dagu history feature --format json --from 1970-01-01 --run-id "$owner" --limit 1000 > "$key.lock/owner-history"; then
            echo "dagu-feature: recorded owner $owner history read failed" >&2; exit 1
          fi
          status=$(jq -er --arg run "$owner" '[.[] | select(.dagRunId == $run)] | if length == 1 then .[0].status | ascii_downcase else error("recorded owner missing or ambiguous") end' "$key.lock/owner-history") ||
            { echo "dagu-feature: cannot verify recorded owner $owner" >&2; exit 1; }
          case "$status" in
            succeeded|failed|aborted|rejected|partially_succeeded) ;;
            queued|running|waiting)
              if declare -F reject >/dev/null; then
                printf 'rule=start_gate.resource_identity expected=terminal_predecessor observed=%s:%s ' "$owner" "$status" >&2
              fi
              printf 'dagu-feature: %s belongs to active run %s (%s); requesting_run=%s expected_owner=%s\n' "$expected" "$owner" "$status" "$RUN" "$RUN" >&2; exit 1 ;;
            *) printf 'dagu-feature: cannot verify recorded owner %s (%s); resource=%s requesting_run=%s expected_owner=%s\n' "$owner" "$status" "$expected" "$RUN" "$RUN" >&2; exit 1 ;;
          esac
        fi
        while IFS=$'\t' read -r run status candidate branch issue; do
          if [[ "$candidate" == @snapshot ]]; then
            spec=$(curl -fsS "http://127.0.0.1:${DAGU_PORT:-8080}/api/v1/dag-runs/feature/$(jq -nr --arg run "$run" '$run|@uri')/spec") ||
              { printf 'dagu-feature: cannot resolve adopted primary for run %s\n' "$run" >&2; exit 1; }
            candidate=$(jq -er '.spec | split("\n")[] | select(startswith("  - PRIMARY: ")) | ltrimstr("  - PRIMARY: ") | fromjson' <<<"$spec") ||
              { printf 'dagu-feature: cannot resolve adopted primary for run %s\n' "$run" >&2; exit 1; }
            workspace=$(jq -r '[.spec | split("\n")[] | select(startswith("  - workspace=")) | ltrimstr("  - workspace=")] | first // ""' <<<"$spec")
            candidate=$(resolve_primary_binding "$candidate" "$workspace") ||
              { printf 'dagu-feature: cannot resolve adopted primary for run %s\n' "$run" >&2; exit 1; }
          fi
          [[ -n "$candidate" && -d "$candidate" ]] || continue
          candidate=$(cd "$candidate" && pwd -P)
          [[ "$candidate" == "$primary" && ( "$issue" == "$ISSUE" || "$branch" == "$BRANCH" ) ]] || continue
          if [[ "$run" != "$RUN" && ( "$status" == running || "$status" == waiting || ( "$status" == queued && ( ( -n "$owner" && "$owner" != "$RUN" ) || ( -z "$owner" && "$operation" == cleanup ) ) ) ) ]]; then
            if declare -F reject >/dev/null; then
              printf 'rule=start_gate.resource_identity expected=exclusive_terminal_predecessors observed=%s:%s ' "$run" "$status" >&2
            fi
            printf 'dagu-feature: %s belongs to active run %s (%s); requesting_run=%s expected_owner=%s\n' "$expected" "$run" "$status" "$RUN" "$RUN" >&2; exit 1
          fi
        done < "$key.lock/rows"
        if [[ "$operation" == cleanup && -n "$owner" && "$owner" != "$RUN" ]]; then
          printf 'dagu-feature: %s now belongs to run %s; cleanup rejected; requesting_run=%s expected_owner=%s\n' "$expected" "$owner" "$RUN" "$RUN" >&2; exit 1
        fi
        RESOURCE_PREVIOUS_OWNER=$owner
        if [[ "$operation" == claim ]]; then
          state="$common/dagu-feature/runs/$RUN"
          mkdir -p "$state"
          if [[ -n "$owner" && "$owner" != "$RUN" ]]; then
            printf '%s\n' "$owner" > "$state/previous-owner"
          fi
          if [[ -f "$state/previous-owner" ]]; then
            RESOURCE_PREVIOUS_OWNER=$(cat "$state/previous-owner")
          fi
          printf '%s\t%s\n' "$RUN" "$BRANCH" > "$key.lock/owner"
          mv "$key.lock/owner" "$key"
        fi
        rm "$key.lock/history" "$key.lock/rows"
        PRIMARY=$primary WORKTREE=$expected
      }
      resolve_run_pr() {
        local repo ref rows
        repo=$(git -C "$PRIMARY" remote get-url origin)
        ref=${PR_NUMBER:-}
        if [[ -z "$ref" && -f "$STATE/pr-number" ]]; then ref=$(cat "$STATE/pr-number"); fi
        if [[ -n "$ref" ]]; then
          RUN_PR=$(gh pr view "$ref" --repo "$repo" --json number,state,headRefName,headRefOid,baseRefName,autoMergeRequest,mergeCommit)
        else
          rows=$(gh pr list --repo "$repo" --head "$BRANCH" --base "$BASE_BRANCH" --state all \
            --json number,state,headRefName,headRefOid,baseRefName,autoMergeRequest,mergeCommit --limit 100)
          RUN_PR=$(jq -cr '
            [.[] | select(.state == "OPEN")] as $open |
            if ($open | length) == 1 then $open[0]
            elif ($open | length) > 1 then error("ambiguous open run PR")
            elif length == 0 then null
            elif length == 1 then .[0]
            else error("ambiguous completed run PR; supply PR_NUMBER") end' <<<"$rows")
        fi
        if [[ "$RUN_PR" == null ]]; then return; fi
        jq -e --arg branch "$BRANCH" --arg base "$BASE_BRANCH" \
          '.headRefName == $branch and .baseRefName == $base and (.number | type == "number") and
           (.state == "OPEN" or .state == "MERGED")' <<<"$RUN_PR" >/dev/null
        jq -r .number <<<"$RUN_PR" > "$STATE/pr-number"
      }
      integrated_terminal() {
        if [[ "$RUN_PR" != null && "$(jq -r .state <<<"$RUN_PR")" == MERGED ]]; then
          jq --arg run "$RUN" --arg checkpoint "$1" --arg candidate "$(jq -r .sha "$STATE/candidate.json")" \
            '. + {run:$run,checkpoint:$checkpoint,candidate:$candidate}' <<<"$RUN_PR" > "$STATE/integrated.json"
          printf 'INTEGRATED=yes\n' >> "${DAGU_OUTPUT_FILE:-/dev/null}"
          printf 'integrated: PR #%s already MERGED at %s; no publication; cleanup will verify local resources\n' \
            "$(jq -r .number <<<"$RUN_PR")" "$1"
          exit 0
        fi
      }
steps:
  - id: admit
    depends: admission
    run: |
      set -euo pipefail
      primary_path=$(cd "$PRIMARY" && pwd -P)
      [[ "$(cd "$(git -C "$PRIMARY" rev-parse --show-toplevel)" && pwd -P)" == "$primary_path" &&
         "$(git -C "$PRIMARY" rev-parse --absolute-git-dir)" == "$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-common-dir)" ]] ||
        { echo 'dagu-feature: PRIMARY must be the main checkout' >&2; exit 1; }
      if [[ -e "$WORKTREE" && "$(cd "$WORKTREE" && pwd -P)" == "$primary_path" ]]; then
        echo "dagu-feature: protected primary or unmanaged target $WORKTREE" >&2; exit 1
      fi
      eval "$DAGU_RESOURCE_GUARD"
      lifecycle_fetch "$PRIMARY" origin
      if [[ "$(git -C "$PRIMARY" branch --show-current)" == "$BASE_BRANCH" ]] &&
         [[ -z "$(git -C "$PRIMARY" status --porcelain --untracked-files=all)" ]]; then
        git -C "$PRIMARY" merge --ff-only "origin/$BASE_BRANCH" || true
      fi
      observed_sha=$(git -C "$PRIMARY" rev-parse HEAD)
      expected_sha=$(git -C "$PRIMARY" rev-parse "origin/$BASE_BRANCH")
      observed_version=not-applicable
      expected_version=not-applicable
      manifest=packages/issue-lifecycle/package.json
      if [[ -e "$PRIMARY/$manifest" ]] || git -C "$PRIMARY" cat-file -e "origin/$BASE_BRANCH:$manifest" 2>/dev/null; then
        observed_version=$(jq -er '.version | select(type == "string" and length > 0)' "$PRIMARY/$manifest" 2>/dev/null) || observed_version=unavailable
        expected_version=$(git -C "$PRIMARY" show "origin/$BASE_BRANCH:$manifest" | jq -er '.version | select(type == "string" and length > 0)') || expected_version=unavailable
      fi
      cause=
      if [[ "$observed_sha" != "$expected_sha" ]]; then
        cause=primary_ahead
        if git -C "$PRIMARY" merge-base --is-ancestor "$observed_sha" "$expected_sha"; then cause=primary_behind; fi
      elif [[ "$observed_version" != "$expected_version" || "$observed_version" == unavailable ]]; then
        cause=version_stale
      fi
      if [[ -n "$cause" ]]; then
        printf 'admit: cause=%s observed_sha=%s expected_sha=%s observed_version=%s expected_version=%s\n' \
          "$cause" "$observed_sha" "$expected_sha" "$observed_version" "$expected_version" >&2
        exit 1
      fi
      resource_lock claim

  - id: admission
    run: |
      set -euo pipefail
      rejected=$(jq -er 'keys[] | select(startswith("ESCALATION_") or startswith("CODEQL_") or IN("GATE", "REBASE_RESOLVER", "REQUIRED_CHECK", "PRIMARY", "A4S_PRIMARY", "BRANCH", "BASE_BRANCH", "A4S_BLOCKER_REPORTING", "CODE_SCANNING", "TEST_PATHS", "VALIDATION", "QUEUE_CONCURRENCY", "LANE", "REPO"))' <<<"$DAGU_PARAMS_JSON") || [[ $? == 4 ]]
      if [[ -n "$rejected" ]]; then
        printf 'admission rejected run parameter: %s\n' "$rejected" >&2
        printf 'adopted policy PRIMARY=%q GATE=%q REBASE_RESOLVER=%q REQUIRED_CHECK=%q BRANCH=%q CODE_SCANNING=%q\n' "$PRIMARY" "$GATE" "${REBASE_RESOLVER:-}" "$REQUIRED_CHECK" "$BRANCH" "${CODE_SCANNING:-}" >&2
        exit 1
      fi

  - id: triage
    depends: admit
    run: |
      set -euo pipefail
      "$A4S_BIN" escalation route
      "$A4S_BIN" role-jobs stage triage
    outputs:
      - name: POC
      - name: QUESTION
      - name: BASIS
      - name: REVIEW
      - name: REQUIRED_TARGETS
      - name: AUTHORIZED_TARGETS
      - name: SCOPE_BASIS

  - id: triage_decision
    depends: triage
    env:
      - POC: ${steps.triage.outputs.POC}
      - QUESTION: ${steps.triage.outputs.QUESTION}
      - BASIS: ${steps.triage.outputs.BASIS}
      - REVIEW: ${steps.triage.outputs.REVIEW}
    run: |
      set -euo pipefail

      if [[ "$POC" == no ]]; then
        "$A4S_BIN" role-jobs verify-triage
      fi

      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      mkdir -p "$STATE"
      if test -f "$STATE/dependencies"; then
        cp "$STATE/dependencies" "$STATE/reviewed-dependencies"
      fi
      {
        printf '<!-- poc-triage:%s run:%s -->\n\n' "$POC" "$RUN"
        printf '## Pregunta\n\n%s\n\n## BASIS\n\n%s\n\n## REVIEW\n\n%s\n' "$QUESTION" "$BASIS" "${REVIEW:-}"
      } > "$STATE/triage.md"
      # A yes decision is published only after PoC admission succeeds.
      if [[ "$POC" == no ]]; then
        cd "$PRIMARY"
        gh issue comment "$ISSUE" --body-file "$STATE/triage.md"
      fi

  - id: detect_start_primary
    depends: triage_decision
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "no"
    run: |
      set -euo pipefail
      branch=$(git -C "$PRIMARY" branch --show-current)
      status=$(git -C "$PRIMARY" status --porcelain)
      if [[ "$branch" != "$BASE_BRANCH" ]]; then
        reason="primary on ${branch:-detached HEAD}, expected $BASE_BRANCH"
      elif [[ -n "$status" ]]; then
        reason="primary dirty: ${status//$'\n'/; }"
      else
        reason=ready
      fi
      printf 'start_gate: %s\n' "$reason" >&2
      printf 'reason=%s\n' "$reason" >> "$DAGU_OUTPUT_FILE"
    outputs:
      - name: reason

  - id: start_primary_unavailable
    depends: detect_start_primary
    continue_on: skipped
    preconditions:
      - condition: "${steps.detect_start_primary.outputs.reason}"
        expected: "re:^primary "
    action: human.task
    with:
      prompt: "start_gate: ${steps.detect_start_primary.outputs.reason}. Restore ${PRIMARY} to clean ${BASE_BRANCH}, preserving the operator's changes; then push back this checkpoint with the observed iteration to recheck in the same run. start_gate creates the worktree."
      push_back:
        rewind_to: detect_start_primary
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}

  - id: start_primary_unavailable_cancellation
    depends: start_primary_unavailable
    continue_on: skipped
    preconditions:
      - condition: "${steps.detect_start_primary.outputs.reason}"
        expected: "re:^primary "
    env:
      - CANCEL: ${steps.start_primary_unavailable.outputs.CANCEL}
      - CHECKPOINT: start_primary_unavailable
    run: &cancellation_gate |
      set -euo pipefail
      if [[ "$CANCEL" == yes ]]; then
        STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
        mkdir -p "$STATE"
        terminal=${NATIVE_TERMINAL:-failed}
        jq -n --arg run "$RUN" --arg checkpoint "$CHECKPOINT" --arg worktree "$WORKTREE" --arg native "$terminal" \
          '{run:$run,checkpoint:$checkpoint,worktree:$worktree,outcome:"cancelled",nativeExpected:$native}' > "$STATE/cancellation.json"
        printf 'Cancellation requested at %s; terminating before successors; evidence=%s\n' "$CHECKPOINT" "$STATE"
        if [[ "$terminal" == aborted ]]; then
          # A sibling human task may still wait. Stop only this resumed active,
          # effect-free gate; a plain failure would leave the run Waiting.
          dagu stop --run-id "$RUN" feature
          sleep 30
          printf 'Native stop did not terminate the active cancellation gate\n' >&2
        fi
        exit 77
      fi
      for field in ${REQUIRED_FIELDS:-}; do
        value=${!field:-}
        [[ -n "$value" && "$value" != '${steps.'* ]] ||
          { printf 'Normal completion requires %s at %s\n' "$field" "$CHECKPOINT" >&2; exit 1; }
      done
  - id: poc_scope_prepare
    depends: triage_decision
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "yes"
    env:
      - QUESTION: ${steps.triage.outputs.QUESTION}
      - REQUIRED_TARGETS: ${steps.triage.outputs.REQUIRED_TARGETS}
      - AUTHORIZED_TARGETS: ${steps.triage.outputs.AUTHORIZED_TARGETS}
      - SCOPE_BASIS: ${steps.triage.outputs.SCOPE_BASIS}
    run: '"$A4S_BIN" poc-scope assess'
    outputs:
      - name: SCOPE_DECISION
      - name: SCOPE_REQUEST
      - name: SCOPE_REASON
      - name: SCOPE_REJECTION

  - id: poc_scope_decision
    depends: poc_scope_prepare
    continue_on: skipped
    preconditions:
      - condition: "${steps.poc_scope_prepare.outputs.SCOPE_DECISION}"
        expected: "yes"
    action: human.task
    with:
      prompt: "PoC scope/access requires an owner decision before admission: ${steps.poc_scope_prepare.outputs.SCOPE_REASON}. Last rejection (run/request-bound): ${steps.poc_scope_prepare.outputs.SCOPE_REJECTION}. Required per action: defer = ACTION and BASIS only (question/targets ignored); provide-access = ACTION, BASIS, AUTHORIZED_TARGETS JSON array (QUESTION and REQUIRED_TARGETS default to the reviewed request; if supplied they must match it); narrow = ACTION, BASIS, a revised QUESTION, REQUIRED_TARGETS and AUTHORIZED_TARGETS JSON arrays within the existing authorized route. CANCEL=yes cancels without other fields."
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}
          ACTION: {type: string, enum: [narrow, provide-access, defer]}
          QUESTION: {type: string}
          REQUIRED_TARGETS: {type: string}
          AUTHORIZED_TARGETS: {type: string}
          BASIS: {type: string, minLength: 1}

  - id: poc_scope_decision_cancellation
    depends: poc_scope_decision
    continue_on: skipped
    preconditions:
      - condition: "${steps.poc_scope_prepare.outputs.SCOPE_DECISION}"
        expected: "yes"
    env:
      - CANCEL: ${steps.poc_scope_decision.outputs.CANCEL}
      - CHECKPOINT: poc_scope_decision
    run: *cancellation_gate

  - id: poc_scope_resolve
    depends: poc_scope_decision_cancellation
    continue_on:
      skipped: true
      exit_code: [23]
      mark_success: true
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "yes"
    env:
      - SCOPE_REQUEST: ${steps.poc_scope_prepare.outputs.SCOPE_REQUEST}
      - POC_SCOPE_ACTION: ${steps.poc_scope_decision.outputs.ACTION}
      - POC_QUESTION: ${steps.poc_scope_decision.outputs.QUESTION}
      - POC_REQUIRED_TARGETS: ${steps.poc_scope_decision.outputs.REQUIRED_TARGETS}
      - POC_AUTHORIZED_TARGETS: ${steps.poc_scope_decision.outputs.AUTHORIZED_TARGETS}
      - POC_SCOPE_BASIS: ${steps.poc_scope_decision.outputs.BASIS}
    run: '"$A4S_BIN" poc-scope decide'
    outputs:
      - name: POC_QUESTION
      - name: POC_REQUIRED_TARGETS
      - name: POC_AUTHORIZED_TARGETS
      - name: POC_SCOPE_BASIS

  - id: recover_poc_scope
    depends: poc_scope_resolve
    continue_on: skipped
    preconditions:
      - condition: "${poc_scope_resolve.exit_code}"
        expected: "23"
    action: human.task
    with:
      prompt: "Rejected PoC scope decision recorded for this run/request. Automatic push-back reopens poc_scope_decision with rule, expected and observed values."
      push_back:
        rewind_to: poc_scope_prepare
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}

  - id: recover_poc_scope_cancellation
    depends: recover_poc_scope
    continue_on: skipped
    preconditions:
      - condition: "${steps.recover_poc_scope.outputs.CANCEL}"
        expected: "re:^(yes|no)$"
    env:
      - CANCEL: ${steps.recover_poc_scope.outputs.CANCEL}
      - CHECKPOINT: recover_poc_scope
    run: *cancellation_gate


  - id: poc_admit
    depends: recover_poc_scope_cancellation
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "yes"
      - condition: "${poc_scope_resolve.exit_code}"
        expected: "0"
    env:
      - QUESTION: ${steps.poc_scope_resolve.outputs.POC_QUESTION}
      - REQUIRED_TARGETS: ${steps.poc_scope_resolve.outputs.POC_REQUIRED_TARGETS}
      - AUTHORIZED_TARGETS: ${steps.poc_scope_resolve.outputs.POC_AUTHORIZED_TARGETS}
      - SCOPE_BASIS: ${steps.poc_scope_resolve.outputs.POC_SCOPE_BASIS}
      - SCOPE_REQUEST: ${steps.poc_scope_prepare.outputs.SCOPE_REQUEST}
    run: |
      set -euo pipefail
      if ! dagu status --run-id "poc-$RUN" poc >/dev/null 2>&1; then
        parent_receipt=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN/receipt.json")
        "$A4S_BIN" enqueue --parent "$parent_receipt" --run-id "poc-$RUN" "$PRIMARY/.workspace/dagu/dags/poc.yaml" -- \
          ISSUE="$ISSUE" QUESTION="$QUESTION" OMP_SESSION_ID="$OMP_SESSION_ID" \
          REQUIRED_TARGETS="$REQUIRED_TARGETS" AUTHORIZED_TARGETS="$AUTHORIZED_TARGETS" \
          SCOPE_BASIS="$SCOPE_BASIS" SCOPE_REQUEST="$SCOPE_REQUEST"
      fi
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      cd "$PRIMARY"
      gh issue comment "$ISSUE" --body-file "$STATE/triage.md"


  - id: start_gate
    depends: start_primary_unavailable_cancellation
    continue_on:
      failure: true
      mark_success: true
    env:
      - POC: ${steps.triage.outputs.POC}
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "no"
    run: |
      set -euo pipefail
      reject() { printf 'rule=start_gate.%s expected=%q observed=%q\n' "$1" "$2" "$3" >&2; exit 1; }
      equal() { [[ "$2" == "$3" ]] || reject "$@"; }
      apply_promoted_poc_basis() {
        [[ -n "${POC_BASIS:-}" ]] || return 0
        [[ -n "$poc_carry_base" && -f "$poc_carry_patch" && "$poc_carry_digest" =~ ^[a-f0-9]{64}$ && -n "$poc_carry_run" ]] || {
          reject poc_basis_resolved complete "base=$poc_carry_base patch=$poc_carry_patch digest=$poc_carry_digest run=$poc_carry_run"
        }
        patch_digest() {
          local out digest
          out=$(mktemp)
          git -C "$WORKTREE" diff --binary "$poc_carry_base" > "$out"
          while IFS= read -r -d '' path; do
            (cd "$WORKTREE" && git diff --no-index --binary -- /dev/null "$path") >> "$out" || test "$?" -eq 1
          done < <(git -C "$WORKTREE" ls-files --others --exclude-standard -z)
          digest=$(shasum -a 256 "$out" | awk '{print $1}')
          rm -f "$out"
          printf '%s\n' "$digest"
        }
        if [[ -f "$STATE/poc-basis.json" ]]; then
          recorded_basis=$(jq -er '.digest' "$STATE/poc-basis.json")
          observed=$(patch_digest)
          [[ "$recorded_basis" == "$poc_carry_digest" && "$observed" == "$poc_carry_digest" ]] || {
            reject recorded_poc_basis "$poc_carry_digest" "recorded=$recorded_basis worktree=$observed"
          }
          printf 'poc_basis=applied digest=%s\n' "$poc_carry_digest"
          return 0
        fi
        if [[ -n "$(git -C "$WORKTREE" status --porcelain --untracked-files=all)" ]]; then
          observed=$(patch_digest)
          [[ "$observed" == "$poc_carry_digest" ]] || {
            reject existing_poc_basis "$poc_carry_digest" "$observed"
          }
        else
          head_sha=$(git -C "$WORKTREE" rev-parse HEAD)
          [[ "$head_sha" == "$poc_carry_base" ]] || {
            reject poc_base "$poc_carry_base" "$head_sha"
          }
          if [[ -s "$poc_carry_patch" ]]; then
            git -C "$WORKTREE" apply --binary --check "$poc_carry_patch" || {
              reject poc_patch_applicable "$poc_carry_base" "published PoC patch does not apply; preserved"
            }
            git -C "$WORKTREE" apply --binary "$poc_carry_patch"
          fi
          observed=$(patch_digest)
          [[ "$observed" == "$poc_carry_digest" ]] || {
            reject applied_poc_basis "$poc_carry_digest" "$observed"
          }
        fi
        jq -n --arg pocRun "$poc_carry_run" --arg url "$POC_BASIS" --arg digest "$poc_carry_digest" --arg base "$poc_carry_base" \
          '{schemaVersion:1,pocRun:$pocRun,url:$url,digest:$digest,base:$base,applied:true}' > "$STATE/poc-basis.json"
        printf 'poc_basis=applied digest=%s\n' "$poc_carry_digest"
      }
      printf '%s\n' "$DAGU_FEATURE_BUNDLE"
      eval "$DAGU_RESOURCE_GUARD"
      resource_lock claim
      umask 0022
      [[ -n "$PRIMARY" ]] || reject primary nonempty "$PRIMARY"
      [[ -n "$GATE" ]] || reject gate nonempty "$GATE"
      [[ -n "$REQUIRED_CHECK" ]] || reject required_check nonempty "$REQUIRED_CHECK"
      primary_path=$(cd "$PRIMARY" && pwd -P)
      primary_root=$(cd "$(git -C "$PRIMARY" rev-parse --show-toplevel)" && pwd -P)
      equal primary_root "$primary_path" "$primary_root"
      equal primary_git_dir "$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-common-dir)" "$(git -C "$PRIMARY" rev-parse --absolute-git-dir)"
      git -C "$PRIMARY" check-ignore -q "$WORKTREE" || reject ignored_worktree ignored "$WORKTREE"
      equal primary_branch "$BASE_BRANCH" "$(git -C "$PRIMARY" branch --show-current)"
      equal primary_clean "" "$(git -C "$PRIMARY" status --porcelain)"
      lifecycle_fetch "$PRIMARY" origin || reject fetch success "fetch origin failed; restore origin access and recover this run"
      git -C "$PRIMARY" merge --ff-only "origin/$BASE_BRANCH" || reject fast_forward "origin/$BASE_BRANCH" "ff-only failed; reconcile primary preserving commits, then recover this run"
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      OWNER=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/resources/$(printf '%s' "$BRANCH" | git hash-object --stdin).json")
      mkdir -p "$STATE" "${OWNER%/*}"
      if [[ -f "$OWNER" ]]; then
        jq -e --arg primary "$primary_path" --arg branch "$BRANCH" --arg worktree "$WORKTREE" \
          '.primary == $primary and .branch == $branch and .worktree == $worktree' "$OWNER" >/dev/null &&
          recorded_run=$(jq -er '.run | select(type == "string" and length > 0)' "$OWNER") &&
          resource_owner_run "$recorded_run" ||
          reject resource_identity "primary=$primary_path branch=$BRANCH worktree=$WORKTREE run=$RUN previous=$RESOURCE_PREVIOUS_OWNER terminal predecessor chain" "$(cat "$OWNER")"
      fi
      poc_carry_base=
      poc_carry_patch=
      poc_carry_digest=
      poc_carry_run=
      if [[ -n "${POC_BASIS:-}" ]]; then
        [[ "$RUN" == feature-* ]] || reject promoted_run 'feature-<poc-run>' "$RUN"
        poc_carry_run=${RUN#feature-}
        [[ "$poc_carry_run" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || reject poc_run valid_run_id "$poc_carry_run"
        poc_state=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "poc/runs/$poc_carry_run")
        [[ -f "$poc_state/full.patch" && -s "$poc_state/full.patch.sha256" && -s "$poc_state/comment.url" && -s "$poc_state/promotion.url" && -s "$poc_state/base.sha" ]] || {
          reject poc_evidence "full.patch full.patch.sha256 comment.url promotion.url base.sha" "incomplete promoted PoC basis: $poc_state"
        }
        poc_comment=$(tr -d '\r\n' < "$poc_state/comment.url")
        poc_promotion=$(tr -d '\r\n' < "$poc_state/promotion.url")
        [[ "$poc_comment" == "$POC_BASIS" && "$poc_promotion" == "$POC_BASIS" ]] || {
          reject poc_comment "$POC_BASIS" "comment=$poc_comment promotion=$poc_promotion"
        }
        poc_carry_base=$(tr -d '\r\n' < "$poc_state/base.sha")
        [[ "$poc_carry_base" =~ ^[a-f0-9]{40}$ ]] || reject poc_base_sha 40_hex "$poc_carry_base"
        git -C "$PRIMARY" cat-file -e "${poc_carry_base}^{commit}" || reject poc_base_commit available "$poc_carry_base"
        git -C "$PRIMARY" merge-base --is-ancestor "$poc_carry_base" "origin/$BASE_BRANCH" || {
          reject poc_base_ancestry "ancestor of origin/$BASE_BRANCH" "$poc_carry_base"
        }
        poc_carry_digest=$(tr -d '[:space:]' < "$poc_state/full.patch.sha256")
        poc_observed=$(shasum -a 256 "$poc_state/full.patch" | awk '{print $1}')
        [[ "$poc_carry_digest" =~ ^[a-f0-9]{64}$ && "$poc_observed" == "$poc_carry_digest" ]] || {
          reject poc_patch_digest "$poc_carry_digest" "$poc_observed"
        }
        poc_carry_patch=$poc_state/full.patch
      fi
      if test -e "$WORKTREE"; then
        worktree_path=$(cd "$WORKTREE" && pwd -P)
        worktree_root=$(cd "$(git -C "$WORKTREE" rev-parse --show-toplevel)" && pwd -P)
        equal worktree_root "$worktree_path" "$worktree_root"
        equal worktree_branch "$BRANCH" "$(git -C "$WORKTREE" branch --show-current)"
      elif git -C "$PRIMARY" show-ref --verify --quiet "refs/heads/$BRANCH"; then
        git -C "$PRIMARY" worktree add "$WORKTREE" "$BRANCH"
      elif [[ -n "$poc_carry_base" ]]; then
        git -C "$PRIMARY" worktree add -b "$BRANCH" "$WORKTREE" "$poc_carry_base"
      else
        git -C "$PRIMARY" rev-parse --verify "origin/$BASE_BRANCH^{commit}" >/dev/null
        git -C "$PRIMARY" worktree add -b "$BRANCH" "$WORKTREE" "origin/$BASE_BRANCH"
      fi
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      previous_owner=$RESOURCE_PREVIOUS_OWNER
      owner=$(git -C "$WORKTREE" rev-parse --path-format=absolute --git-path dagu-feature-owner)
      identity=$(jq -nc --arg primary "$primary_path" --arg worktree "$(cd "$WORKTREE" && pwd -P)" \
        --arg branch "$BRANCH" --arg run "$RUN" --arg session "$OMP_SESSION_ID" \
        '{primary:$primary,worktree:$worktree,branch:$branch,run:$run,session:$session}')
      ownership_refused() {
        printf 'rule=start_gate.ownership expected=%q observed=%q\n' "$identity (previous owner $previous_owner)" "$(cat "$1")" >&2
        exit 1
      }
      if test -f "$owner"; then
        if [[ "$(cat "$owner")" == "$identity" ]]; then
          : # Adoption already completed by this run.
        elif [[ -n "$previous_owner" && "$previous_owner" != "$RUN" ]]; then
          jq -e --argjson expected "$identity" \
            '.primary == $expected.primary and .worktree == $expected.worktree and .branch == $expected.branch and .session == $expected.session' "$owner" >/dev/null &&
            recorded_run=$(jq -er '.run | select(type == "string" and length > 0)' "$owner") &&
            resource_owner_run "$recorded_run" ||
            ownership_refused "$owner"
        else
          ownership_refused "$owner"
        fi
      fi
      if test -f "$STATE/identity"; then
        test "$(cat "$STATE/identity")" = "$identity" || ownership_refused "$STATE/identity"
      fi
      mkdir -p "$STATE"
      printf '%s\n' "$identity" > "$owner"
      printf '%s\n' "$identity" > "$STATE/identity"
      if ! test -f "$STATE/base"; then
        git -C "$WORKTREE" rev-parse HEAD > "$STATE/initial-head"
        git -C "$WORKTREE" merge-base HEAD "origin/$BASE_BRANCH" > "$STATE/base"
      fi
      worktree_path=$(cd "$WORKTREE" && pwd -P)
      jq -n --arg run "$RUN" --arg primary "$primary_path" --arg branch "$BRANCH" --arg worktree "$worktree_path" \
        '{run:$run,primary:$primary,branch:$branch,worktree:$worktree}' > "$STATE/resource.json"
      cp "$STATE/resource.json" "$OWNER"
      apply_promoted_poc_basis
      printf 'issue=%s\nbranch=%s\nworktree=%s\nbase_sha=%s\n' \
        "$ISSUE" "$BRANCH" "$WORKTREE" "$(git -C "$WORKTREE" rev-parse HEAD)"

  - id: recover_start_gate
    depends: start_gate
    continue_on: skipped
    preconditions:
      - condition: "${start_gate.exit_code}"
        expected: "re:^[1-9][0-9]*$"
    action: human.task
    with:
      prompt: "start_gate failed. Inspect its logs, restore remote access or reconcile PRIMARY preserving operator commits, then push back with the observed run-wide iteration to retry start_gate in this run."
      push_back:
        rewind_to: start_gate
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}

  - id: recover_start_gate_cancellation
    depends: recover_start_gate
    continue_on: skipped
    preconditions:
      - condition: "${steps.recover_start_gate.outputs.CANCEL}"
        expected: "re:^(yes|no)$"
    env:
      - CANCEL: ${steps.recover_start_gate.outputs.CANCEL}
      - CHECKPOINT: recover_start_gate
    run: *cancellation_gate

  - id: implement_budget
    depends: recover_start_gate_cancellation
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "no"
    run: '"$A4S_BIN" escalation check'
    outputs:
      - name: ESCALATE
      - name: REQUEST

  - id: escalation
    depends: implement_budget
    continue_on: skipped
    preconditions:
      - condition: "${steps.implement_budget.outputs.ESCALATE}"
        expected: "yes"
    action: human.task
    with: &escalation_task
      prompt: "Lifecycle budget exhausted. Inspect escalation.json in durable run state (run, iteration, SHA, findings, elapsed time and spend). Complete ACTION=continue to renew the budget or ACTION=stop to retain evidence and run onExit (native Failed/77). To change scope or delivery route, push back to triage with the observed --expected-iteration, REASON and DECIDED_BY. The owning OMP session receives the decision request."
      push_back:
        rewind_to: triage
        form:
          type: object
          required: [REASON, DECIDED_BY]
          properties:
            REASON: {type: string, minLength: 1}
            DECIDED_BY: {type: string, minLength: 1}
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}
          ACTION: {type: string, enum: [continue, stop]}
          REASON: {type: string, minLength: 1}
          DECIDED_BY: {type: string, minLength: 1}

  - id: escalation_cancellation
    depends: escalation
    continue_on: skipped
    preconditions:
      - condition: "${steps.implement_budget.outputs.ESCALATE}"
        expected: "yes"
    env:
      - CANCEL: ${steps.escalation.outputs.CANCEL}
      - CHECKPOINT: escalation
      - REQUIRED_FIELDS: ACTION REASON DECIDED_BY
      - ACTION: ${steps.escalation.outputs.ACTION}
      - REASON: ${steps.escalation.outputs.REASON}
      - DECIDED_BY: ${steps.escalation.outputs.DECIDED_BY}
    run: *cancellation_gate

  - id: escalation_decision
    depends: escalation_cancellation
    continue_on: skipped
    preconditions:
      - condition: "${steps.implement_budget.outputs.ESCALATE}"
        expected: "yes"
    env:
      - ACTION: ${steps.escalation.outputs.ACTION}
      - REASON: ${steps.escalation.outputs.REASON}
      - DECIDED_BY: ${steps.escalation.outputs.DECIDED_BY}
    run: '"$A4S_BIN" escalation decision'

  - id: implement
    depends: escalation_decision
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "no"
    run: '"$A4S_BIN" role-jobs stage implement'
    outputs:
      - name: SUMMARY
      - name: MESSAGE
      - name: IMPLEMENTER


  - id: capture
    depends: implement
    env:
      - SUMMARY: ${steps.implement.outputs.SUMMARY}
      - MESSAGE: ${steps.implement.outputs.MESSAGE}
      - IMPLEMENTER: ${steps.implement.outputs.IMPLEMENTER}
    run: |
      set -euo pipefail
      umask 0022
      fail() { printf 'rule=capture.%s expected=%q observed=%q\n' "$1" "$2" "$3" >&2; exit 1; }
      equal() { [[ "$2" == "$3" ]] || fail "$@"; }
      primary=$(cd "$PRIMARY" && pwd -P)
      worktree=$(cd "$WORKTREE" && pwd -P)
      equal primary_root "$primary" "$(cd "$(git -C "$PRIMARY" rev-parse --show-toplevel)" && pwd -P)"
      equal primary_git_dir "$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-common-dir)" "$(git -C "$PRIMARY" rev-parse --absolute-git-dir)"
      equal assigned_worktree "$primary/.workspace/worktrees/issue-$ISSUE" "$worktree"
      equal worktree_root "$worktree" "$(cd "$(git -C "$WORKTREE" rev-parse --show-toplevel)" && pwd -P)"
      equal common_git_dir "$(git -C "$PRIMARY" rev-parse --absolute-git-dir)" "$(git -C "$WORKTREE" rev-parse --path-format=absolute --git-common-dir)"
      equal branch "$BRANCH" "$(git -C "$WORKTREE" branch --show-current)"
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      identity=$(jq -nc --arg primary "$primary" --arg worktree "$worktree" \
        --arg branch "$BRANCH" --arg run "$RUN" --arg session "$OMP_SESSION_ID" \
        '{primary:$primary,worktree:$worktree,branch:$branch,run:$run,session:$session}')
      equal run_identity "$identity" "$(cat "$STATE/identity")"
      equal worktree_owner "$identity" "$(cat "$(git -C "$WORKTREE" rev-parse --path-format=absolute --git-path dagu-feature-owner)")"
      for field in SUMMARY MESSAGE IMPLEMENTER; do
        [[ -n "${!field}" ]] || fail "delivery_$field" nonempty "${!field}"
      done
      cd "$WORKTREE"
      base=$(cat "$STATE/base")
      head=$(git rev-parse HEAD)
      expected=$base
      if test -f "$STATE/initial-head"; then expected=$(cat "$STATE/initial-head"); fi
      if test -f "$STATE/candidate.json"; then expected=$(jq -r .sha "$STATE/candidate.json"); fi
      equal candidate_head "$expected" "$head"
      # Resolve every changed path and symlink lexically and physically, including dangling links.
      confined() {
        local path=$1 part resolved=$worktree links=0
        while test -n "$path"; do
          part=${path%%/*}
          if [[ "$path" == */* ]]; then path=${path#*/}; else path=; fi
          case "$part" in
            ''|.) continue ;;
            ..) resolved=${resolved%/*} ;;
            *)
              resolved="$resolved/$part"
              if test -L "$resolved"; then
                links=$((links + 1))
                test "$links" -le 40 || fail symlink_depth "<=40" "$links"
                target=$(readlink "$resolved")
                resolved=${resolved%/*}
                if [[ "$target" == /* ]]; then
                  case "$target/" in "$worktree/"*) target=${target#"$worktree/"}; resolved=$worktree ;; *) fail confined_path "$worktree" "$1 -> $target" ;; esac
                fi
                path="$target${path:+/$path}"
              fi ;;
          esac
          case "$resolved/" in "$worktree/"*|/) ;; *) fail confined_path "$worktree" "$1 -> $resolved" ;; esac
        done
        case "$resolved/" in "$worktree/"*) ;; *) fail confined_path "$worktree" "$1 -> $resolved" ;; esac
      }
      scratch=$(mktemp -d)
      trap 'rm -rf "$scratch"' EXIT
      # Reject disposable work before inspecting patches or staging any candidate files.
      git ls-files --others --exclude-standard -z -- .workspace/ > "$scratch/untracked-workspace"
      while IFS= read -r -d '' path; do
        fail untracked_workspace "disposable evidence in $STATE/computations/ or \$TMP, never inside the worktree" "untracked worktree scratch: $path"
      done < "$scratch/untracked-workspace"
      find . -path ./.git -prune -o -name .git -print0 -prune > "$scratch/nested-git"
      while IFS= read -r -d '' path; do
        fail nested_git "disposable evidence in $STATE/computations/ or \$TMP, never inside the worktree" "nested git entry: ${path#./}"
      done < "$scratch/nested-git"
      poc_basis=null
      if [[ -f "$STATE/poc-basis.json" ]]; then
        basis_digest=$(jq -r 'if .schemaVersion == 1 and .applied == true and (.digest | test("^[a-f0-9]{64}$")) then .digest else "" end' "$STATE/poc-basis.json")
        [[ -n "$basis_digest" ]] || fail poc_basis valid_applied_digest "$(cat "$STATE/poc-basis.json")"
        git diff --binary HEAD > "$scratch/basis.patch"
        while IFS= read -r -d '' path; do
          git diff --no-index --binary -- /dev/null "$path" >> "$scratch/basis.patch" || test "$?" -eq 1
        done < <(git ls-files --others --exclude-standard -z)
        observed_basis=$(shasum -a 256 "$scratch/basis.patch" | awk '{print $1}')
        if [[ "$observed_basis" == "$basis_digest" ]]; then feature_delta=empty; else feature_delta=changed; fi
        jq --arg featureDelta "$feature_delta" '.featureDelta = $featureDelta' "$STATE/poc-basis.json" > "$scratch/poc-basis.json"
        mv "$scratch/poc-basis.json" "$STATE/poc-basis.json"
        poc_basis=$(jq -c '{schemaVersion,pocRun,url,digest,base,applied,featureDelta}' "$STATE/poc-basis.json")
        printf 'poc_basis=applied digest=%s feature_delta=%s\n' "$basis_digest" "$feature_delta"
      fi
      git diff --name-only --no-renames -z "$base" > "$scratch/paths"
      git ls-files --others --exclude-standard -z >> "$scratch/paths"
      while IFS= read -r -d '' path; do confined "$path"; done < "$scratch/paths"
      # Stage through a private index: rejection leaves the delivered files and real index intact.
      export GIT_INDEX_FILE="$scratch/index"
      git read-tree "$head"
      git add -A -- .
      tree=$(git write-tree)
      implementation=null
      if [[ "$IMPLEMENTER" =~ ^[a-f0-9]{64}$ ]]; then
        result="$STATE/role-jobs/$IMPLEMENTER/result.json"
        jq -e --arg repo "$primary" --arg worktree "$worktree" --arg run "$RUN" --arg head "$head" --arg id "$IMPLEMENTER" \
          '.id == $id and .state == "completed" and .binding.repo == $repo and .binding.worktree == $worktree and
           .binding.run == $run and .binding.stage == "implement" and .binding.sha == $head and
           (.output.summary | type == "string" and test("\\S")) and (.output.message | type == "string" and test("\\S"))' "$result" >/dev/null ||
          fail implementation_receipt "completed receipt for $head" "$(cat "$result")"
        # Dagu outputs are single-line; the verified receipt keeps the multi-line summary and commit message.
        SUMMARY=$(jq -r .output.summary "$result")
        MESSAGE=$(jq -r .output.message "$result")
        digest=$(shasum -a 256 "$result")
        implementation=$(jq -nc --arg inputSha "$head" --arg resultDigest "${digest%% *}" \
          '{inputSha:$inputSha,resultDigest:$resultDigest}')
      fi
      iteration=0
      if test -f "$STATE/candidate.json"; then
        if jq -e --arg tree "$tree" --arg message "$MESSAGE" --arg base "$base" --arg implementer "$IMPLEMENTER" \
          '.tree == $tree and .message == $message and .base == $base and .implementer == $implementer' "$STATE/candidate.json" >/dev/null; then
          printf 'candidate_sha=%s\n' "$head"
          exit 0
        fi
        iteration=$(( $(jq -r .iteration "$STATE/candidate.json") + 1 ))
      fi
      seed=$(printf '%s:%s' "$RUN" "$iteration" | cksum)
      epoch=$((1700000000 + ${seed%% *} % 100000000))
      export GIT_AUTHOR_DATE="@$epoch +0000" GIT_COMMITTER_DATE="@$epoch +0000"
      signing=()
      if test "$(git config --bool --get commit.gpgsign || test "$?" -eq 1)" = true; then signing=(-S); fi
      sha=$(printf '%s\n' "$MESSAGE" | git commit-tree "${signing[@]}" "$tree" -p "$base")
      git diff --binary --full-index "$base" "$sha" > "$scratch/diff.patch"
      jq -nc --arg base "$base" --arg sha "$sha" --arg tree "$tree" --arg message "$MESSAGE" \
        --arg summary "$SUMMARY" --arg implementer "$IMPLEMENTER" --argjson iteration "$iteration" --argjson implementation "$implementation" \
        --argjson pocBasis "$poc_basis" \
        '{base:$base,sha:$sha,tree:$tree,message:$message,summary:$summary,implementer:$implementer,iteration:$iteration,implementation:$implementation}
         + (if $pocBasis == null then {} else {pocBasis:$pocBasis} end)' > "$scratch/candidate.json"
      git update-ref "refs/heads/$BRANCH" "$sha" "$head"
      unset GIT_INDEX_FILE
      git read-tree "$tree"
      if test -f "$STATE/candidate.json"; then
        old=$(jq -r .sha "$STATE/candidate.json")
        mkdir -p "$STATE/historical/$old"
        for artifact in candidate.json diff.patch gate.json validation.json; do
          if test -f "$STATE/$artifact"; then mv "$STATE/$artifact" "$STATE/historical/$old/"; fi
        done
      fi
      mv "$scratch/candidate.json" "$scratch/diff.patch" "$STATE/"
      "$A4S_BIN" protect refresh
      printf 'candidate_sha=%s\n' "$sha"

  - id: checkpoint_push
    depends: capture
    run: |
      set -euo pipefail
      umask 0022
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      eval "$DAGU_RESOURCE_GUARD"
      resolve_run_pr
      integrated_terminal checkpoint_push
      test "$(git -C "$WORKTREE" branch --show-current)" = "$BRANCH"
      test -z "$(git -C "$WORKTREE" status --porcelain)"
      printf 'INTEGRATED=no\n' >> "${DAGU_OUTPUT_FILE:-/dev/null}"
      head=$(jq -r .sha "$STATE/candidate.json")
      test "$(git -C "$WORKTREE" rev-parse HEAD)" = "$head"
      repo=$WORKTREE base=$(cat "$STATE/base")
      blob() { git -C "$repo" show "$1:$2" 2>/dev/null || true; }
      extract() {
        jq -Rrs --arg path "$1" '
          def matches($r): [scan($r) | if type == "array" then .[0] else . end] | unique;
          if $path | endswith("package.json") then
            (fromjson? // {}) | [.dependencies, .devDependencies, .peerDependencies, .optionalDependencies] | map(. // {} | keys) | add | unique
          elif $path | endswith("go.mod") then
            matches("(?m)^\\s*(?:require\\s+)?([A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+)\\s+v[0-9]")
          elif $path | test("(^|/)requirements[^/]*\\.txt$") then
            matches("(?m)^\\s*([A-Za-z0-9][A-Za-z0-9_.-]*)(?:\\[|[<>=!~; ]|$)")
          elif $path | endswith("pyproject.toml") then
            ([scan("(?s)(?:dependencies|optional-dependencies)\\s*=\\s*\\[(.*?)\\]") | .[0] | scan("[\"\u0027]([A-Za-z0-9][A-Za-z0-9_.-]*)") | .[0]] +
             [scan("(?ms)^\\[(?:tool\\.poetry(?:\\.group\\.[^.]+)?\\.dependencies)\\]\\s*([^\\[]*)") | .[0] | scan("(?m)^([A-Za-z0-9_.-]+)\\s*=") | .[0]]) | unique
          elif $path | test("\\.(csproj|props)$") then
            matches("<(?:PackageReference|PackageVersion)\\s+Include=\"([^\"]+)\"")
          elif $path | test("\\.ya?ml$") then
            ([scan("(?m)^\\s*(image|chart|url):\\s*[\"\u0027]?([^\\s\"\u0027]+)") | if .[0] == "image" then .[1] | sub("(@sha256:.*|:[^/:]+)$"; "") else .[1] end] +
             (if $path | endswith("Chart.yaml") then
               [scan("(?ms)^dependencies:\\s*(.*)") | .[0] | scan("(?m)^\\s*-\\s*name:\\s*([^\\s]+)") | .[0]]
              else [] end)) | unique
          else [] end
        '
      }
      relationships() {
        git -C "$repo" ls-tree -r --name-only "$1" |
        jq -Rr 'select(test("(^|/)(package\\.json|go\\.mod|pyproject\\.toml|requirements[^/]*\\.txt)$|\\.(ya?ml|csproj|props)$"))' |
        while IFS= read -r path; do
          dependencies=$(blob "$1" "$path" | extract "$path")
          jq -nr --arg path "$path" --argjson dependencies "$dependencies" \
            '$dependencies[] | "dependency\t\($path)\t\(.)"'
        done |
        jq -Rsc 'split("\n") | map(select(length > 0)) | unique'
      }
      base_relationships=$(relationships "$base")
      head_relationships=$(relationships "$head")
      jq -nr --argjson before "$base_relationships" --argjson after "$head_relationships" \
        '$after - $before | .[]' > "$STATE/dependencies"
      dirs() {
        git -C "$repo" ls-tree -r --name-only "$1" | jq -Rrs '
          split("\n") | map(select(length > 0)) | map(
            if test("^(packages|apps|extensions)/[^/]+/") then split("/")[0:2] | join("/")
            elif test("^(\\.pi|\\.omp)/extensions/[^/]+") then split("/")[0:3] | join("/")
            elif endswith("/__init__.py") then sub("/__init__\\.py$"; "")
            elif endswith("/package.json") or endswith("/go.mod") or endswith("/pyproject.toml") then split("/")[0:-1] | join("/")
            else empty end) | unique'
      }
      before=$(dirs "$base")
      after=$(dirs "$head")
      jq -nr --argjson before "$before" --argjson after "$after" '$after - $before | .[] | "package-or-extension\t\(.)"' >> "$STATE/dependencies"
      if test -s "$STATE/dependencies" && ! cmp -s "$STATE/dependencies" "$STATE/reviewed-dependencies"; then
        printf 'rewind\n' > "$STATE/dependency-action"
      else
        printf 'complete\n' > "$STATE/dependency-action"
      fi
      sha=$(git -C "$WORKTREE" rev-parse HEAD)
      ref="refs/dagu/checkpoints/issue-$ISSUE"
      if test -f "$STATE/checkpoint-sha"; then
        expected=$(cat "$STATE/checkpoint-sha")
      else
        expected=$(git -C "$WORKTREE" ls-remote origin "$ref" | cut -f1)
      fi
      git -C "$WORKTREE" push "--force-with-lease=$ref:$expected" origin "$sha:$ref"
      printf '%s\n' "$sha" > "$STATE/checkpoint-sha"
      printf 'checkpoint_sha=%s\n' "$sha"
    outputs:
      - name: INTEGRATED

  - id: dependency_review
    depends: checkpoint_push
    preconditions:
      - condition: "${steps.checkpoint_push.outputs.INTEGRATED}"
        expected: "re:^(|no)$"
    action: human.task
    with:
      prompt: "Dependency net checkpoint: the wait handler completes unchanged dependencies or pushes back to triage."
      push_back:
        rewind_to: triage
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}

  - id: dependency_review_cancellation
    depends: dependency_review
    preconditions:
      - condition: "${steps.checkpoint_push.outputs.INTEGRATED}"
        expected: "re:^(|no)$"
    env:
      - CANCEL: ${steps.dependency_review.outputs.CANCEL}
      - CHECKPOINT: dependency_review
    run: *cancellation_gate

  - id: rebase_budget
    depends: dependency_review_cancellation
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "no"
      - condition: "${steps.checkpoint_push.outputs.INTEGRATED}"
        expected: "re:^(|no)$"
    run: '"$A4S_BIN" escalation check'
    outputs:
      - name: ESCALATE
      - name: REQUEST

  - id: rebase_escalation
    depends: rebase_budget
    continue_on: skipped
    preconditions:
      - condition: "${steps.rebase_budget.outputs.ESCALATE}"
        expected: "yes"
    action: human.task
    with: *escalation_task

  - id: rebase_escalation_cancellation
    depends: rebase_escalation
    continue_on: skipped
    preconditions:
      - condition: "${steps.rebase_budget.outputs.ESCALATE}"
        expected: "yes"
    env:
      - CANCEL: ${steps.rebase_escalation.outputs.CANCEL}
      - CHECKPOINT: rebase_escalation
      - REQUIRED_FIELDS: ACTION REASON DECIDED_BY
      - ACTION: ${steps.rebase_escalation.outputs.ACTION}
      - REASON: ${steps.rebase_escalation.outputs.REASON}
      - DECIDED_BY: ${steps.rebase_escalation.outputs.DECIDED_BY}
    run: *cancellation_gate

  - id: rebase_escalation_decision
    depends: rebase_escalation_cancellation
    continue_on: skipped
    preconditions:
      - condition: "${steps.rebase_budget.outputs.ESCALATE}"
        expected: "yes"
    env:
      - ACTION: ${steps.rebase_escalation.outputs.ACTION}
      - REASON: ${steps.rebase_escalation.outputs.REASON}
      - DECIDED_BY: ${steps.rebase_escalation.outputs.DECIDED_BY}
    run: '"$A4S_BIN" escalation decision'

  - id: rebase
    depends: rebase_escalation_decision
    retry_policy:
      limit: 3
      interval_sec: 5
      exit_code: [75]
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "no"
      - condition: "${steps.checkpoint_push.outputs.INTEGRATED}"
        expected: "re:^(|no)$"
    run: |
      set -euo pipefail
      umask 0022
      test "$(git -C "$WORKTREE" branch --show-current)" = "$BRANCH"
      test -z "$(git -C "$WORKTREE" status --porcelain)"
      eval "$DAGU_RESOURCE_GUARD"
      lifecycle_fetch "$WORKTREE" origin
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      before=$(jq -r .sha "$STATE/candidate.json")
      test "$(git -C "$WORKTREE" rev-parse HEAD)" = "$before"
      base=$(cat "$STATE/base")
      test "$(jq -r .base "$STATE/candidate.json")" = "$base"
      test "$(git -C "$WORKTREE" rev-parse 'HEAD^{tree}')" = "$(jq -r .tree "$STATE/candidate.json")"
      test "$(git -C "$WORKTREE" rev-parse HEAD^)" = "$base"
      identity=$(jq -nc --arg primary "$(cd "$PRIMARY" && pwd -P)" \
        --arg worktree "$(cd "$WORKTREE" && pwd -P)" --arg branch "$BRANCH" \
        --arg run "$RUN" --arg session "$OMP_SESSION_ID" \
        '{primary:$primary,worktree:$worktree,branch:$branch,run:$run,session:$session}')
      test "$(cat "$STATE/identity")" = "$identity"
      test "$(cat "$(git -C "$WORKTREE" rev-parse --path-format=absolute --git-path dagu-feature-owner)")" = "$identity"
      upstream=$(git -C "$WORKTREE" rev-parse "origin/$BASE_BRANCH")
      rebase_status=0
      git -C "$WORKTREE" rebase "$upstream" || rebase_status=$?
      if test "$rebase_status" -ne 0; then
        if test -e "$(git -C "$WORKTREE" rev-parse --git-path index.lock)"; then
          printf 'rebase: index.lock held in %s\n' "$WORKTREE" >&2
          exit 75
        fi
        if ! { test -d "$(git -C "$WORKTREE" rev-parse --git-path rebase-merge)" ||
               test -d "$(git -C "$WORKTREE" rev-parse --git-path rebase-apply)"; } ||
           test -z "$(git -C "$WORKTREE" diff --name-only --diff-filter=U)"; then
          exit "$rebase_status"
        fi
        if test -n "${REBASE_RESOLVER:-}"; then
          test "$(git -C "$WORKTREE" rev-parse REBASE_HEAD)" = "$before"
          test "$(git -C "$WORKTREE" rev-parse HEAD)" = "$upstream"
          resolver_status=0
          (cd "$WORKTREE" && DAGU_REBASE_BASE="$base" DAGU_REBASE_CANDIDATE="$before" \
            DAGU_REBASE_UPSTREAM="$upstream" bash -euo pipefail -c "$REBASE_RESOLVER") || resolver_status=$?
          case "$resolver_status" in
            0)
              test -z "$(git -C "$WORKTREE" diff --name-only --diff-filter=U)"
              GIT_EDITOR=true git -C "$WORKTREE" rebase --continue
              rebase_status=0 ;;
            2) test -n "$(git -C "$WORKTREE" diff --name-only --diff-filter=U)" ;;
            *) exit "$resolver_status" ;;
          esac
        fi
      fi
      if test "$rebase_status" -eq 0; then
        printf 'complete\n' > "$STATE/conflict-action"
        test "$(git -C "$WORKTREE" rev-list --count "origin/$BASE_BRANCH..HEAD")" -eq 1
        after=$(git -C "$WORKTREE" rev-parse HEAD)
        if [[ "$before" != "$after" ]]; then
          mkdir -p "$STATE/historical/$before"
          for artifact in candidate.json diff.patch gate.json validation.json; do
            if test -f "$STATE/$artifact"; then mv "$STATE/$artifact" "$STATE/historical/$before/"; fi
          done
          git -C "$WORKTREE" rev-parse "origin/$BASE_BRANCH" > "$STATE/base"
          jq --arg sha "$after" --arg base "$(cat "$STATE/base")" \
            --arg tree "$(git -C "$WORKTREE" rev-parse 'HEAD^{tree}')" \
            '.sha=$sha | .base=$base | .tree=$tree' "$STATE/historical/$before/candidate.json" > "$STATE/candidate.json"
          git -C "$WORKTREE" diff --binary --full-index "$(cat "$STATE/base")" "$after" > "$STATE/diff.patch"
        fi
        "$A4S_BIN" protect refresh
        printf 'rebased_sha=%s\n' "$after"
      else
        git -C "$WORKTREE" diff --name-only --diff-filter=U > "$STATE/conflict-files"
        "$A4S_BIN" escalation finding conflict "$STATE/conflict-files"
        # Keep the resolved/nonconflicting delivery and conflict markers for implement.
        git -C "$WORKTREE" rebase --quit
        git -C "$WORKTREE" symbolic-ref HEAD "refs/heads/$BRANCH"
        base=$(git -C "$WORKTREE" rev-parse "origin/$BASE_BRANCH")
        git -C "$WORKTREE" update-ref "refs/heads/$BRANCH" "$base" "$before"
        git -C "$WORKTREE" read-tree "$base"
        mkdir -p "$STATE/historical/$before"
        for artifact in candidate.json diff.patch gate.json validation.json; do
          if test -f "$STATE/$artifact"; then mv "$STATE/$artifact" "$STATE/historical/$before/"; fi
        done
        printf '%s\n' "$base" > "$STATE/base"
        git -C "$WORKTREE" rev-parse HEAD > "$STATE/initial-head"
        test -s "$STATE/conflict-files"
        printf 'rewind\n' > "$STATE/conflict-action"
        sed 's/^/conflict_files=/' "$STATE/conflict-files"
        exit 0
      fi

  - id: conflict_review
    depends: rebase
    action: human.task
    with:
      prompt: "Rebase conflict checkpoint: the wait handler completes a clean rebase or pushes back to implement with the conflict files."
      push_back:
        rewind_to: implement_budget
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}

  - id: conflict_review_cancellation
    depends: conflict_review
    env:
      - CANCEL: ${steps.conflict_review.outputs.CANCEL}
      - CHECKPOINT: conflict_review
    run: *cancellation_gate

  - id: gate
    depends: conflict_review_cancellation
    continue_on:
      failure: true
      mark_success: true
    retry_policy:
      limit: 1
      interval_sec: 5
    run: |
      set -euo pipefail
      umask 0022
      A4S_GATE_STEP_STARTED_MS=$("$A4S_BIN" reconcile now)
      export A4S_GATE_STEP_STARTED_MS
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      A4S_GATE_HELPER=$("$A4S_BIN" gate path)
      A4S_GATE_JOURNAL=$("$A4S_BIN" gate begin "$STATE")
      export A4S_GATE_HELPER A4S_GATE_JOURNAL
      # The helper shares one host-path slot with shell-launched full suites.
      # Exit 86 releases the slot while integration protection waits.
      export A4S_INTEGRATION_WAITER=$$
      exec "$A4S_BIN" heavy-slot --gate "$RUN" bash -euo pipefail -c "$(cat <<'GATE_BODY'
      admit_status=0
      "$A4S_BIN" protect admit --checkpoint gate || admit_status=$?
      if [[ "$admit_status" -eq 86 ]]; then exit 86; fi
      if [[ "$admit_status" -ne 0 ]]; then exit "$admit_status"; fi
      # Success is provisional until the pipeline and every post-check complete.
      gate_status=1
      trap 'status=$?; trap - EXIT; trap "" TERM INT HUP; if (( status == 0 )); then status=$gate_status; fi; "$A4S_BIN" gate finish "$status" || { test "$status" != 0 || status=1; }; exit "$status"' EXIT
      trap 'gate_status=143; exit "$gate_status"' TERM
      trap 'gate_status=130; exit "$gate_status"' INT
      trap 'gate_status=129; exit "$gate_status"' HUP
      "$A4S_BIN" gate start pre_checks
      cd "$WORKTREE"
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      sha=$(jq -r .sha "$STATE/candidate.json")
      test "$(git rev-parse HEAD)" = "$sha"
      test "$(git branch --show-current)" = "$BRANCH"
      test -z "$(git status --porcelain)"
      "$A4S_BIN" gate end pre_checks 0
      "$A4S_BIN" gate start command
      command_status=0
      env -u GH_TOKEN -u GITHUB_TOKEN NODE_OPTIONS="${NODE_OPTIONS:-} --require \"$A4S_GATE_HELPER\"" bash -euo pipefail -c "$GATE" 2>&1 | tee "$STATE/gate-output.log" || command_status=$?
      "$A4S_BIN" gate end command "$command_status"
      if (( command_status != 0 )); then
        "$A4S_BIN" escalation finding gate "$STATE/gate-output.log"
        exit "$command_status"
      fi
      "$A4S_BIN" gate start post_checks
      status=$(git status --porcelain)
      if [[ -n "$status" ]]; then
        printf 'gate: worktree %s has changes after GATE:\n' "$WORKTREE" >&2
        printf '%s\n' "$status" >&2
        git diff --stat >&2
        exit 1
      fi
      test "$(git rev-parse HEAD)" = "$sha"
      printf 'tested_sha=%s\n' "$sha" | tee -a "${DAGU_OUTPUT_FILE:-/dev/null}"
      git rev-parse HEAD > "$STATE/tested-sha"
      "$A4S_BIN" gate end post_checks 0
      gate_status=0
      GATE_BODY
      )"
    outputs:
      - name: tested_sha

  - id: recover_gate
    depends: gate
    continue_on: skipped
    preconditions:
      - condition: "${gate.exit_code}"
        expected: "re:^(|[^0].*|0.+)$"
    action: human.task
    with:
      prompt: "gate failed. The wait handler automatically pushes back with the observed run-wide iteration through implement_budget to repair the candidate in the same worktree; exhausted budgets wait at escalation for an owner decision."
      push_back:
        rewind_to: implement_budget
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}

  - id: recover_gate_cancellation
    depends: recover_gate
    continue_on: skipped
    preconditions:
      - condition: "${steps.recover_gate.outputs.CANCEL}"
        expected: "re:^(yes|no)$"
    env:
      - CANCEL: ${steps.recover_gate.outputs.CANCEL}
      - CHECKPOINT: recover_gate
    run: *cancellation_gate

  - id: validation
    depends: recover_gate_cancellation
    preconditions:
      - condition: "${steps.checkpoint_push.outputs.INTEGRATED}"
        expected: "re:^(|no)$"
      - condition: "${gate.exit_code}"
        expected: "0"
      - condition: "${steps.triage.outputs.POC}"
        expected: "no"
      - condition: '${VALIDATION}'
        expected: 're:.+'
    continue_on:
      skipped: true
    action: human.task
    with:
      prompt: |-
        Repository: ${PRIMARY}
        Run: ${RUN}; step: validation
        Tested SHA: ${steps.gate.outputs.tested_sha}
        Repository procedure:
        ${VALIDATION}
        Approve only this tested SHA after executing the procedure.
        To reject, push back validation with --expected-iteration from current
        dagu status and --input REASON='<operator reason>'; this rewinds to implement.
        Dagu records an operator-attributed decision, not authenticated identity.
      form:
        type: object
        additionalProperties: false
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}
          APPROVED:
            type: string
            enum: ['yes']
          TESTED_SHA:
            type: string
            pattern: '^[a-f0-9]{40}$'
      push_back:
        rewind_to: implement_budget
        form:
          type: object
          additionalProperties: false
          properties:
            REASON:
              type: string
              minLength: 1
          required: [REASON]

  - id: validation_cancellation
    depends: validation
    continue_on: skipped
    preconditions:
      - condition: "${steps.checkpoint_push.outputs.INTEGRATED}"
        expected: "re:^(|no)$"
      - condition: "${gate.exit_code}"
        expected: "0"
      - condition: "${steps.triage.outputs.POC}"
        expected: "no"
      - condition: '${VALIDATION}'
        expected: 're:.+'
    env:
      - CANCEL: ${steps.validation.outputs.CANCEL}
      - CHECKPOINT: validation
      - REQUIRED_FIELDS: APPROVED TESTED_SHA
      - APPROVED: ${steps.validation.outputs.APPROVED}
      - TESTED_SHA: ${steps.validation.outputs.TESTED_SHA}
    run: *cancellation_gate

  - id: push
    depends: validation_cancellation
    continue_on:
      failure: true
      mark_success: true
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "no"
      - condition: "${steps.checkpoint_push.outputs.INTEGRATED}"
        expected: "re:^(|no)$"
    env:
      - APPROVED: ${steps.validation.outputs.APPROVED}
      - TESTED_SHA: ${steps.validation.outputs.TESTED_SHA}
    run: |
      set -euo pipefail
      reject() { printf 'rule=push.%s expected=%q observed=%q\n' "$1" "$2" "$3" >&2; exit 1; }
      equal() { [[ "$2" == "$3" ]] || reject "$@"; }
      umask 0022
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      eval "$DAGU_RESOURCE_GUARD"
      resolve_run_pr
      integrated_terminal push
      export A4S_INTEGRATION_WAITER=$$
      while true; do
        integration_status=0
        "$A4S_BIN" protect admit --checkpoint push || integration_status=$?
        if [[ "$integration_status" -eq 0 ]]; then break; fi
        if [[ "$integration_status" -ne 86 ]]; then exit "$integration_status"; fi
        sleep "${A4S_INTEGRATION_POLL_SEC:-1}"
      done
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      test -s "$STATE/gate.json" || reject gated_candidate gate.json missing
      gated=$(jq -r .sha "$STATE/gate.json")
      candidate=$(git -C "$WORKTREE" rev-parse HEAD)
      equal gated_head "$gated" "$candidate"
      sha=$(jq -r .sha "$STATE/candidate.json")
      equal branch "$BRANCH" "$(git -C "$WORKTREE" branch --show-current)"
      equal candidate_head "$sha" "$(git -C "$WORKTREE" rev-parse HEAD)"
      equal clean "" "$(git -C "$WORKTREE" status --porcelain)"
      jq -e --arg sha "$sha" --arg gate "$GATE" '.sha == $sha and .gate == $gate and .result == "PASS"' "$STATE/gate.json" >/dev/null ||
        reject gate_binding "sha=$sha gate=$GATE result=PASS" "$(cat "$STATE/gate.json")"
      test -s "$STATE/tested-sha" || reject tested_sha "$sha" missing
      equal tested_sha "$sha" "$(cat "$STATE/tested-sha")"
      if [[ -n "${VALIDATION:-}" ]]; then
        equal validation_approval yes "$APPROVED"
        if [[ "$TESTED_SHA" != "$sha" ]]; then
          reject validation_sha "$sha" "$TESTED_SHA"
        fi
        jq -nc --arg sha "$sha" --arg procedure "$VALIDATION" \
          '{sha:$sha,procedure:$procedure,approved:"yes"}' > "$STATE/validation.json"
      fi
      remote_ref="refs/heads/$BRANCH"
      resolve_run_pr
      integrated_terminal push
      expected=$(git -C "$WORKTREE" ls-remote origin "$remote_ref" | cut -f1)
      if [[ "$RUN_PR" != null && "$expected" != "$sha" ]] &&
         jq -e '.autoMergeRequest != null' <<<"$RUN_PR" >/dev/null; then
        pr_number=$(jq -r .number <<<"$RUN_PR")
        repo=$(git -C "$PRIMARY" remote get-url origin)
        gh pr merge "$pr_number" --repo "$repo" --disable-auto
        resolve_run_pr
        integrated_terminal push
        jq -e '.state == "OPEN" and .autoMergeRequest == null' <<<"$RUN_PR" >/dev/null ||
          reject disarmed_pr "OPEN autoMergeRequest=null" "$RUN_PR"
      fi
      git -C "$WORKTREE" push "--force-with-lease=$remote_ref:$expected" --set-upstream origin "$sha:$remote_ref" ||
        reject remote_lease "$expected" "$(git -C "$WORKTREE" ls-remote origin "$remote_ref" | cut -f1)"
      printf '%s\n' "$sha" > "$STATE/published-sha"
      printf 'INTEGRATED=no\n' >> "${DAGU_OUTPUT_FILE:-/dev/null}"
    outputs:
      - name: INTEGRATED

  - id: recover_push
    depends: push
    continue_on: skipped
    preconditions:
      - condition: "${push.exit_code}"
        expected: "re:^[1-9][0-9]*$"
    action: human.task
    with:
      prompt: "push failed. Inspect its logs and restore remote access or permissions, then push back with the observed run-wide iteration to retry push in this run."
      push_back:
        rewind_to: push
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}

  - id: recover_push_cancellation
    depends: recover_push
    continue_on: skipped
    preconditions:
      - condition: "${steps.recover_push.outputs.CANCEL}"
        expected: "re:^(yes|no)$"
    env:
      - CANCEL: ${steps.recover_push.outputs.CANCEL}
      - CHECKPOINT: recover_push
    run: *cancellation_gate

  - id: pr
    depends: recover_push_cancellation
    preconditions:
      - condition: "${steps.triage.outputs.POC}"
        expected: "no"
      - condition: "${steps.checkpoint_push.outputs.INTEGRATED}"
        expected: "re:^(|no)$"
      - condition: "${steps.push.outputs.INTEGRATED}"
        expected: "re:^(|no)$"
    run: |
      set -euo pipefail
      reject() { printf 'rule=pr.%s expected=%q observed=%q\n' "$1" "$2" "$3" >&2; exit 1; }
      equal() { [[ "$2" == "$3" ]] || reject "$@"; }
      cd "$WORKTREE"
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      if [[ -z "$PR_NUMBER" && -f "$STATE/pr-number" ]]; then PR_NUMBER=$(cat "$STATE/pr-number"); fi
      sha=$(jq -r .sha "$STATE/candidate.json")
      equal branch "$BRANCH" "$(git branch --show-current)"
      equal candidate_head "$sha" "$(git rev-parse HEAD)"
      equal clean "" "$(git status --porcelain)"
      jq -e --arg sha "$sha" --arg gate "$GATE" '.sha == $sha and .gate == $gate' "$STATE/gate.json" >/dev/null ||
        reject gate_binding "sha=$sha gate=$GATE" "$(cat "$STATE/gate.json")"
      equal remote_head "$sha" "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
      "$A4S_BIN" pr-body render "$STATE" "$ISSUE" > "$STATE/pr-body.md"
      "$A4S_BIN" pr-body validate "$STATE/pr-body.md"
      if test -n "$PR_NUMBER"; then
        equal state OPEN "$(gh pr view "$PR_NUMBER" --json state --jq .state)"
        equal head_branch "$BRANCH" "$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
        equal head_sha "$sha" "$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
        gh pr edit "$PR_NUMBER" --body-file "$STATE/pr-body.md"
        gh pr view "$PR_NUMBER" --json number,url,headRefOid
      elif gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
        equal state OPEN "$(gh pr view "$BRANCH" --json state --jq .state)"
        equal head_branch "$BRANCH" "$(gh pr view "$BRANCH" --json headRefName --jq .headRefName)"
        equal head_sha "$sha" "$(gh pr view "$BRANCH" --json headRefOid --jq .headRefOid)"
        gh pr edit "$BRANCH" --body-file "$STATE/pr-body.md"
        gh pr view "$BRANCH" --json number,url,headRefOid
      else
        gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --fill --body-file "$STATE/pr-body.md"
      fi

  - id: code_scanning
    depends: pr
    run: |
      set -euo pipefail
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      sha=$(jq -r .sha "$STATE/candidate.json")
      case "${CODE_SCANNING:-required}" in
        off)
          # Adopted off policy records the candidate and does not call CodeQL.
          jq -n --arg sha "$sha" --arg security "${CODEQL_SECURITY_THRESHOLD:-}" --arg alerts "${CODEQL_ALERTS_THRESHOLD:-}" \
            '{sha:$sha,mode:"off",security:$security,alerts:$alerts}' >"$STATE/codeql-policy.json"
          ;;
        required)
          repo=$(gh repo view "$(git -C "$PRIMARY" remote get-url origin)" --json nameWithOwner --jq .nameWithOwner)
          pr=$(gh pr view "${PR_NUMBER:-$BRANCH}" -R "$repo" --json number --jq .number)
          jq -n --arg sha "$sha" --arg security "$CODEQL_SECURITY_THRESHOLD" --arg alerts "$CODEQL_ALERTS_THRESHOLD" \
            '{sha:$sha,mode:"required",security:$security,alerts:$alerts}' >"$STATE/codeql-policy.json"
          "$A4S_BIN" codeql "$repo" "$pr" "$sha" "$CODEQL_SECURITY_THRESHOLD" "$CODEQL_ALERTS_THRESHOLD" >"$STATE/codeql-observation.json"
          cat "$STATE/codeql-observation.json"
          ;;
        *) printf 'Invalid CODE_SCANNING policy: %s\n' "${CODE_SCANNING:-}" >&2; exit 1 ;;
      esac

  - id: pr_head_ready
    depends: code_scanning
    timeout_sec: 30
    retry_policy:
      limit: 12
      interval_sec: 5
      exit_code: [75]
    run: |
      set -euo pipefail
      reject() { printf 'rule=pr_head_ready.%s expected=%q observed=%q\n' "$1" "$2" "$3" >&2; exit 1; }
      equal() { [[ "$2" == "$3" ]] || reject "$@"; }
      cd "$WORKTREE"
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      sha=$(jq -r .sha "$STATE/candidate.json")
      if [[ "${CODE_SCANNING:-required}" != off ]] &&
         ! jq -e --arg sha "$sha" '.sha == $sha and .class == "PASS"' "$STATE/codeql-observation.json" >/dev/null; then exit 0; fi
      equal branch "$BRANCH" "$(git branch --show-current)"
      equal candidate_head "$sha" "$(git rev-parse HEAD)"
      equal clean "" "$(git status --porcelain)"
      jq -e --arg sha "$sha" --arg gate "$GATE" '.sha == $sha and .gate == $gate' "$STATE/gate.json" >/dev/null ||
        reject gate_binding "sha=$sha gate=$GATE" "$(cat "$STATE/gate.json")"
      pr_ref=${PR_NUMBER:-$BRANCH}
      if [[ -z "${PR_NUMBER:-}" && -f "$STATE/pr-number" ]]; then pr_ref=$(cat "$STATE/pr-number"); fi
      read_status=0
      observed_sha=$(gh pr view "$pr_ref" --json headRefOid --jq .headRefOid) || read_status=$?
      if [[ "$read_status" -ne 0 ]]; then
        reject read "successful GitHub head read" "gh exit=$read_status; check authentication, permissions and network"
      fi
      [[ "$observed_sha" =~ ^[0-9a-f]{40}$ ]] || reject head_format commit_oid "$observed_sha"
      if [[ "$observed_sha" != "$sha" ]]; then
        printf 'rule=pr_head_ready.head_convergence expected=%s observed=%s\n' "$sha" "$observed_sha" >&2
        exit 75
      fi

  - id: auto_merge
    depends: pr_head_ready
    run: |
      set -euo pipefail
      reject() { printf 'rule=auto_merge.%s expected=%q observed=%q\n' "$1" "$2" "$3" >&2; exit 1; }
      equal() { [[ "$2" == "$3" ]] || reject "$@"; }
      export A4S_INTEGRATION_WAITER=$$
      while true; do
        integration_status=0
        "$A4S_BIN" protect admit --checkpoint auto_merge || integration_status=$?
        if [[ "$integration_status" -eq 0 ]]; then break; fi
        if [[ "$integration_status" -ne 86 ]]; then exit "$integration_status"; fi
        sleep "${A4S_INTEGRATION_POLL_SEC:-1}"
      done
      cd "$WORKTREE"
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      sha=$(jq -r .sha "$STATE/candidate.json")
      # Pending required analysis releases the queue. The reconciler enables merge
      # after current-head CodeQL and required checks pass. Off does not wait for
      # CodeQL: GitHub merge state follows REQUIRED_CHECK, still bound to this SHA.
      if [[ "${CODE_SCANNING:-required}" != off ]] &&
         ! jq -e --arg sha "$sha" '.sha == $sha and .class == "PASS"' "$STATE/codeql-observation.json" >/dev/null; then exit 0; fi
      equal branch "$BRANCH" "$(git branch --show-current)"
      equal candidate_head "$sha" "$(git rev-parse HEAD)"
      equal clean "" "$(git status --porcelain)"
      jq -e --arg sha "$sha" --arg gate "$GATE" '.sha == $sha and .gate == $gate' "$STATE/gate.json" >/dev/null ||
        reject gate_binding "sha=$sha gate=$GATE" "$(cat "$STATE/gate.json")"
      pr_ref=${PR_NUMBER:-$BRANCH}
      if [[ -z "${PR_NUMBER:-}" && -f "$STATE/pr-number" ]]; then pr_ref=$(cat "$STATE/pr-number"); fi
      observation=$(gh pr view "$pr_ref" --json state,mergeStateStatus,autoMergeRequest,mergeCommit,headRefOid)
      equal head_sha "$sha" "$(jq -r '.headRefOid' <<< "$observation")"
      merge_body=$(printf 'Closes #%s\n\n%s' "$ISSUE" "$(git log -1 --format=%b "$sha")")
      if test "$(jq -r '.state' <<< "$observation")" = MERGED; then
        jq -e '.mergeCommit.oid | type == "string" and length > 0' <<< "$observation" >/dev/null ||
          reject merge_commit nonempty_oid "$observation"
      elif test "$(jq -r '.state' <<< "$observation")" != OPEN; then
        reject state OPEN_or_MERGED "$(jq -r '.state' <<< "$observation")"
      else
        if jq -e '.autoMergeRequest != null' <<< "$observation" >/dev/null; then
          gh pr merge "$pr_ref" --disable-auto
        fi
        case "$(jq -r '.mergeStateStatus' <<< "$observation")" in
          CLEAN) gh pr merge "$pr_ref" --squash --match-head-commit "$sha" --body "$merge_body" ;;
          BEHIND|BLOCKED|UNSTABLE|DIRTY|UNKNOWN)
            gh pr merge "$pr_ref" --auto --squash --match-head-commit "$sha" --body "$merge_body" ;;
          *) reject merge_state CLEAN_BEHIND_BLOCKED_UNSTABLE_DIRTY_UNKNOWN "$(jq -r '.mergeStateStatus' <<< "$observation")" ;;
        esac
      fi
      pr_number=$(gh pr view "$pr_ref" --json number --jq .number)
      printf 'pr=%s\nhead_sha=%s\n' "$pr_number" "$sha"

  - id: await_ci
    depends: auto_merge
    action: human.task
    with:
      prompt: "The scheduled reconciler owns this CI checkpoint. Candidate CI failures or CodeQL findings at the adopted threshold return this same run to implement; SHA, check, findings and log excerpt are in <git-dir>/dagu-feature/runs/${RUN}/ci-return.json and the coordinator notice."
      push_back:
        rewind_to: implement_budget
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}

  - id: await_ci_cancellation
    depends: await_ci
    signal_on_stop: SIGINT
    env:
      - CANCEL: ${steps.await_ci.outputs.CANCEL}
      - CHECKPOINT: await_ci
      - NATIVE_TERMINAL: aborted
    run: *cancellation_gate

  - id: await_merge
    depends: auto_merge
    action: human.task
    with:
      prompt: "The scheduled reconciler owns this merge checkpoint: BEHIND or DIRTY returns to rebase with the observed iteration. Both CI and merge checkpoints complete only after MERGED with successful checks for the published SHA."
      push_back:
        rewind_to: rebase_budget
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}

  - id: await_merge_cancellation
    depends: await_merge
    signal_on_stop: SIGINT
    env:
      - CANCEL: ${steps.await_merge.outputs.CANCEL}
      - CHECKPOINT: await_merge
      - NATIVE_TERMINAL: aborted
    run: *cancellation_gate

  - id: authorize_ci
    depends: [await_ci_cancellation, await_merge_cancellation]
    run: |
      set -euo pipefail
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      repo=$(gh repo view "$(git -C "$PRIMARY" remote get-url origin)" --json nameWithOwner --jq .nameWithOwner)
      sha=$(git -C "$WORKTREE" rev-parse HEAD)
      pr_ref=${PR_NUMBER:-$BRANCH}
      current=$(gh pr view "$pr_ref" -R "$repo" --json headRefOid --jq .headRefOid)
      [[ "$current" == "$sha" ]] || { echo "STALE_SHA published=$sha current=$current" >&2; exit 1; }
      # complete is not iteration-atomic. Authorize only the candidate's own CI,
      # never the result that caused an earlier asynchronous completion.
      required=$(gh pr checks "$pr_ref" -R "$repo" --required --json name,state)
      jq -e 'length > 0 and all(.[]; .state == "SUCCESS" or .state == "NEUTRAL" or .state == "SKIPPED")' <<<"$required"
      checks=$(gh api --paginate --slurp "repos/$repo/commits/$sha/check-runs")
      statuses=$(gh api "repos/$repo/commits/$sha/status")
      jq -en --arg sha "$sha" --argjson required "$required" --argjson checks "$checks" --argjson statuses "$statuses" '
        [($checks[] .check_runs[] | {name, sha:.head_sha, id, state:(if .status == "completed" then .conclusion | ascii_upcase else "PENDING" end)}),
         ($statuses.statuses[] | {name:.context, sha:$statuses.sha, id, state:(.state | ascii_upcase)})] as $all
        | all($required[]; .name as $name |
            ([$all[] | select(.name == $name and .sha == $sha)] | sort_by(.id) | last) as $check |
            $check != null and ($check.state == "SUCCESS" or $check.state == "NEUTRAL" or $check.state == "SKIPPED"))
      ' || { echo "STALE_SHA or unsuccessful required checks for $sha" >&2; exit 1; }
      policy="$STATE/codeql-policy.json"
      test "$(jq -r .sha "$policy")" = "$sha"
      if [[ "$(jq -r '.mode // "required"' "$policy")" != off ]]; then
        codeql=$("$A4S_BIN" codeql "$repo" "$(gh pr view "$pr_ref" -R "$repo" --json number --jq .number)" "$sha" "$(jq -r .security "$policy")" "$(jq -r .alerts "$policy")")
        jq -e '.class == "PASS"' <<<"$codeql"
      fi
      [[ "$(gh pr view "$pr_ref" -R "$repo" --json headRefOid --jq .headRefOid)" == "$sha" ]] ||
        { echo "STALE_SHA during CI authorization" >&2; exit 1; }
      printf 'authorized_sha=%s\n' "$sha"

  - id: detect_close_primary
    depends: authorize_ci
    run: |
      set -euo pipefail
      branch=$(git -C "$PRIMARY" branch --show-current)
      status=$(git -C "$PRIMARY" status --porcelain)
      if [[ "$branch" != "$BASE_BRANCH" ]]; then
        reason="primary on ${branch:-detached HEAD}, expected $BASE_BRANCH"
      elif [[ -n "$status" ]]; then
        reason="primary dirty: ${status//$'\n'/; }"
      else
        reason=ready
      fi
      printf 'close_gate: %s\n' "$reason" >&2
      printf 'reason=%s\n' "$reason" >> "$DAGU_OUTPUT_FILE"
    outputs:
      - name: reason

  - id: close_primary_unavailable
    depends: detect_close_primary
    continue_on: skipped
    preconditions:
      - condition: "${steps.detect_close_primary.outputs.reason}"
        expected: "re:^primary "
    action: human.task
    with:
      prompt: "close_gate: ${steps.detect_close_primary.outputs.reason}. Restore ${PRIMARY} to clean ${BASE_BRANCH}, preserving the operator's changes; then push back this checkpoint with the observed iteration to recheck in the same run. close_gate removes the worktree."
      push_back:
        rewind_to: detect_close_primary
      form:
        type: object
        properties:
          CANCEL: {type: string, enum: ['yes', 'no']}

  - id: close_primary_unavailable_cancellation
    depends: close_primary_unavailable
    continue_on: skipped
    preconditions:
      - condition: "${steps.detect_close_primary.outputs.reason}"
        expected: "re:^primary "
    env:
      - CANCEL: ${steps.close_primary_unavailable.outputs.CANCEL}
      - CHECKPOINT: close_primary_unavailable
    run: *cancellation_gate

  - id: close_gate
    depends: [await_merge_cancellation, close_primary_unavailable_cancellation]
    env:
      - CLEANUP_CLOSE: "true"
    run: &feature_cleanup |
      set -euo pipefail
      if jq -e 'has("GATE") or has("REBASE_RESOLVER") or has("REQUIRED_CHECK") or has("PRIMARY") or has("A4S_PRIMARY") or has("BRANCH")' <<<"${DAGU_PARAMS_JSON:-"{}"}" >/dev/null; then exit 0; fi
      umask 0022
      MODE=${CLEANUP_CLOSE:-false}
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      [[ "$RUN" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 1
      mkdir -p "$STATE"
      phase=identify
      diagnostic() {
        cleanup_diagnosed=true
        printf 'cleanup: run=%s phase=%s preserved: %s; branch %s; worktree %s; evidence=%s\n' \
          "$RUN" "$phase" "$*" "$BRANCH" "$WORKTREE" "$STATE" >&2
        printf 'run=%s phase=%s preserved: %s; branch=%s; worktree=%s; evidence=%s\n' \
          "$RUN" "$phase" "$*" "$BRANCH" "$WORKTREE" "$STATE" > "$STATE/cleanup-diagnostic"
        printf 'Recovery: preserve branch %s and worktree %s; inspect %s before a suffixed run ID.\n' "$BRANCH" "$WORKTREE" "$STATE" >&2
        [[ "${CLEANUP_CLOSE:-false}" != true ]] || exit 1
        exit 0
      }
      eval "$DAGU_RESOURCE_GUARD"
      resource_lock cleanup
      TERMINAL_INTEGRATED=false
      if [[ -f "$STATE/integrated.json" ]]; then
        jq -e --arg run "$RUN" --arg branch "$BRANCH" --arg base "$BASE_BRANCH" \
          '.run == $run and .headRefName == $branch and .baseRefName == $base and .state == "MERGED"' \
          "$STATE/integrated.json" >/dev/null
        TERMINAL_INTEGRATED=true
      fi
      if [[ -z "${PR_NUMBER:-}" && -f "$STATE/pr-number" ]]; then PR_NUMBER=$(cat "$STATE/pr-number"); fi
      [[ "$MODE" != true ]] || printf 'true\n' > "$STATE/cleanup-close"
      [[ ! -f "$STATE/cleanup-close" ]] || MODE=true
      if [[ "$MODE" == true ]]; then
        "$A4S_BIN" protect release-auto --reason close_gate
      else
        "$A4S_BIN" protect release-auto --reason terminal
      fi
      [[ -f "$STATE/cleanup-phase" ]] || printf 'identify\n' > "$STATE/cleanup-phase"
      record() { phase=$1; printf '%s\n' "$phase" > "$STATE/cleanup-phase"; }
      primary=$(cd "$PRIMARY" && pwd -P) || diagnostic "PRIMARY unavailable"
      [[ "$(git -C "$PRIMARY" rev-parse --absolute-git-dir)" == "$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-common-dir)" ]] ||
        diagnostic "PRIMARY is not the main worktree"
      if [[ ! -f "$STATE/resource.json" ]]; then
        diagnostic "resource registration missing"
      fi
      OWNER=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/resources/$(printf '%s' "$BRANCH" | git hash-object --stdin).json")
      owned() {
        jq -e --arg run "$RUN" --arg primary "$primary" --arg branch "$BRANCH" --arg worktree "$worktree_real" \
          '.run == $run and .primary == $primary and .branch == $branch and .worktree == $worktree' "$STATE/resource.json" >/dev/null &&
        [[ -f "$OWNER" ]] && cmp -s "$STATE/resource.json" "$OWNER"
      }
      worktree_real=$(jq -er .worktree "$STATE/resource.json") || diagnostic "invalid resource registration"
      owned || diagnostic "resource owner or identity changed"
      if [[ -e "$WORKTREE" ]]; then
        [[ "$(cd "$WORKTREE" && pwd -P)" == "$worktree_real" ]] || diagnostic "canonical worktree changed"
      fi
      head=$(git -C "$PRIMARY" rev-parse --verify "refs/heads/$BRANCH" 2>/dev/null || true)
      if [[ -f "$STATE/cleanup-head" ]]; then
        candidate=$(cat "$STATE/cleanup-head")
        if [[ -n "$head" && "$head" != "$candidate" ]]; then
          # A retry may capture or rebase a new candidate while the owned worktree
          # is retained. Never reuse that earlier candidate's cleanup progress.
          [[ -e "$worktree_real" &&
             "$(git -C "$worktree_real" branch --show-current)" == "$BRANCH" &&
             "$(git -C "$worktree_real" rev-parse HEAD)" == "$head" ]] ||
            diagnostic "branch SHA changed: $head expected $candidate"
          rm -f "$STATE/cleanup-proof.json" "$STATE/cleanup-close" "$STATE/cleanup-diagnostic"
          record identify
          MODE=${CLEANUP_CLOSE:-false}
          [[ "$MODE" != true ]] || printf 'true\n' > "$STATE/cleanup-close"
          candidate=$head
          printf '%s\n' "$candidate" > "$STATE/cleanup-head"
        fi
      elif [[ -n "$head" ]]; then
        candidate=$head
        printf '%s\n' "$candidate" > "$STATE/cleanup-head"
      else
        diagnostic "candidate SHA unavailable"
      fi
      [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || diagnostic "invalid candidate SHA"
      if [[ "${CLEANUP_CLOSE:-false}" != true ]] &&
         ! jq -e --arg candidate "$candidate" '.sha == $candidate' "$STATE/candidate.json" >/dev/null 2>&1; then
        rm -f "$STATE/cleanup-proof.json"
        record identify
        diagnostic "no captured candidate for branch HEAD $candidate; files retained"
      fi
      repo=$(git -C "$PRIMARY" remote get-url origin) || diagnostic "origin lookup failed"
      lifecycle_fetch "$PRIMARY" --prune origin || diagnostic "remote base refresh failed"
      base_sha=$(git -C "$PRIMARY" rev-parse --verify "origin/$BASE_BRANCH^{commit}") || diagnostic "remote base unavailable"
      proof=ancestor
      squash_sha=
      pr=
      if [[ "$MODE" == true ]] || ! git -C "$PRIMARY" merge-base --is-ancestor "$candidate" "$base_sha"; then
        pr=$(gh pr view "${PR_NUMBER:-$BRANCH}" --repo "$repo" --json number,state,headRefOid,mergeCommit) ||
          diagnostic "PR integration query failed"
        [[ "$(jq -r '.state // empty' <<<"$pr")" == MERGED ]] || diagnostic "PR is not MERGED; publication alone is not integration"
        [[ "$(jq -r '.headRefOid // empty' <<<"$pr")" == "$candidate" ]] || diagnostic "PR head SHA differs from candidate $candidate"
        tested=$(cat "$STATE/tested-sha" 2>/dev/null || true)
        [[ "$tested" == "$candidate" ]] || diagnostic "tested candidate SHA differs: $tested expected $candidate"
        if ! git -C "$PRIMARY" merge-base --is-ancestor "$candidate" "$base_sha"; then
          squash_sha=$(jq -r '.mergeCommit.oid // empty' <<<"$pr")
          [[ "$squash_sha" =~ ^[0-9a-f]{40}$ ]] &&
            git -C "$PRIMARY" merge-base --is-ancestor "$squash_sha" "$base_sha" ||
            diagnostic "squash SHA is not confirmed in refreshed base: $squash_sha"
          proof=squash
        fi
      fi
      jq -n --arg candidate "$candidate" --arg base "$base_sha" --arg squash "$squash_sha" --arg proof "$proof" \
        '{candidate:$candidate,base:$base,squash:$squash,proof:$proof}' > "$STATE/cleanup-proof.json"
      record integrated
      if [[ "$MODE" == true ]]; then
        pr_number=$(jq -er .number <<<"$pr") || diagnostic "PR number unavailable"
        check_state=$(gh pr checks "$pr_number" --repo "$repo" --required --json name,state \
          --jq 'map(select(.name == env.REQUIRED_CHECK)) | if length == 0 then "MISSING" else .[0].state end') ||
          diagnostic "required check $REQUIRED_CHECK lookup failed"
        [[ "$check_state" == SUCCESS ]] || diagnostic "required check $REQUIRED_CHECK state=$check_state, expected SUCCESS"
      fi
      if [[ "$MODE" == true || "$TERMINAL_INTEGRATED" == true ]]; then
        primary_branch=$(git -C "$PRIMARY" branch --show-current)
        [[ "$primary_branch" == "$BASE_BRANCH" ]] ||
          diagnostic "close_gate: PRIMARY $PRIMARY on branch $primary_branch, expected $BASE_BRANCH"
        primary_status=$(git -C "$PRIMARY" status --porcelain)
        [[ -z "$primary_status" ]] ||
          diagnostic "close_gate: PRIMARY $PRIMARY has local changes, expected clean: $primary_status"
        remote_head=$(git -C "$PRIMARY" ls-remote --heads origin "refs/heads/$BRANCH") || diagnostic "remote branch query failed"
        [[ -z "$remote_head" || "$remote_head" == "$candidate"$'\t'"refs/heads/$BRANCH" ]] ||
          diagnostic "remote branch SHA changed: $remote_head"
        git -C "$PRIMARY" merge --ff-only "origin/$BASE_BRANCH" || diagnostic "PRIMARY ff-only failed"
      fi
      owned || diagnostic "resource owner changed before worktree removal"
      if [[ -e "$worktree_real" ]]; then
        [[ "$(git -C "$worktree_real" rev-parse --show-toplevel)" == "$worktree_real" &&
           "$(git -C "$worktree_real" branch --show-current)" == "$BRANCH" &&
           "$(git -C "$worktree_real" rev-parse HEAD)" == "$candidate" ]] ||
          diagnostic "worktree identity or SHA changed"
        [[ -z "$(git -C "$worktree_real" status --porcelain --untracked-files=all)" ]] ||
          diagnostic "dirty worktree; files retained"
        record removing-worktree
        git -C "$PRIMARY" worktree remove "$worktree_real" || diagnostic "safe worktree removal failed"
      fi
      worktree_list=$(git -C "$PRIMARY" worktree list --porcelain)
      if [[ -e "$worktree_real" ]] || grep -Fqx "worktree $worktree_real" <<<"$worktree_list"; then
        diagnostic "close_gate: worktree $worktree_real remains, expected removed"
      fi
      record worktree-removed
      owned || diagnostic "resource owner changed before branch removal"
      head=$(git -C "$PRIMARY" rev-parse --verify "refs/heads/$BRANCH" 2>/dev/null || true)
      if [[ -n "$head" ]]; then
        [[ "$head" == "$candidate" ]] || diagnostic "branch SHA changed: $head expected $candidate"
        worktree_list=$(git -C "$PRIMARY" worktree list --porcelain)
        if grep -Fqx "branch refs/heads/$BRANCH" <<<"$worktree_list"; then
          diagnostic "branch is now checked out by another worktree"
        fi
        # Delete only the ref whose value was checked, including squash candidates.
        git -C "$PRIMARY" update-ref -d "refs/heads/$BRANCH" "$candidate" || diagnostic "local branch removal failed"
      fi
      if git -C "$PRIMARY" show-ref --verify --quiet "refs/heads/$BRANCH"; then
        diagnostic "close_gate: local branch $BRANCH remains, expected removed"
      fi
      record branch-removed
      remote=absent
      if [[ "$MODE" == true || "$TERMINAL_INTEGRATED" == true ]]; then
        owned || diagnostic "resource owner changed before remote removal"
        remote_head=$(git -C "$PRIMARY" ls-remote --heads origin "refs/heads/$BRANCH") || diagnostic "remote branch query failed"
        if [[ -n "$remote_head" ]]; then
          [[ "$remote_head" == "$candidate"$'\t'"refs/heads/$BRANCH" ]] || diagnostic "remote branch SHA changed: $remote_head"
          git -C "$PRIMARY" push --force-with-lease="refs/heads/$BRANCH:$candidate" origin ":refs/heads/$BRANCH" ||
            diagnostic "remote branch deletion failed"
          remote=deleted
        fi
        remote_head=$(git -C "$PRIMARY" ls-remote --heads origin "refs/heads/$BRANCH") || diagnostic "final remote branch query failed"
        [[ -z "$remote_head" ]] ||
          diagnostic "close_gate: remote branch $BRANCH remains, expected removed"
        lifecycle_fetch "$PRIMARY" --prune origin || diagnostic "final remote refresh failed"
        [[ "$(git -C "$PRIMARY" branch --show-current)" == "$BASE_BRANCH" &&
           -z "$(git -C "$PRIMARY" status --porcelain)" &&
           "$(git -C "$PRIMARY" rev-parse HEAD)" == "$(git -C "$PRIMARY" rev-parse "origin/$BASE_BRANCH")" ]] ||
          diagnostic "PRIMARY must be clean on refreshed base"
      fi
      if [[ "$MODE" == true || "$TERMINAL_INTEGRATED" == true ]]; then
        owned || diagnostic "resource owner changed before checkpoint removal"
        checkpoint="refs/dagu/checkpoints/issue-$ISSUE"
        checkpoint_sha=$(git -C "$PRIMARY" ls-remote origin "$checkpoint" | cut -f1) ||
          diagnostic "checkpoint $checkpoint lookup failed"
        if test -n "$checkpoint_sha"; then
          expected_checkpoint=$(cat "$STATE/checkpoint-sha" 2>/dev/null || true)
          [[ -n "$expected_checkpoint" && "$checkpoint_sha" == "$expected_checkpoint" ]] ||
            diagnostic "checkpoint SHA changed: $checkpoint_sha expected $expected_checkpoint"
          git -C "$PRIMARY" push "--force-with-lease=$checkpoint:$expected_checkpoint" origin ":$checkpoint" ||
            diagnostic "checkpoint $checkpoint deletion failed"
        fi
      fi
      record complete
      rm -f "$STATE/cleanup-diagnostic"
      printf 'tested_sha=%s\nbase_sha=%s\ncleanup worktree=%s branch=%s remote=%s proof=%s run=%s\n' \
        "$candidate" "$base_sha" "$WORKTREE" "$BRANCH" "$remote" "$proof" "$RUN"

handler_on:
  wait:
    run: |
      set -euo pipefail
      printf 'waiting_steps=%s issue=%s branch=%s worktree=%s\n' "$DAG_WAITING_STEPS" "$ISSUE" "$BRANCH" "$WORKTREE"
      for SPEC in \
        "dependency_review dependency-action dependency-transition.log" \
        "conflict_review conflict-action conflict-transition.log" \
        "recover_gate - gate-transition.log" \
        "recover_poc_scope - scope-transition.log"; do
        read -r STEP ACTION LOG <<<"$SPEC"
        if [[ ",$DAG_WAITING_STEPS," == *,"$STEP",* ]]; then
          STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
          # Dagu persists Waiting only after onWait exits; dispatch after that boundary.
          nohup bash -c '
            set -euo pipefail
            STATE=$1 RUN=$2 STEP=$3 ACTION=$4
            for attempt in $(seq 1 60); do
              STATUS=$(dagu status feature --run-id "$RUN")
              if grep -q "^Waiting -" <<<"$STATUS"; then
                ITERATION=$(sed -nE "s/.*push-back iteration: ([0-9]+).*/\1/p" <<<"$STATUS" | head -1)
                transition=0
                if [[ "$STEP" == recover_gate || "$STEP" == recover_poc_scope ]] || [[ "$(cat "$STATE/$ACTION")" == rewind ]]; then
                  dagu human-task push-back feature --run-id "$RUN" --step "$STEP" --expected-iteration "${ITERATION:-0}" || transition=$?
                else
                  dagu human-task complete feature --run-id "$RUN" --step "$STEP" || transition=$?
                fi
                if (( transition != 0 )); then
                  STATUS=$(dagu status feature --run-id "$RUN")
                  if grep -q "^Failed -" <<<"$STATUS" &&
                     ATTEMPT=$(curl -fsS --max-time 10 --get "http://127.0.0.1:${DAGU_PORT:-8080}/api/v1/event-logs" --data-urlencode "dagName=feature" --data-urlencode "dagRunId=$RUN" --data-urlencode "paginationMode=cursor" --data-urlencode "limit=1" | jq -er ".entries[0] | select(.type == \"dag.run.failed\" and .data.dag_run_status.error == \"process terminated unexpectedly - stale local process detected\") | .attemptId"); then
                    case "$STEP" in
                      dependency_review) RETRY=checkpoint_push ;;
                      conflict_review) RETRY=rebase ;;
                      recover_gate) RETRY=gate ;;
                      recover_poc_scope) RETRY=poc_scope_prepare ;;
                    esac
                    printf "stale-process repair: run=%s attempt=%s step=%s; recover: dagu retry --run-id %s --step %s --downstream feature\n" "$RUN" "${ATTEMPT:-unknown}" "$STEP" "$RUN" "$RETRY" >&2
                  fi
                  exit "$transition"
                fi
                exit 0
              fi
              sleep 1
            done
            printf "%s transition did not reach Waiting; inspect this checkpoint.\n" "$STEP" >&2
            exit 1
          ' _ "$STATE" "$RUN" "$STEP" "$ACTION" </dev/null > "$STATE/$LOG" 2>&1 &
        fi
      done
  exit:
    run: *feature_cleanup
