type: graph
dotenv: []
shell: bash
max_active_steps: 1
params:
  - name: PRIMARY
    type: string
    required: true
  - name: SKILL_DIR
    type: string
    required: true
steps:
  - id: detect
    run: |
      set -euo pipefail
      for tool in git gh jq dagu; do command -v "$tool" >/dev/null; done
      gh auth status >/dev/null
      test -f "$SKILL_DIR/feature.yaml"
      test -f "$SKILL_DIR/poc.yaml"
      test -f "$SKILL_DIR/discovery.yaml"
      test -f "$SKILL_DIR/planning.yaml"
      test -f "$SKILL_DIR/reconcile.yaml"
      package_dir=$(cd "$SKILL_DIR/../.." && pwd -P)
      package_json="$package_dir/package.json"
      test -f "$package_json"
      bundle_name=$(jq -er '.name | select(type == "string" and length > 0)' "$package_json")
      bundle_version=$(jq -er '.version | select(type == "string" and length > 0)' "$package_json")
      required_dagu=$(jq -er '.daguFeature.dagu | select(type == "string" and length > 0)' "$package_json")
      source_root=$(git -C "$SKILL_DIR" rev-parse --show-toplevel)
      package_prefix=$(git -C "$package_dir" rev-parse --show-prefix)
      test -z "$(git -C "$source_root" status --porcelain --untracked-files=all -- "${package_prefix%/}")"
      source_sha=$(git -C "$source_root" rev-parse HEAD)
      test "${#source_sha}" = 40
      git -C "$source_root" fetch origin
      git -C "$source_root" remote set-head origin -a >/dev/null
      source_default=$(git -C "$source_root" symbolic-ref --quiet refs/remotes/origin/HEAD)
      git -C "$source_root" merge-base --is-ancestor "$source_sha" "$source_default"
      source_url=$(git -C "$source_root" remote get-url origin)
      source_path=${source_url#git@*:}
      source_path=${source_path#http://*/}
      source_path=${source_path#https://*/}
      source_path=${source_path#ssh://*/}
      source_path=${source_path#file://}
      source_path=${source_path%.git}
      source_path=${source_path%/}
      source_repo=${source_path##*/}
      source_owner_path=${source_path%/*}
      source_owner=${source_owner_path##*/}
      test -n "$source_owner" && test -n "$source_repo"
      source_nwo="$source_owner/$source_repo"
      version_tmp=$(mktemp -d)
      trap 'rm -rf "$version_tmp"' EXIT
      if ! dagu version >"$version_tmp/stdout" 2>"$version_tmp/stderr"; then
        cat "$version_tmp/stderr" >&2
        exit 1
      fi
      printf '%s\n' "$required_dagu" >"$version_tmp/expected"
      cmp "$version_tmp/expected" "$version_tmp/stdout"
      test ! -s "$version_tmp/stderr"
      test "$(git -C "$PRIMARY" rev-parse --show-toplevel)" = "$PRIMARY"
      test "$(git -C "$PRIMARY" rev-parse --absolute-git-dir)" = "$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-common-dir)"
      cd "$PRIMARY"
      repo=$(gh repo view --json name --jq .name)
      nwo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
      base=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
      if ! required=$(gh api "repos/$nwo/branches/$base/protection/required_status_checks" --jq '.contexts | join(",")' 2>/dev/null); then
        required=""
      fi
      last_pr=$(gh pr list --state merged --limit 1 --json number --jq '.[0].number // empty')
      checks=""
      if test -n "$last_pr"; then
        checks=$(gh pr checks "$last_pr" --json name --jq '[.[].name] | unique | join(",")' 2>/dev/null || true)
      fi
      read_default() {
        local file=$1 wanted=$2 raw
        raw=$(awk -v wanted="$wanted" '
          index($0, "  - " wanted ": ") == 1 { sub("^  - " wanted ": ", ""); print; exit }
          $0 == "    " wanted ":" { found=1; next }
          found && /^      default: / { sub(/^      default: /, ""); print; exit }
          $0 == "  - name: " wanted { found=1; next }
          found && /^    default: / { sub(/^    default: /, ""); print; exit }
          found && /^  - name: / { exit }
        ' "$file")
        test -n "$raw" || return 0
        jq -nr --arg raw "$raw" 'try ($raw | fromjson) catch $raw'
      }
      read_stamp() {
        local file=$1 line
        test -f "$file" || { printf 'unstamped\n'; return; }
        IFS= read -r line <"$file" || true
        case "$line" in
          '# dagu-feature-bundle: '*) printf '%s\n' "${line#\# dagu-feature-bundle: }" ;;
          *) printf 'unstamped\n' ;;
        esac
      }
      installed_feature="$PRIMARY/.workspace/dagu/dags/feature.yaml"
      installed_poc="$PRIMARY/.workspace/dagu/dags/poc.yaml"
      installed_discovery="$PRIMARY/.workspace/dagu/dags/discovery.yaml"
      installed_planning="$PRIMARY/.workspace/dagu/dags/planning.yaml"
      current_gate=not-configured
      current_check=not-configured
      current_tests=not-configured
      current_resolver=""
      current_validation=""
      current_blocker_reporting=ask
      if test -f "$installed_feature"; then
        current_gate=$(read_default "$installed_feature" GATE)
        current_check=$(read_default "$installed_feature" REQUIRED_CHECK)
        current_resolver=$(read_default "$installed_feature" REBASE_RESOLVER)
        current_validation=$(read_default "$installed_feature" VALIDATION)
        current_blocker_reporting=$(read_default "$installed_feature" A4S_BLOCKER_REPORTING)
        current_blocker_reporting=${current_blocker_reporting:-ask}
      fi
      if test -f "$installed_poc"; then
        current_tests=$(read_default "$installed_poc" TEST_PATHS)
        if test -z "$current_tests"; then
          test_line=$(awk '/\[\[ "\$path" == \*\.md \|\| "\$path" =~ / { print; exit }' "$installed_poc")
          current_tests=${test_line#* =~ }
          current_tests=${current_tests% ]]; then}
        fi
      fi
      {
        printf 'REPO=%s\n' "$repo"
        printf 'NWO=%s\n' "$nwo"
        printf 'BASE_BRANCH=%s\n' "$base"
        printf 'REQUIRED_NOW=%s\n' "${required:-none}"
        printf 'RECENT_CHECKS=%s\n' "${checks:-none}"
        printf 'STAGE=%s\n' "$(git rev-parse --path-format=absolute --git-path dagu-feature/feature.yaml)"
        printf 'BUNDLE_NAME=%s\n' "$bundle_name"
        printf 'BUNDLE_VERSION=%s\n' "$bundle_version"
        printf 'REQUIRED_DAGU=%s\n' "$required_dagu"
        printf 'DAGU_VERSION=%s\n' "$required_dagu"
        printf 'SOURCE_NWO=%s\n' "$source_nwo"
        printf 'SOURCE_SHA=%s\n' "$source_sha"
        printf 'CURRENT_GATE=%s\n' "${current_gate:-not-configured}"
        printf 'CURRENT_REQUIRED_CHECK=%s\n' "${current_check:-not-configured}"
        printf 'CURRENT_TEST_PATHS=%s\n' "${current_tests:-not-configured}"
        printf 'CURRENT_REBASE_RESOLVER=%s\n' "$current_resolver"
        printf 'CURRENT_VALIDATION=%s\n' "$(jq -nc --arg value "$current_validation" '$value')"
        printf 'CURRENT_A4S_BLOCKER_REPORTING=%s\n' "$current_blocker_reporting"
        printf 'CURRENT_FEATURE_STAMP=%s\n' "$(read_stamp "$installed_feature")"
        printf 'CURRENT_POC_STAMP=%s\n' "$(read_stamp "$installed_poc")"
        printf 'CURRENT_DISCOVERY_STAMP=%s\n' "$(read_stamp "$installed_discovery")"
        printf 'CURRENT_PLANNING_STAMP=%s\n' "$(read_stamp "$installed_planning")"
      } >> "$DAGU_OUTPUT_FILE"
    outputs:
      - name: REPO
      - name: NWO
      - name: BASE_BRANCH
      - name: REQUIRED_NOW
      - name: RECENT_CHECKS
      - name: STAGE
      - name: BUNDLE_NAME
      - name: BUNDLE_VERSION
      - name: REQUIRED_DAGU
      - name: DAGU_VERSION
      - name: SOURCE_NWO
      - name: SOURCE_SHA
      - name: CURRENT_GATE
      - name: CURRENT_REQUIRED_CHECK
      - name: CURRENT_TEST_PATHS
      - name: CURRENT_REBASE_RESOLVER
      - name: CURRENT_VALIDATION
      - name: CURRENT_A4S_BLOCKER_REPORTING
      - name: CURRENT_FEATURE_STAMP
      - name: CURRENT_POC_STAMP
      - name: CURRENT_DISCOVERY_STAMP
      - name: CURRENT_PLANNING_STAMP

  - id: answers
    depends: detect
    action: human.task
    with:
      prompt: >-
        Configure the dagu-feature lifecycle for ${steps.detect.outputs.NWO}
        (default branch ${steps.detect.outputs.BASE_BRANCH}).
        Current feature stamp: ${steps.detect.outputs.CURRENT_FEATURE_STAMP}.
        Current poc stamp: ${steps.detect.outputs.CURRENT_POC_STAMP}.
        Current discovery stamp: ${steps.detect.outputs.CURRENT_DISCOVERY_STAMP}.
        Current planning stamp: ${steps.detect.outputs.CURRENT_PLANNING_STAMP}.
        GATE: local gate command run in the issue worktree with bash -euo pipefail -c
        (current: ${steps.detect.outputs.CURRENT_GATE}).
        REQUIRED_CHECK: GitHub check the default branch will require (strict)
        (current: ${steps.detect.outputs.CURRENT_REQUIRED_CHECK}).
        Required now: ${steps.detect.outputs.REQUIRED_NOW}.
        Checks on the last merged PR: ${steps.detect.outputs.RECENT_CHECKS}.
        TEST_PATHS: Bash ERE matching this repository's test paths
        (current: ${steps.detect.outputs.CURRENT_TEST_PATHS}; for a4s: (^|/)(test|tests)/|\.test\.(ts|cjs)$).
        REBASE_RESOLVER: repository command run in the conflicted worktree, or empty
        (current: ${steps.detect.outputs.CURRENT_REBASE_RESOLVER}; for a4s: node packages/omp-dagu/bin/dagu-bundle-rebase.mjs).
        VALIDATION: optional repository procedure after the gate and before push;
        empty means skip (current JSON: ${steps.detect.outputs.CURRENT_VALIDATION}).
        Adoption fixes this value; feature enqueue overrides are rejected.
        A4S_BLOCKER_REPORTING: ask requires consent before publishing a blocker;
        auto explicitly authorizes scoped A4S blocker reporting to the identified native owner.
        Empty preserves the installed choice (current: ${steps.detect.outputs.CURRENT_A4S_BLOCKER_REPORTING}; initial: ask).
      form:
        type: object
        additionalProperties: false
        properties:
          GATE:
            type: string
            minLength: 1
          REQUIRED_CHECK:
            type: string
            minLength: 1
          TEST_PATHS:
            type: string
            minLength: 1
          REBASE_RESOLVER:
            type: string
          VALIDATION:
            type: string
            default: ""
          A4S_BLOCKER_REPORTING:
            type: string
            enum: ["", ask, auto]
            default: ""
        required: [GATE, REQUIRED_CHECK, TEST_PATHS, REBASE_RESOLVER]

  - id: worktrees
    depends: answers
    run: |
      set -euo pipefail
      if ! git -C "$PRIMARY" check-ignore -q "$PRIMARY/.workspace/worktrees/issue-1"; then
        printf '/.workspace/worktrees/\n' >> "$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path info/exclude)"
        printf 'worktrees=ignored\n'
      fi
      git -C "$PRIMARY" check-ignore -q "$PRIMARY/.workspace/worktrees/issue-1"

  - id: render
    depends: worktrees
    env:
      - GATE: ${steps.answers.outputs.GATE}
      - REQUIRED_CHECK: ${steps.answers.outputs.REQUIRED_CHECK}
      - REPO: ${steps.detect.outputs.REPO}
      - BASE_BRANCH: ${steps.detect.outputs.BASE_BRANCH}
      - STAGE: ${steps.detect.outputs.STAGE}
      - TEST_PATHS: ${steps.answers.outputs.TEST_PATHS}
      - REBASE_RESOLVER: ${steps.answers.outputs.REBASE_RESOLVER}
      - VALIDATION: ${steps.answers.outputs.VALIDATION}
      - A4S_BLOCKER_REPORTING: ${steps.answers.outputs.A4S_BLOCKER_REPORTING}
      - CURRENT_A4S_BLOCKER_REPORTING: ${steps.detect.outputs.CURRENT_A4S_BLOCKER_REPORTING}
      - BUNDLE_NAME: ${steps.detect.outputs.BUNDLE_NAME}
      - BUNDLE_VERSION: ${steps.detect.outputs.BUNDLE_VERSION}
      - DAGU_VERSION: ${steps.detect.outputs.DAGU_VERSION}
      - SOURCE_NWO: ${steps.detect.outputs.SOURCE_NWO}
      - SOURCE_SHA: ${steps.detect.outputs.SOURCE_SHA}
    run: |
      set -euo pipefail
      umask 0022
      test -n "${DAG_RUN_ID:-}"
      PRIMARY=$(cd "$PRIMARY" && pwd -P)
      A4S_BLOCKER_REPORTING=${A4S_BLOCKER_REPORTING:-${CURRENT_A4S_BLOCKER_REPORTING:-ask}}
      case "$A4S_BLOCKER_REPORTING" in ask|auto) ;; *) echo 'A4S_BLOCKER_REPORTING must be ask or auto' >&2; exit 1 ;; esac
      mkdir -p "$(dirname "$STAGE")"
      source="$SOURCE_NWO@$SOURCE_SHA"
      identity="dagu-feature-bundle=$BUNDLE_VERSION source=$source bootstrap=$DAG_RUN_ID"
      stamp="$BUNDLE_NAME@$BUNDLE_VERSION source=$source bootstrap=$DAG_RUN_ID dagu=$DAGU_VERSION"
      render_common='
        gsub("__DAGU_FEATURE_STAMP__"; $stamp)
        | gsub("__DAGU_FEATURE_VERSION__"; $version)
        | gsub("__DAGU_FEATURE_IDENTITY__"; $identity)'
      jq -nr --rawfile template "$SKILL_DIR/feature.yaml" \
        --arg repo "$REPO" --arg base "$BASE_BRANCH" \
        --arg gate "$GATE" --arg check "$REQUIRED_CHECK" \
        --arg resolver "$REBASE_RESOLVER" --arg primary "$PRIMARY" \
        --arg validation "${VALIDATION:-}" \
        --arg blocker_reporting "$A4S_BLOCKER_REPORTING" \
        --arg stamp "$stamp" --arg version "$BUNDLE_VERSION" --arg identity "$identity" \
        "\$template
          | $render_common
          | gsub(\"TEMPLATE_REPO\"; \$repo)
          | gsub(\"TEMPLATE_BASE_BRANCH\"; \$base | tojson)
          | gsub(\"__PRIMARY__\"; \$primary | tojson)
          | gsub(\"__GATE__\"; \$gate | tojson)
          | gsub(\"__REBASE_RESOLVER__\"; \$resolver | tojson)
          | gsub(\"__REQUIRED_CHECK__\"; \$check | tojson)
          | gsub(\"__VALIDATION__\"; \$validation | tojson)
          | gsub(\"__A4S_BLOCKER_REPORTING__\"; \$blocker_reporting | tojson)" > "$STAGE"
      jq -nr --rawfile template "$SKILL_DIR/poc.yaml" \
        --arg repo "$REPO" --arg base "$BASE_BRANCH" \
        --arg primary "$PRIMARY" --arg tests "$TEST_PATHS" \
        --arg stamp "$stamp" --arg version "$BUNDLE_VERSION" --arg identity "$identity" \
        "\$template
          | $render_common
          | gsub(\"TEMPLATE_REPO\"; \$repo)
          | gsub(\"TEMPLATE_BASE_BRANCH\"; \$base | tojson)
          | gsub(\"__PRIMARY__\"; \$primary | tojson)
          | gsub(\"__TEST_PATHS__\"; \$tests | tojson)" > "$(dirname "$STAGE")/poc.yaml"
      jq -nr --rawfile template "$SKILL_DIR/discovery.yaml" \
        --arg repo "$REPO" \
        --arg stamp "$stamp" --arg version "$BUNDLE_VERSION" --arg identity "$identity" \
        "\$template
          | $render_common
          | gsub(\"TEMPLATE_DAGU_FEATURE_VERSION\"; \$version)
          | gsub(\"TEMPLATE_REPO\"; \$repo)" > "$(dirname "$STAGE")/discovery.yaml"
      jq -nr --rawfile template "$SKILL_DIR/planning.yaml" \
        --arg repo "$REPO" \
        --arg stamp "$stamp" --arg version "$BUNDLE_VERSION" --arg identity "$identity" \
        "\$template | $render_common | gsub(\"TEMPLATE_REPO\"; \$repo)" > "$(dirname "$STAGE")/planning.yaml"
      jq -nr --rawfile template "$SKILL_DIR/reconcile.yaml" \
        --arg stamp "$stamp" --arg version "$BUNDLE_VERSION" --arg identity "$identity" \
        "\$template | $render_common" > "$(dirname "$STAGE")/reconcile.yaml"
      for rendered in "$STAGE" "$(dirname "$STAGE")/poc.yaml" \
        "$(dirname "$STAGE")/discovery.yaml" "$(dirname "$STAGE")/planning.yaml" "$(dirname "$STAGE")/reconcile.yaml"; do
        if grep -En 'TEMPLATE_[A-Z_]+|__[A-Z0-9_]*__' "$rendered"; then exit 1; fi
        dagu validate "$rendered"
      done
      printf 'stage=%s\n' "$STAGE"

  - id: reconcile
    depends: render
    env:
      - STAGE: ${steps.detect.outputs.STAGE}
    run: |
      set -euo pipefail
      destination="${DAGU_HOME:-$HOME/.dagu}/dags/reconcile.yaml"
      rendered="$(dirname "$STAGE")/reconcile.yaml"
      dagu validate "$rendered"
      mkdir -p "$(dirname "$destination")"
      if ! cmp -s "$rendered" "$destination"; then
        install -m 0644 "$rendered" "$destination"
      fi
      dagu validate "$destination"
      printf 'reconcile=%s\n' "$destination"

  - id: github
    depends: reconcile
    env:
      - REQUIRED_CHECK: ${steps.answers.outputs.REQUIRED_CHECK}
      - NWO: ${steps.detect.outputs.NWO}
      - BASE_BRANCH: ${steps.detect.outputs.BASE_BRANCH}
    run: |
      set -euo pipefail
      settings=$(gh api "repos/$NWO" --jq '[.allow_auto_merge, .allow_squash_merge] | map(tostring) | join(" ")')
      if test "$settings" != "true true"; then
        gh api -X PATCH "repos/$NWO" -F allow_auto_merge=true -F allow_squash_merge=true >/dev/null
        printf 'repo_settings=updated\n'
      fi
      protection_url="repos/$NWO/branches/$BASE_BRANCH/protection"
      if ! before=$(gh api "$protection_url" 2>&1); then
        grep -q 'Branch not protected' <<<"$before"
        jq -n --arg c "$REQUIRED_CHECK" '{
            required_status_checks: {strict: true, contexts: [$c]},
            enforce_admins: null,
            required_pull_request_reviews: null,
            restrictions: null
          }' | gh api -X PUT "$protection_url" --input - >/dev/null
        printf 'protection=created\n'
      elif jq -e '.required_status_checks != null' <<<"$before" >/dev/null; then
        jq --arg c "$REQUIRED_CHECK" '{
            strict: true,
            contexts: ((.required_status_checks.contexts + [$c]) | unique)
          }' <<<"$before" \
          | gh api -X PATCH "$protection_url/required_status_checks" --input - >/dev/null
        printf 'required_status_checks=updated\n'
      else
        jq -e '(.required_pull_request_reviews.dismissal_restrictions // null) == null
          and (.required_pull_request_reviews.bypass_pull_request_allowances // null) == null' \
          <<<"$before" >/dev/null
        jq --arg c "$REQUIRED_CHECK" '{
            required_status_checks: {strict: true, contexts: [$c]},
            enforce_admins: (.enforce_admins.enabled // false),
            required_pull_request_reviews: (.required_pull_request_reviews
              | if . == null then null else {
                  dismiss_stale_reviews, require_code_owner_reviews,
                  required_approving_review_count, require_last_push_approval
                } end),
            restrictions: (.restrictions
              | if . == null then null else {
                  users: [.users[].login], teams: [.teams[].slug], apps: [.apps[].slug]
                } end),
            required_linear_history: (.required_linear_history.enabled // false),
            allow_force_pushes: (.allow_force_pushes.enabled // false),
            allow_deletions: (.allow_deletions.enabled // false),
            block_creations: (.block_creations.enabled // false),
            required_conversation_resolution: (.required_conversation_resolution.enabled // false),
            lock_branch: (.lock_branch.enabled // false),
            allow_fork_syncing: (.allow_fork_syncing.enabled // false)
          }' <<<"$before" | gh api -X PUT "$protection_url" --input - >/dev/null
        after=$(gh api "$protection_url")
        normalize='del(.required_status_checks) | walk(if type == "object" then del(.url, .contexts_url) else . end)'
        test "$(jq -S "$normalize" <<<"$before")" = "$(jq -S "$normalize" <<<"$after")"
        printf 'protection=required_status_checks_added\n'
      fi

  - id: confirm
    depends: github
    env:
      - REQUIRED_CHECK: ${steps.answers.outputs.REQUIRED_CHECK}
      - NWO: ${steps.detect.outputs.NWO}
      - BASE_BRANCH: ${steps.detect.outputs.BASE_BRANCH}
      - STAGE: ${steps.detect.outputs.STAGE}
      - BUNDLE_VERSION: ${steps.detect.outputs.BUNDLE_VERSION}
      - DAGU_VERSION: ${steps.detect.outputs.DAGU_VERSION}
      - SOURCE_NWO: ${steps.detect.outputs.SOURCE_NWO}
      - SOURCE_SHA: ${steps.detect.outputs.SOURCE_SHA}
    run: |
      set -euo pipefail
      test "$(gh api "repos/$NWO" --jq '.allow_auto_merge and .allow_squash_merge')" = true
      test "$(gh api "repos/$NWO/branches/$BASE_BRANCH/protection/required_status_checks" \
        --jq '.strict and (.contexts | index(env.REQUIRED_CHECK) != null)')" = true
      git -C "$PRIMARY" check-ignore -q "$PRIMARY/.workspace/worktrees/issue-1"
      dagu validate "$STAGE"
      dagu validate "$(dirname "$STAGE")/poc.yaml"
      dagu validate "$(dirname "$STAGE")/discovery.yaml"
      dagu validate "$(dirname "$STAGE")/planning.yaml"
      destination="${DAGU_HOME:-$HOME/.dagu}/dags/reconcile.yaml"
      cmp "$(dirname "$STAGE")/reconcile.yaml" "$destination"
      dagu validate "$destination"
      printf 'dagu-feature-bundle=%s source=%s@%s bootstrap=%s dagu=%s\n' \
        "$BUNDLE_VERSION" "$SOURCE_NWO" "$SOURCE_SHA" "$DAG_RUN_ID" "$DAGU_VERSION"
      printf 'Dagu-Feature-Bundle: %s\n' "$BUNDLE_VERSION"
      printf 'Dagu-Feature-Source: %s@%s\n' "$SOURCE_NWO" "$SOURCE_SHA"
      printf 'Dagu-Feature-Bootstrap: %s\n' "$DAG_RUN_ID"
      printf 'reconcile=%s\n' "$destination"
      printf 'scheduler=ok\nrepo=%s\nbase_branch=%s\nrequired_check=%s\nstage=%s\n' \
        "$NWO" "$BASE_BRANCH" "$REQUIRED_CHECK" "$STAGE"
