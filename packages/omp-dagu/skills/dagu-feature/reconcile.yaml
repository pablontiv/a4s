# dagu-feature-bundle: __DAGU_FEATURE_STAMP__
description: Advances native review checkpoints and reports orphaned runs and managed leftovers.
labels:
  - dagu-feature-bundle=__DAGU_FEATURE_VERSION__
schedule: "* * * * *"
catchup_window: ""
overlap_policy: skip
type: graph
shell: /run/current-system/sw/bin/bash
steps:
  - id: discover
    run: |
      dagu history feature --status waiting --format json --limit 500 | jq -c '
        def param($key):
          .params as $params
          | try ($params | capture("(^| )" + $key + "=(?<value>[^ ]*)($| )").value) catch "";
        [.[] | {
          RUN: .dagRunId,
          ISSUE: param("ISSUE"),
          PRIMARY: param("PRIMARY"),
          BRANCH: param("BRANCH"),
          PR_NUMBER: param("PR_NUMBER")
        }]
      '
    output: RUNS

  - id: leftovers
    depends: discover
    run: |
      set -euo pipefail
      TMP=$(mktemp -d)
      trap 'rm -rf "$TMP"' EXIT
      dagu history feature --format json --limit 1000 >"$TMP/feature.json"
      dagu history poc --format json --limit 1000 >"$TMP/poc.json"
      jq -s '
        def param($key):
          .params as $params
          | try ($params | capture("(^| )" + $key + "=(?<value>[^ ]*)($| )").value) catch "";
        [(.[][]) | {
          kind: .name,
          run: .dagRunId,
          status: (.status | ascii_downcase),
          primary: param("PRIMARY"),
          branch: param("BRANCH"),
          issue: param("ISSUE"),
          time: (.startedAt // .finishedAt // "")
        }]
        | sort_by(.time)
        | reverse
      ' "$TMP/feature.json" "$TMP/poc.json" >"$TMP/runs.json"
      : >"$TMP/leftovers"

      inspect_resource() {
        local primary=$1 worktree=$2 branch=$3 result owned last_run last_status repo
        result=$(jq -r \
          --arg primary "$primary" \
          --arg worktree "$worktree" \
          --arg branch "$branch" '
            def possesses:
              if .kind == "feature" then
                (($branch != "" and .branch == $branch)
                  or ($worktree != "" and .issue != "" and ($worktree | split("/")[-1]) == ("issue-" + .issue)))
              elif .kind == "poc" then
                (($worktree != "" and ($worktree | split("/")[-1]) == ("poc-" + .run))
                  or ($branch != "" and $branch == ("poc/" + .run)))
              else false
              end;
            [.[] | select(.primary == $primary and possesses)] as $owners
            | ($owners[0] // null) as $last
            | [
                any($owners[]; .status == "queued" or .status == "running" or .status == "waiting"),
                ($last.run // "none"),
                ($last.status // "none")
              ]
            | @tsv
          ' "$TMP/runs.json")
        IFS=$'\t' read -r owned last_run last_status <<<"$result"
        if [[ "$owned" == false ]]; then
          repo=$(basename "$primary")
          printf 'LEFTOVER %s worktree=%s branch=%s last_run=%s last_status=%s\n' \
            "$repo" "${worktree:-none}" "${branch:-none}" "$last_run" "$last_status" >>"$TMP/leftovers"
        fi
      }

      while IFS= read -r primary; do
        managed_root=$(git -C "$primary" rev-parse --show-toplevel)
        : >"$TMP/worktree-branches"
        worktree=
        branch=
        while IFS= read -r line; do
          case "$line" in
            "worktree "*) worktree=${line#worktree }; branch= ;;
            "branch refs/heads/"*) branch=${line#branch refs/heads/} ;;
            "")
              if [[ -n "$worktree" && "$worktree" == "$managed_root/.workspace/worktrees/"* ]]; then
                inspect_resource "$primary" "$worktree" "$branch"
                if [[ -n "$branch" ]]; then
                  printf '%s\n' "$branch" >>"$TMP/worktree-branches"
                fi
              fi
              worktree=
              branch=
              ;;
          esac
        done < <(git -C "$primary" worktree list --porcelain; printf '\n')

        while IFS= read -r branch; do
          if ! grep -Fqx -- "$branch" "$TMP/worktree-branches"; then
            inspect_resource "$primary" "" "$branch"
          fi
        done < <(git -C "$primary" for-each-ref --format='%(refname:short)' refs/heads/dagu/)
      done < <(jq -r --arg filter "${RECONCILE_PRIMARY:-}" \
        '[.[].primary | select(length > 0)] | unique[] | select($filter == "" or . == $filter)' "$TMP/runs.json")

      cat "$TMP/leftovers" >&2

  - id: tick
    depends: leftovers
    preconditions:
      - condition: "${RUNS}"
        expected: "re:^\\[.+\\]$"
    action: dag.run
    with:
      dag: reconcile-run
    parallel:
      items: ${RUNS}
      max_concurrent: 1

---
name: reconcile-run
type: graph
shell: /run/current-system/sw/bin/bash
params:
  - name: RUN
    type: string
    required: true
  - name: ISSUE
    type: string
    required: true
  - name: PRIMARY
    type: string
    required: true
  - name: BRANCH
    type: string
    required: true
  - name: PR_NUMBER
    type: string
    default: ""
steps:
  - id: observe
    run: |
      set -euo pipefail
      REPO=$(gh repo view "$(git -C "$PRIMARY" remote get-url origin)" --json nameWithOwner --jq .nameWithOwner)
      STATUS=$(dagu status feature --run-id "$RUN")
      STEP=$(sed -nE 's/^├─([A-Za-z0-9_-]+) .*\[waiting\]$/\1/p' <<<"$STATUS" | head -1)
      ITERATION=$(sed -nE 's/.*push-back iteration: ([0-9]+).*/\1/p' <<<"$STATUS" | head -1)
      OBSERVATION="$STEP issue=$(gh issue view "$ISSUE" -R "$REPO" --json state,closedAt --jq '"\(.state) closed_at=\(.closedAt // "")"')"
      API_URL=${DAGU_URL:-http://127.0.0.1:${DAGU_PORT:-8080}}
      printf 'run=%s\nrepo=%s\nissue=%s\niteration=%s\nobservation=%s\nstep=%s\napi_url=%s\n' \
        "$RUN" "$REPO" "$ISSUE" "${ITERATION:-0}" "$OBSERVATION" "$STEP" "$API_URL" | tee -a "$DAGU_OUTPUT_FILE"
    outputs:
      - name: run
      - name: repo
      - name: issue
      - name: iteration
      - name: observation
      - name: step
      - name: api_url

  - id: review_action
    depends: observe
    action: state.get
    with:
      # feature's state.set uses the default dag scope, whose namespace is the DAG name.
      scope: dag
      namespace: feature
      key: issue-${ISSUE}/${RUN}/review-action
      default: none
    output: REVIEW_ACTION

  - id: route
    outputs:
      - name: operation
    depends: review_action
    env:
      STEP: ${steps.observe.outputs.step}
      REVIEW: ${REVIEW_ACTION.value}
    run: |
      set -euo pipefail
      case "$STEP/$REVIEW" in
        dependency_review/complete|conflict_review/complete) operation=complete ;;
        dependency_review/rewind|conflict_review/rewind|merge_review/*) operation=push-back ;;
        *) operation=none ;;
      esac
      printf 'operation=%s\n' "$operation" >> "$DAGU_OUTPUT_FILE"

  - id: transition
    depends: route
    preconditions:
      - condition: ${steps.route.outputs.operation}
        expected: "re:^(complete|push-back)$"
    action: http.request
    with:
      method: POST
      # Dagu 2.19.2 takes expectedIteration as a query param (enforced on push-back); a body field is rejected as task input.
      url: ${steps.observe.outputs.api_url}/api/v1/dag-runs/feature/${RUN}/human-tasks/${steps.observe.outputs.step}/${steps.route.outputs.operation}?expectedIteration=${steps.observe.outputs.iteration}
      headers:
        Content-Type: application/json
      body: '{}'
      json: true
      timeout: 30

  - id: orphan
    depends: observe
    preconditions:
      - condition: "${steps.observe.outputs.observation}"
        expected: "re:^(triage|implement) issue=CLOSED "
    run: echo "ORPHAN ${steps.observe.outputs.repo}#${steps.observe.outputs.issue} ${steps.observe.outputs.run} ${steps.observe.outputs.observation}"
