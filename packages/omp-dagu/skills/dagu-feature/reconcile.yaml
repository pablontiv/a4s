# dagu-feature-bundle: __DAGU_FEATURE_STAMP__
description: Reconciles every waiting feature run's await_merge with its PR and reports waiting runs whose issue is closed.
labels:
  - dagu-feature-bundle=__DAGU_FEATURE_VERSION__
schedule: "* * * * *"
catchup_window: ""
overlap_policy: skip
type: graph
shell: bash
steps:
  - id: discover
    run: |
      dagu history feature --status waiting --format json --limit 500 | jq -c '
        def param($key):
          .params as $params
          | try ($params | capture("(^| )" + $key + "=(?<value>[^ ]*)($| )").value) catch "";
        [.[] | {
          RUN: .dagRunId,
          ISSUE: param("ISSUE"),
          PRIMARY: param("PRIMARY"),
          BRANCH: param("BRANCH"),
          PR_NUMBER: param("PR_NUMBER")
        }]
      '
    output: RUNS

  - id: leftovers
    depends: discover
    run: |
      set -euo pipefail
      TMP=$(mktemp -d)
      trap 'rm -rf "$TMP"' EXIT
      dagu history feature --format json --limit 1000 >"$TMP/feature.json"
      dagu history poc --format json --limit 1000 >"$TMP/poc.json"
      jq -s '
        def param($key):
          .params as $params
          | (try ($params | capture("(^| )" + $key + "=(?<value>.*?)(?= [A-Z_]+=|$)").value | if startswith("\"") or startswith("\u0027") then .[1:-1] else . end) catch "") // "";
        [(.[][]) | {
          kind: .name,
          run: .dagRunId,
          status: (.status | ascii_downcase),
          primary: param("PRIMARY"),
          branch: param("BRANCH"),
          issue: param("ISSUE"),
          time: (.startedAt // .finishedAt // "")
        }]
        | sort_by(.time)
        | reverse
      ' "$TMP/feature.json" "$TMP/poc.json" >"$TMP/runs.json"
      while IFS= read -r primary; do
        [[ -d "$primary" ]] || continue
        canonical=$(cd "$primary" && pwd -P)
        jq --arg source "$primary" --arg canonical "$canonical" \
          'map(if .primary == $source then .primary = $canonical else . end)' \
          "$TMP/runs.json" > "$TMP/canonical.json"
        mv "$TMP/canonical.json" "$TMP/runs.json"
      done < <(jq -r '[.[].primary | select(length > 0)] | unique[]' "$TMP/runs.json")
      : >"$TMP/leftovers"

      inspect_resource() {
        local primary=$1 worktree=$2 branch=$3 result owned last_run last_status repo
        result=$(jq -r \
          --arg primary "$primary" \
          --arg worktree "$worktree" \
          --arg branch "$branch" '
            def possesses:
              if .kind == "feature" then
                (($branch != "" and .branch == $branch)
                  or ($worktree != "" and .issue != "" and ($worktree | split("/")[-1]) == ("issue-" + .issue)))
              elif .kind == "poc" then
                (($worktree != "" and ($worktree | split("/")[-1]) == ("poc-" + .run))
                  or ($branch != "" and $branch == ("poc/" + .run)))
              else false
              end;
            [.[] | select(.primary == $primary and possesses)] as $owners
            | ($owners[0] // null) as $last
            | [
                any($owners[]; .status == "queued" or .status == "running" or .status == "waiting"),
                ($last.run // "none"),
                ($last.status // "none")
              ]
            | @tsv
          ' "$TMP/runs.json")
        IFS=$'\t' read -r owned last_run last_status <<<"$result"
        if [[ "$owned" == false ]]; then
          repo=$(basename "$primary")
          printf 'LEFTOVER %s worktree=%s branch=%s last_run=%s last_status=%s\n' \
            "$repo" "${worktree:-none}" "${branch:-none}" "$last_run" "$last_status" >>"$TMP/leftovers"
        fi
      }

      while IFS= read -r primary; do
        if [[ ! -d "$primary" ]]; then
          printf 'SKIP_PRIMARY %s missing\n' "$primary"
          continue
        fi
        managed_root=$(git -C "$primary" rev-parse --show-toplevel)
        : >"$TMP/worktree-branches"
        worktree=
        branch=
        while IFS= read -r line; do
          case "$line" in
            "worktree "*) worktree=${line#worktree }; branch= ;;
            "branch refs/heads/"*) branch=${line#branch refs/heads/} ;;
            "")
              if [[ -n "$worktree" && "$worktree" == "$managed_root/.workspace/worktrees/"* ]]; then
                inspect_resource "$primary" "$worktree" "$branch"
                if [[ -n "$branch" ]]; then
                  printf '%s\n' "$branch" >>"$TMP/worktree-branches"
                fi
              fi
              worktree=
              branch=
              ;;
          esac
        done < <(git -C "$primary" worktree list --porcelain; printf '\n')

        while IFS= read -r branch; do
          if ! grep -Fqx -- "$branch" "$TMP/worktree-branches"; then
            inspect_resource "$primary" "" "$branch"
          fi
        done < <(git -C "$primary" for-each-ref --format='%(refname:short)' refs/heads/dagu/)
      done < <(jq -r --arg filter "${RECONCILE_PRIMARY:-}" \
        '[.[].primary | select(length > 0)] | unique[] | select($filter == "" or . == $filter)' "$TMP/runs.json")

      if [[ -s "$TMP/leftovers" ]]; then
        cat "$TMP/leftovers" >&2
        exit 1
      fi

  - id: tick
    depends: discover
    preconditions:
      - condition: "${RUNS}"
        expected: "re:^\\[.+\\]$"
    action: dag.run
    with:
      dag: reconcile-run
    parallel:
      items: ${RUNS}
      max_concurrent: 1

---
name: reconcile-run
type: graph
shell: bash
params:
  - name: RUN
    type: string
    required: true
  - name: ISSUE
    type: string
    required: true
  - name: PRIMARY
    type: string
    required: true
  - name: BRANCH
    type: string
    required: true
  - name: PR_NUMBER
    type: string
    default: ""
steps:
  - id: observe
    run: |
      set -euo pipefail
      REPO=$(gh repo view "$(git -C "$PRIMARY" remote get-url origin)" --json nameWithOwner --jq .nameWithOwner)
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      mkdir -p "$STATE"
      TMP=$(mktemp -d)
      trap 'rm -rf "$TMP"' EXIT
      STATUS=$(dagu status feature --run-id "$RUN")
      ITERATION=$(sed -nE 's/.*push-back iteration: ([0-9]+).*/\1/p' <<<"$STATUS" | head -1)
      ITERATION=${ITERATION:-0}
      STEP=$(LC_ALL=C sed -nE 's/^(├─|└─)([A-Za-z0-9_-]+) .*\[waiting\]$/\2/p' <<<"$STATUS" | head -1)
      CLASS=PENDING ACTION=WAIT SHA= CHECK= LOG= CAUSE= PR= WORKTREE="$PRIMARY/.workspace/worktrees/issue-$ISSUE" RETRY_RUN=
      OBSERVATION="$STEP"
      if [[ "$STATUS" != Waiting* ]]; then
        ACTION=NONE
        OBSERVATION=NOT_WAITING
      elif [[ "$STEP" == await_ci || "$STEP" == await_merge ]]; then
        pr_ref=${PR_NUMBER:-$BRANCH}
        CLASS=BLOCKED
        CAUSE="GitHub observation unavailable; check repository permissions and authentication"
        if gh pr view "$pr_ref" -R "$REPO" --json number,state,mergeStateStatus,autoMergeRequest,headRefOid,statusCheckRollup >"$TMP/pr"; then
          PR=$(jq -r .number "$TMP/pr")
          SHA=$(jq -r .headRefOid "$TMP/pr")
          pr_state=$(jq -r .state "$TMP/pr")
          merge_state=$(jq -r .mergeStateStatus "$TMP/pr")
          auto=$(jq -r '.autoMergeRequest != null' "$TMP/pr")
          OBSERVATION="$STEP $pr_state/$merge_state/$auto"
          CLASS=PENDING CAUSE="Required checks not yet published"
          # gh exits 1 for failed checks and 8 for pending checks, with valid JSON.
          rc=0
          gh pr checks "$PR" -R "$REPO" --required --json name,state,link >"$TMP/required" 2>"$TMP/error" || rc=$?
          if [[ "$rc" != 0 && "$rc" != 1 && "$rc" != 8 ]] || ! jq -e 'type == "array"' "$TMP/required" >/dev/null; then
            CLASS=BLOCKED CAUSE="Required-check lookup failed: $(cat "$TMP/error")"
          elif ! gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs" >"$TMP/runs" 2>"$TMP/error" ||
               ! gh api "repos/$REPO/commits/$SHA/status" >"$TMP/statuses" 2>>"$TMP/error"; then
            CLASS=BLOCKED CAUSE="SHA-bound checks unavailable: $(cat "$TMP/error")"
          else
            jq -s --arg sha "$SHA" '
              [ (.[0][] .check_runs[] | {name, sha: .head_sha, state: (if .status == "completed" then .conclusion | ascii_upcase else "PENDING" end), link: .details_url, id, text: ((.output.title // "") + "\n" + (.output.summary // "") + "\n" + (.output.text // ""))}),
                (.[1] as $s | $s.statuses[] | {name: .context, sha: $s.sha, state: (.state | ascii_upcase), link: .target_url, id, text: .description}) ]
              | sort_by(.id) | reverse
            ' "$TMP/runs" "$TMP/statuses" >"$TMP/checks"
            CLASS=PASS CAUSE="All required checks passed for current head"
            while IFS= read -r required; do
              CHECK=$(jq -r .name <<<"$required")
              check=$(jq -c --arg name "$CHECK" --arg sha "$SHA" '[.[] | select(.name == $name and .sha == $sha)][0] // empty' "$TMP/checks")
              if [[ -z "$check" ]]; then
                if jq -e --arg name "$CHECK" '.[] | select(.name == $name)' "$TMP/checks" >/dev/null; then
                  CLASS=STALE_SHA CAUSE="Discarded result for another SHA; reobserve current head"
                else
                  CLASS=PENDING CAUSE="Required check $CHECK not published for $SHA"
                fi
                break
              fi
              result=$(jq -r .state <<<"$check")
              case "$result" in
                SUCCESS|NEUTRAL|SKIPPED) continue ;;
                PENDING|QUEUED|IN_PROGRESS|EXPECTED|REQUESTED|WAITING) CLASS=PENDING CAUSE="Required check $CHECK is $result"; break ;;
              esac
              LOG=$(jq -r '.text // ""' <<<"$check")
              link=$(jq -r '.link // ""' <<<"$check")
              RETRY_RUN=
              if [[ "$link" =~ /actions/runs/([0-9]+) ]]; then
                RETRY_RUN=${BASH_REMATCH[1]}
                if [[ "$link" =~ /job/([0-9]+) ]] && gh run view "$RETRY_RUN" -R "$REPO" --job "${BASH_REMATCH[1]}" --log-failed >"$TMP/log" 2>"$TMP/error"; then
                  LOG="$LOG $(head -c 16000 "$TMP/log")"
                fi
              fi
              # Conclusions alone never establish who caused a failure.
              if [[ "$LOG" =~ [Rr]unner.*(lost.communication|unavailable|shutdown)|[Ff]ailed.to.download.action|[Nn]etwork.*(timed.out|unreachable)|502.Bad.Gateway|503.Service.Unavailable|HTTP.429 ]]; then
                CLASS=TRANSIENT CAUSE="Infrastructure failure in $CHECK ($result)"
              elif [[ "$LOG" =~ [Aa]ssertion[Ee]rror|[Tt]est(s|.suite)?.*failed|[Ff]ailing.tests|error.TS[0-9]+|[Bb]uild.failed|[Ll]int.errors ]]; then
                CLASS=CODE_FAIL CAUSE="Candidate failure in $CHECK ($result)"
              else
                CLASS=BLOCKED CAUSE="Unproven cause for $CHECK ($result); inspect $link and resolve permissions, protection or operator action"
              fi
              break
            done < <(jq -c 'sort_by(if .state == "SUCCESS" or .state == "NEUTRAL" or .state == "SKIPPED" then 2 elif .state == "IN_PROGRESS" or .state == "PENDING" or .state == "QUEUED" then 1 else 0 end)[]' "$TMP/required")
            if [[ "$(jq length "$TMP/required")" == 0 ]]; then
              CLASS=PENDING CAUSE="Required checks not yet published"
            fi
          fi
          current=$(gh pr view "$PR" -R "$REPO" --json headRefOid --jq .headRefOid)
          if [[ "$current" != "$SHA" ]]; then
            CLASS=STALE_SHA CAUSE="Head moved from $SHA to $current; discard this observation"
          elif [[ "$pr_state" == OPEN && ( "$merge_state" == BEHIND || "$merge_state" == DIRTY ) ]]; then
            ACTION=REBASE STEP=await_merge
          elif [[ "$CLASS" == CODE_FAIL && "$pr_state" == OPEN ]]; then
            ACTION=IMPLEMENT STEP=await_ci
          elif [[ "$CLASS" == TRANSIENT && "$pr_state" == OPEN ]]; then
            ACTION=RETRY
          elif [[ "$CLASS" == PASS && "$pr_state" == MERGED ]]; then
            ACTION=COMPLETE
          elif [[ "$pr_state" != OPEN && "$pr_state" != MERGED ]] || [[ "$pr_state" == OPEN && ( "$auto" != true || "$merge_state" == DRAFT || "$merge_state" == HAS_HOOKS ) ]]; then
            CLASS=BLOCKED CAUSE="PR $pr_state/$merge_state auto-merge=$auto; operator action required"
          fi
          if [[ "$CLASS" == STALE_SHA ]]; then ACTION=WAIT; fi
        fi
      elif [[ -n "$STEP" ]]; then
        OBSERVATION="$STEP issue=$(gh issue view "$ISSUE" -R "$REPO" --json state,closedAt --jq '"\(.state) closed_at=\(.closedAt // "")"')"
      fi
      jq -n --arg repo "$REPO" --arg run "$RUN" --arg pr "$PR" --arg worktree "$WORKTREE" \
        --arg step "$STEP" --argjson iteration "$ITERATION" --arg sha "$SHA" --arg class "$CLASS" \
        --arg action "$ACTION" --arg check "$CHECK" --arg log "${LOG:0:3000}" --arg cause "$CAUSE" --arg retry_run "$RETRY_RUN" \
        '{repo:$repo,run:$run,pr:$pr,worktree:$worktree,step:$step,iteration:$iteration,sha:$sha,class:$class,action:$action,check:$check,log:$log,cause:$cause,retry_run:$retry_run}' >"$STATE/ci-observation.tmp"
      mv "$STATE/ci-observation.tmp" "$STATE/ci-observation.json"
      printf 'run=%s\nrepo=%s\nissue=%s\niteration=%s\nobservation=%s\nclassification=%s\n' \
        "$RUN" "$REPO" "$ISSUE" "$ITERATION" "$OBSERVATION" "$CLASS" | tee -a "$DAGU_OUTPUT_FILE"
      cat "$STATE/ci-observation.json"
    outputs:
      - name: run
      - name: repo
      - name: issue
      - name: iteration
      - name: observation
      - name: classification

  - id: transition
    depends: observe
    run: |
      set -euo pipefail
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "dagu-feature/runs/$RUN")
      file="$STATE/ci-observation.json"
      action=$(jq -r .action "$file")
      [[ "$action" != NONE && "$action" != WAIT ]] || exit 0
      repo=$(jq -r .repo "$file")
      pr=$(jq -r .pr "$file")
      sha=$(jq -r .sha "$file")
      iteration=$(jq -r .iteration "$file")
      step=$(jq -r .step "$file")
      guard() {
        local status current
        status=$(dagu status feature --run-id "$RUN")
        [[ "$status" == Waiting* ]] || { echo "Run is resuming; reobserve next tick"; return 1; }
        current=$(sed -nE 's/.*push-back iteration: ([0-9]+).*/\1/p' <<<"$status" | head -1)
        [[ "${current:-0}" == "$iteration" ]] || { echo "Stale iteration $iteration; current ${current:-0}" >&2; return 1; }
        [[ "$status" == *"$step [waiting]"* ]] || { echo "Checkpoint $step is not waiting" >&2; return 1; }
        [[ "$(gh pr view "$pr" -R "$repo" --json headRefOid --jq .headRefOid)" == "$sha" ]] ||
          { echo "STALE_SHA: head changed before transition" >&2; return 1; }
      }
      guard
      case "$action" in
        IMPLEMENT|REBASE)
          # The diagnostic is durable before the new implement opening reaches OMP.
          if [[ "$action" == IMPLEMENT ]]; then cp "$file" "$STATE/ci-return.json"; fi
          dagu human-task push-back feature --run-id "$RUN" --step "$step" --expected-iteration "$iteration"
          ;;
        COMPLETE)
          # complete has no expected-iteration flag. Reobserve before each async
          # resume; authorize_ci independently checks the published SHA afterwards.
          dagu human-task complete feature --run-id "$RUN" --step "$step"
          ;;
        RETRY)
          check=$(jq -r .check "$file")
          retry_run=$(jq -r .retry_run "$file")
          retry="$STATE/ci-retry-$sha.json"
          attempts=0 next_at=0
          if [[ -f "$retry" ]]; then
            attempts=$(jq -r .attempts "$retry")
            next_at=$(jq -r .next_at "$retry")
          fi
          now=$(date +%s)
          if (( now < next_at )); then
            printf 'TRANSIENT backoff: attempt=%s next_at=%s now=%s\n' "$attempts" "$next_at" "$now"
          elif (( attempts >= 2 )) || [[ -z "$retry_run" ]]; then
            jq '.class="BLOCKED" | .action="WAIT" | .cause += "; deterministic retry exhausted or no rerunnable Actions run; operator must restore infrastructure"' "$file" >"$file.tmp"
            mv "$file.tmp" "$file"
            cat "$file"
          else
            # Persist the budget before the external request, including a failed request.
            attempts=$((attempts + 1))
            next_at=$((now + 60 * (1 << (attempts - 1))))
            jq -n --arg sha "$sha" --arg check "$check" --argjson attempts "$attempts" --argjson next_at "$next_at" \
              '{sha:$sha,check:$check,attempts:$attempts,next_at:$next_at}' >"$retry"
            gh run rerun "$retry_run" -R "$repo" --failed
            printf 'TRANSIENT rerun=%s attempt=%s next_at=%s\n' "$retry_run" "$attempts" "$next_at"
          fi
          ;;
      esac

  - id: orphan
    depends: observe
    preconditions:
      - condition: "${steps.observe.outputs.observation}"
        expected: "re:^(triage|implement) issue=CLOSED "
    run: echo "ORPHAN ${steps.observe.outputs.repo}#${steps.observe.outputs.issue} ${steps.observe.outputs.run} ${steps.observe.outputs.observation}"
