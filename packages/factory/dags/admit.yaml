---
# Admission (VS1): every 5 minutes, open issues labelled `factory:ready`
# become factory runs (run-id factory-issue-<n>-<k>, k = attempt) of cycle.yaml. Duplicates are
# rejected by Dagu and are not errors. The label `factory` never admits.
type: graph
# bash features (${!var}) are used; Dagu's default shell may be sh
shell: bash
schedule: "*/5 * * * *"
# PRIMARY/FACTORY/T3_HOME/STATE: when empty, resolved from A4S_* declared in
# Dagu's base config `env:` (param defaults are not expanded by Dagu).
params:
  - name: PRIMARY
    default: ""
  - name: FACTORY
    default: ""
  - name: T3_HOME
    default: ""
  - name: STATE
    default: ""
  # injectable issue source: same JSON as `gh issue list --json number,labels,body`;
  # empty = ask GitHub
  - name: ISSUES_FILE
    default: ""
  # where the runs are enqueued; empty = Dagu's defaults
  - name: TARGET_DAGU_HOME
    default: ""
  - name: TARGET_DAGU_CONFIG
    default: ""
  # optional cycle params passed through
  - name: GATE
    default: ""
  - name: PUSH
    default: ""
  - name: CLOSE_ISSUE
    default: ""
  - name: LINE_TABLE
    default: ""
  - name: BRIEF_FILE
    default: ""
  # circuit breaker (src/breaker.mjs): injectable snapshot (fixtures); empty = live data
  - name: BREAKER_SNAPSHOT
    default: ""
  # ordering (src/next.mjs): JSON list of in-flight issue numbers (fixtures); empty = count cycle runs in Dagu
  - name: INFLIGHT_FILE
    default: ""
  - name: INBOX_THREAD
    default: ""
steps:
  - id: admit
    run: |
      set -uo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh" || exit 30
      # circuit breaker: while open nothing is admitted; opening notifies the inbox once
      rc=0
      node "$FACTORY/src/breaker.mjs" check --state "$STATE" --primary "$PRIMARY" --t3-home "$T3_HOME" \
        --factory "$FACTORY/src" --inbox "$INBOX_THREAD" \
        ${TARGET_DAGU_HOME:+--dagu-home "$TARGET_DAGU_HOME"} ${TARGET_DAGU_CONFIG:+--dagu-config "$TARGET_DAGU_CONFIG"} ${BREAKER_SNAPSHOT:+--snapshot "$BREAKER_SNAPSHOT"} || rc=$?
      if [ "$rc" = 40 ]; then echo "admit: circuit breaker open; nothing admitted"; exit 0; fi
      [ "$rc" = 0 ] || { echo "admit: breaker check failed ($rc)" >&2; exit 30; }
      origin=$(git -C "$PRIMARY" remote get-url origin 2>/dev/null || true)
      src="$ISSUES_FILE"
      live=""; [ -z "$src" ] && live=1
      if [ -z "$src" ]; then
        [ -n "$origin" ] || { echo "admit: PRIMARY has no origin remote" >&2; exit 30; }
        src=$(mktemp)
        gh issue list -R "$origin" --label factory:ready --state open \
          --limit 200 --json number,labels,body > "$src" || exit 30
      fi
      opts=()
      [ -n "$TARGET_DAGU_HOME" ] && opts+=(--dagu-home "$TARGET_DAGU_HOME")
      [ -n "$TARGET_DAGU_CONFIG" ] && opts+=(--config "$TARGET_DAGU_CONFIG")
      # PRIMARY/FACTORY/T3_HOME/STATE are forwarded only when passed explicitly;
      # otherwise the admitted run resolves them from the base config itself.
      [ -n "$ISSUES_FILE" ] && opts+=(--param "ISSUES_FILE=$ISSUES_FILE")
      for p in GATE PUSH CLOSE_ISSUE LINE_TABLE BRIEF_FILE; do
        v="${!p}"; [ -n "$v" ] && opts+=(--param "$p=$v")
      done
      # an issue that was on factory:hold loses its carried findings (re-admission is a fresh start)
      if [ -z "$ISSUES_FILE" ] && [ -n "$origin" ]; then
        held=$(mktemp)
        if gh issue list -R "$origin" --label factory:hold --state open \
          --limit 200 --json number,labels > "$held"; then
          node "$FACTORY/src/admit.mjs" --clear-held "$held" --state "$STATE" || true
        fi
      else
        node "$FACTORY/src/admit.mjs" --clear-held "$src" --state "$STATE" || true
      fi
      numbers=$(node "$FACTORY/src/admit.mjs" --list "$src") || exit 30
      rc_all=0
      for n in $numbers; do
        out=$(node "$FACTORY/src/admit.mjs" --issue "$n" --issues-file "$src" --state "$STATE" \
          ${origin:+--repo "$origin"} ${live:+--live} --dag "$FACTORY/dags/cycle.yaml" "${opts[@]}") && rc=0 || rc=$?
        printf '%s\n' "$out"
        # 22 = issue contract violated: not enqueued, non-fatal; from GitHub, tell the issue
        if [ "$rc" = 22 ] && [ -z "$ISSUES_FILE" ] && [ -n "$origin" ]; then
          gh issue comment "$n" -R "$origin" --body "$out" \
            || echo "admit: could not comment on #$n" >&2
        fi
        case "$rc" in 0|20|21|22) ;; *) rc_all=30 ;; esac
      done
      # mechanical ordering: fill the free run slots with the next unblocked issues (label factory:ready)
      all=""
      if [ -n "$ISSUES_FILE" ]; then all=$(mktemp); cp "$ISSUES_FILE" "$all"; fi
      nopts=()
      [ -n "$INFLIGHT_FILE" ] && nopts+=(--inflight-file "$INFLIGHT_FILE")
      [ -n "$TARGET_DAGU_HOME" ] && nopts+=(--dagu-home "$TARGET_DAGU_HOME")
      [ -n "$TARGET_DAGU_CONFIG" ] && nopts+=(--dagu-config "$TARGET_DAGU_CONFIG")
      if [ -n "$all" ]; then nopts+=(--issues-file "$all"); else nopts+=(--fetch-issues --repo "$origin"); fi  # live: gh api --paginate to exhaustion
      node "$FACTORY/src/next.mjs" --limits "$FACTORY/limits.json" "${nopts[@]}" || rc_all=30
      exit $rc_all
