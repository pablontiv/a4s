---
# Admission (VS1): every 5 minutes, open issues labelled `factory:ready`
# become factory runs (run-id factory-issue-<n>) of cycle.yaml. Duplicates are
# rejected by Dagu and are not errors. The label `factory` never admits.
type: graph
# bash features (${!var}) are used; Dagu's default shell may be sh
shell: bash
schedule: "*/5 * * * *"
# PRIMARY/FACTORY/T3_HOME/STATE: when empty, resolved from A4S_* declared in
# Dagu's base config `env:` (param defaults are not expanded by Dagu).
params:
  - name: PRIMARY
    default: ""
  - name: FACTORY
    default: ""
  - name: T3_HOME
    default: ""
  - name: STATE
    default: ""
  # injectable issue source: same JSON as `gh issue list --json number,labels`;
  # empty = ask GitHub
  - name: ISSUES_FILE
    default: ""
  # where the runs are enqueued; empty = Dagu's defaults
  - name: TARGET_DAGU_HOME
    default: ""
  - name: TARGET_DAGU_CONFIG
    default: ""
  # optional cycle params passed through
  - name: GATE
    default: ""
  - name: PUSH
    default: ""
  - name: CLOSE_ISSUE
    default: ""
  - name: LINE_TABLE
    default: ""
  - name: BRIEF_FILE
    default: ""
steps:
  - id: admit
    run: |
      set -uo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh" || exit 30
      origin=$(git -C "$PRIMARY" remote get-url origin 2>/dev/null || true)
      src="$ISSUES_FILE"
      if [ -z "$src" ]; then
        [ -n "$origin" ] || { echo "admit: PRIMARY has no origin remote" >&2; exit 30; }
        src=$(mktemp)
        gh issue list -R "$origin" --label factory:ready --state open \
          --limit 200 --json number,labels > "$src" || exit 30
      fi
      opts=()
      [ -n "$TARGET_DAGU_HOME" ] && opts+=(--dagu-home "$TARGET_DAGU_HOME")
      [ -n "$TARGET_DAGU_CONFIG" ] && opts+=(--config "$TARGET_DAGU_CONFIG")
      # PRIMARY/FACTORY/T3_HOME/STATE are forwarded only when passed explicitly;
      # otherwise the admitted run resolves them from the base config itself.
      for p in GATE PUSH CLOSE_ISSUE LINE_TABLE BRIEF_FILE; do
        v="${!p}"; [ -n "$v" ] && opts+=(--param "$p=$v")
      done
      numbers=$(node "$FACTORY/src/admit.mjs" --list "$src") || exit 30
      rc_all=0
      for n in $numbers; do
        node "$FACTORY/src/admit.mjs" --issue "$n" --issues-file "$src" \
          ${origin:+--repo "$origin"} --dag "$FACTORY/dags/cycle.yaml" "${opts[@]}"
        rc=$?
        case "$rc" in 0|20|21) ;; *) rc_all=30 ;; esac
      done
      exit $rc_all
