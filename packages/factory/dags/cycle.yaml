---
# Factory cycle: issue -> implementation thread in T3 (no commit) -> validate the
# worktree -> one commit -> integrate -> CI on the trunk -> close. No human step:
# validation is the only gate before the trunk.
# Nothing reaches a commit before it is validated in the worktree; nothing stays on
# the trunk if CI fails (it is reverted). Control is deterministic here;
# interpretation happens in the worker and arrives as a structured verdict.
type: graph
# bash features (${!var}) are used; Dagu's default shell may be sh
shell: bash
# PRIMARY/FACTORY/T3_HOME/STATE: empty params fall back to A4S_* declared in
# Dagu's base config `env:` (resolved by src/cycle-env.sh in every step).
params:
  # issue number (or fixture id in the selftest)
  - name: ISSUE
    required: true
  # primary checkout of the trunk repository
  - name: PRIMARY
    default: ""
  # absolute path to packages/factory, read from the trunk checkout
  - name: FACTORY
    default: ""
  - name: T3_HOME
    default: ""
  # in-flight state, outside the code
  - name: STATE
    default: ""
  - name: BASE
    default: main
  # optional; defaults to the GitHub issue title and body
  - name: BRIEF_FILE
    default: ""
  # validation in a CI-equivalent environment + selftest (operator host)
  - name: GATE
    default: "bash scripts/factory-gate.sh"
  # push the trunk after integrating, then wait for CI on the pushed commit
  - name: PUSH
    default: "true"
  # close the GitHub issue after a green trunk
  - name: CLOSE_ISSUE
    default: "true"
  # minutes to wait for CI on the pushed commit
  - name: CI_TIMEOUT_MIN
    default: "30"
  # optional line table override (the selftest uses a cheap model).
  # Not named LINES: shells export LINES (terminal height), e.g. "0" under Dagu.
  - name: LINE_TABLE
    default: ""
steps:
  - id: prepare
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      mkdir -p "$ISSUE_STATE"
      test "$(git -C "$PRIMARY" branch --show-current)" = "$BASE"
      test -z "$(git -C "$PRIMARY" status --porcelain --untracked-files=no)"
      if [ ! -d "$WT" ]; then
        git -C "$PRIMARY" worktree add -q -B "$BRANCH" "$WT" "$BASE"
      else
        # reused worktree (earlier attempt): keep its work on the current trunk
        git -C "$WT" reset -q --soft "$BASE" 2>/dev/null || true
        stashed=no
        if [ -n "$(git -C "$WT" status --porcelain)" ]; then
          git -C "$WT" stash push -q -u -m "factory-rework" && stashed=yes
        fi
        git -C "$WT" reset -q --hard "$BASE"
        if [ "$stashed" = yes ]; then git -C "$WT" stash pop -q; fi
      fi
      node "$FACTORY/src/t3cli.mjs" project add \
        --title "issue-$ISSUE" "$WT" || echo "project already registered"
      if [ -n "$BRIEF_FILE" ]; then
        cp "$BRIEF_FILE" "$ISSUE_STATE/brief.md"
        sed -n '1s/^#* *//p' "$BRIEF_FILE" > "$ISSUE_STATE/title"
      else
        origin=$(git -C "$PRIMARY" remote get-url origin)
        gh issue view "$ISSUE" -R "$origin" --json title,body \
          --jq '"# " + .title + "\n\n" + .body' > "$ISSUE_STATE/brief.md"
        gh issue view "$ISSUE" -R "$origin" --json title --jq .title \
          > "$ISSUE_STATE/title"
      fi

  - id: implement
    depends: prepare
    retry_policy:
      limit: 1
      interval_sec: 5
      exit_code: [10, 40]
    outputs:
      - {name: result}
      - {name: thread_id}
      - {name: model}
      - {name: question}
      - {name: commit}
      - {name: findings}
      - {name: worktree}
    # an empty LINE_TABLE makes the station use the lines.json next to it
    run: |
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      exec node "$FACTORY/src/station.mjs" --line impl \
        --issue "$ISSUE" --run "$DAG_RUN_ID" --project "$WT" \
        --brief "$ISSUE_STATE/brief.md" --t3-home "$T3_HOME" \
        --state "$STATE" --lines "$LINE_TABLE"

  - id: require_pass
    depends: implement
    env:
      - RESULT: ${steps.implement.outputs.result}
      - QUESTION: ${steps.implement.outputs.question}
    run: |
      if [ "$RESULT" != "pass" ]; then
        # blocked is handled by hand until VS3/VS5
        echo "worker result=$RESULT question=$QUESTION" >&2
        exit 1
      fi

  # Independent QA on the uncommitted worktree (a different model family than impl).
  # QA must not change anything (status + diff + untracked content are hashed before and
  # after). On `fail` the findings go once to the implementation thread, the new verdict
  # must pass, and QA runs once more; a second `fail` fails the run.
  - id: qa
    depends: require_pass
    env:
      - IMPL_THREAD: ${steps.implement.outputs.thread_id}
    outputs:
      - {name: result}
      - {name: thread_id}
      - {name: model}
      - {name: question}
      - {name: commit}
      - {name: findings}
      - {name: worktree}
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      snap() {
        ( cd "$WT"
          git status --porcelain
          git diff | sha256sum
          git ls-files -o --exclude-standard -z | xargs -0 -r sha256sum ) | sha256sum | cut -d' ' -f1
      }
      field() { grep "^$2=" "$1" | tail -n 1 | cut -d= -f2- || true; }
      run_qa() {
        local n=$1 brief="$ISSUE_STATE/qa-brief-$1.md" outf="$ISSUE_STATE/qa-out-$1" before after rc=0
        { cat "$ISSUE_STATE/brief.md"
          printf '\n\n## Worktree status (git status --short)\n\n```\n'
          git -C "$WT" status --short
          printf '```\n\n## Worktree diff (git diff)\n\n```diff\n'
          git -C "$WT" diff
          printf '```\n'; } > "$brief"
        : > "$outf"
        before=$(snap)
        DAGU_OUTPUT_FILE="$outf" node "$FACTORY/src/station.mjs" --line qa \
          --issue "$ISSUE" --run "$DAG_RUN_ID-qa$n" --project "$WT" \
          --brief "$brief" --t3-home "$T3_HOME" \
          --state "$STATE" --lines "$LINE_TABLE" >&2 || rc=$?
        after=$(snap)
        if [ "$before" != "$after" ]; then echo "qa changed the worktree" >&2; exit 1; fi
        case "$rc" in 0|10) ;; *) echo "qa station exit $rc" >&2; exit 1 ;; esac
        QA_OUT="$outf"
        QA_RESULT=$(field "$outf" result)
      }
      run_qa 1
      if [ "$QA_RESULT" != "pass" ]; then
        echo "qa result=$QA_RESULT; sending findings to the implementation thread" >&2
        { printf 'QA rejected your work. Fix every finding below (uncommitted, same rules) and answer with the verdict JSON line.\n\nFindings:\n%s\n' \
            "$(field "$QA_OUT" findings)"
          if [ -n "$(field "$QA_OUT" question)" ]; then printf 'Question: %s\n' "$(field "$QA_OUT" question)"; fi
        } > "$ISSUE_STATE/qa-findings.md"
        fixrc=0
        DAGU_OUTPUT_FILE="$ISSUE_STATE/qa-fix-out" node "$FACTORY/src/station.mjs" --line impl \
          --issue "$ISSUE" --run "$DAG_RUN_ID-qafix" --project "$WT" \
          --continue "$IMPL_THREAD" --brief "$ISSUE_STATE/qa-findings.md" \
          --t3-home "$T3_HOME" --state "$STATE" --lines "$LINE_TABLE" >&2 || fixrc=$?
        fixres=$(field "$ISSUE_STATE/qa-fix-out" result)
        if [ "$fixrc" != 0 ] || [ "$fixres" != "pass" ]; then
          echo "implementation after QA findings: result=$fixres exit=$fixrc" >&2
          exit 1
        fi
        run_qa 2
        if [ "$QA_RESULT" != "pass" ]; then
          echo "second QA result=$QA_RESULT: failing the run" >&2
          exit 1
        fi
      fi
      grep -E '^(result|thread_id|model|question|commit|findings|worktree)=' "$QA_OUT" >> "$DAGU_OUTPUT_FILE"

  # Validate the uncommitted work in the worktree before anything is committed.
  - id: validate
    depends: qa
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      cd "$WT"
      # a worker that committed anyway: fold it back into the working tree
      if [ "$(git rev-list --count "$BASE..HEAD")" != 0 ]; then
        git reset -q --soft "$BASE"
      fi
      test -n "$(git status --porcelain)" || { echo "no changes to validate" >&2; exit 1; }
      git add -A -n > "$ISSUE_STATE/changes"
      bash -euo pipefail -c "$GATE"

  # One commit per issue, made only now, from the validated worktree.
  - id: integrate
    depends: validate
    outputs:
      - {name: merged_sha}
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      test "$(git -C "$PRIMARY" branch --show-current)" = "$BASE"
      cd "$WT"
      git add -A
      git commit -q -m "$(cat "$ISSUE_STATE/title") (#$ISSUE)" \
        -m "Factory-Run: $DAG_RUN_ID"
      if [ "$(git merge-base HEAD "$BASE")" != "$(git rev-parse "$BASE")" ]; then
        # the trunk moved since validation: rebase and validate the final candidate
        git rebase -q "$BASE"
        bash -euo pipefail -c "$GATE"
      fi
      git -C "$PRIMARY" merge -q --ff-only "$BRANCH"
      if [ "$PUSH" = "true" ]; then git -C "$PRIMARY" push -q origin "$BASE"; fi
      printf 'merged_sha=%s\n' "$(git -C "$PRIMARY" rev-parse HEAD)" >> "$DAGU_OUTPUT_FILE"

  # The trunk is the running system: a red CI on the pushed commit is reverted.
  - id: ci
    depends: integrate
    env:
      - SHA: ${steps.integrate.outputs.merged_sha}
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      if [ "$PUSH" != "true" ]; then echo "not pushed: no CI to wait for"; exit 0; fi
      origin=$(git -C "$PRIMARY" remote get-url origin)
      deadline=$(( $(date +%s) + CI_TIMEOUT_MIN * 60 ))
      result=""
      while [ "$(date +%s)" -lt "$deadline" ]; do
        result=$(gh run list -R "$origin" --commit "$SHA" --json status,conclusion \
          --jq 'if length == 0 then "none" elif all(.status == "completed") then
                (if all(.conclusion == "success") then "success" else "failure" end)
                else "running" end' 2>/dev/null || echo "error")
        case "$result" in success|failure) break ;; esac
        sleep 20
      done
      echo "ci on $SHA: $result"
      [ "$result" = "success" ] && exit 0
      # red, missing or timed out: the trunk must not keep an unverified change
      git -C "$PRIMARY" revert --no-edit "$SHA"
      git -C "$PRIMARY" push -q origin "$BASE"
      gh issue comment "$ISSUE" -R "$origin" \
        --body "Factory: CI was '$result' for $SHA; reverted on $BASE (run $DAG_RUN_ID)." || true
      exit 1

  # Idempotent: safe to re-run after a partial close (src/close.sh).
  - id: close
    depends: ci
    env:
      - SHA: ${steps.integrate.outputs.merged_sha}
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      bash "$FACTORY/src/close.sh"

  # Closing gate: the run only succeeds when the delivery is verifiably closed.
  - id: verify_close
    depends: close
    env:
      - SHA: ${steps.integrate.outputs.merged_sha}
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      bash "$FACTORY/src/verify-close.sh"
