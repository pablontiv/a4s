---
# Factory cycle: issue -> implementation thread in T3 (no commit) -> validate the
# worktree -> one commit -> integrate -> CI on the trunk -> close. No human step:
# validation is the only gate before the trunk.
# Nothing reaches a commit before it is validated in the worktree; nothing stays on
# the trunk if CI fails (it is reverted). Control is deterministic here;
# interpretation happens in the worker and arrives as a structured verdict.
type: graph
# bash features (${!var}) are used; Dagu's default shell may be sh
shell: bash
# global Dagu queue (config.yaml queues) whose max_concurrency equals limits.json maxActiveRuns; integration stays serial by the lease (#1089)
queue: factory-cycle
# PRIMARY/FACTORY/T3_HOME/STATE: empty params fall back to A4S_* declared in
# Dagu's base config `env:` (resolved by src/cycle-env.sh in every step).
params:
  # issue number (or fixture id in the selftest)
  - name: ISSUE
    required: true
  # primary checkout of the trunk repository
  - name: PRIMARY
    default: ""
  # absolute path to packages/factory, read from the trunk checkout
  - name: FACTORY
    default: ""
  - name: T3_HOME
    default: ""
  # in-flight state, outside the code
  - name: STATE
    default: ""
  - name: BASE
    default: main
  # optional; defaults to the GitHub issue title and body
  - name: BRIEF_FILE
    default: ""
  # validation in a CI-equivalent environment + selftest (operator host)
  - name: GATE
    default: "bash scripts/factory-gate.sh"
  # push the trunk after integrating, then wait for CI on the pushed commit
  - name: PUSH
    default: "true"
  # close the GitHub issue after a green trunk
  - name: CLOSE_ISSUE
    default: "true"
  # minutes to wait for CI on the pushed commit
  - name: CI_TIMEOUT_MIN
    default: "30"
  # comma-separated workflow names that count for the CI verdict (others are ignored)
  - name: CI_WORKFLOWS
    default: "CI"
  # optional T3 thread to notify; empty = A4S_INBOX_THREAD from Dagu's base config,
  # else the factory's own inbox thread (created on first use, src/notify.mjs)
  - name: INBOX_THREAD
    default: ""
  # optional line table override (the selftest uses a cheap model).
  # Not named LINES: shells export LINES (terminal height), e.g. "0" under Dagu.
  - name: LINE_TABLE
    default: ""
  # issue-state fixture (same JSON as `gh issue list`); empty = the labels live on GitHub.
  # Set by admission when it was fed from ISSUES_FILE (selftest).
  - name: ISSUES_FILE
    default: ""
steps:
  - id: prepare
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      mkdir -p "$ISSUE_STATE"
      rm -f "$ISSUE_STATE/stale-patch" "$ISSUE_STATE/lease-wait.json"
      # PRIMARY is only looked at while holding the integration lease, so it is never seen in the middle of
      # another run's fast-forward; released right after (and on any failure)
      lease() { local sub=$1; shift; node "$FACTORY/src/lease.mjs" "$sub" --state "$STATE" --run "$DAG_RUN_ID" "$@"; }
      lease acquire --issue-state "$ISSUE_STATE"
      trap 'lease release' EXIT
      test "$(git -C "$PRIMARY" branch --show-current)" = "$BASE"
      test -z "$(git -C "$PRIMARY" status --porcelain --untracked-files=no)"
      fresh=0
      if [ ! -d "$WT" ]; then
        git -C "$PRIMARY" worktree add -q -B "$BRANCH" "$WT" "$BASE"
        fresh=1
      fi
      lease release
      if [ "$fresh" = 0 ]; then
        # reused worktree (earlier attempt): first abort whatever operation was left in progress
        gp() { git -C "$WT" rev-parse --git-path "$1"; }
        if [ -e "$(gp rebase-merge)" ] || [ -e "$(gp rebase-apply)" ]; then
          git -C "$WT" rebase --abort || rm -rf "$(gp rebase-merge)" "$(gp rebase-apply)"
        fi
        if [ -e "$(gp MERGE_HEAD)" ]; then git -C "$WT" merge --abort || git -C "$WT" reset -q --merge; fi
        if [ -e "$(gp CHERRY_PICK_HEAD)" ]; then git -C "$WT" cherry-pick --abort || git -C "$WT" reset -q --merge; fi
        # carry over only the issue's own changes (committed or not): the diff from the fork point
        # with the trunk to the working tree, never the reverse of what landed on $BASE since
        fork=$(git -C "$WT" merge-base HEAD "$BASE" 2>/dev/null || git -C "$WT" rev-parse "$BASE")
        patch="$ISSUE_STATE/carry-$(date +%s).patch"
        git -C "$WT" add -A
        git -C "$WT" diff --cached --binary "$fork" > "$patch"
        git -C "$WT" reset -q
        git -C "$WT" reset -q --hard "$BASE"
        git -C "$WT" clean -fdq
        if [ ! -s "$patch" ]; then
          rm -f "$patch"
        elif git -C "$WT" apply --check --binary "$patch" 2>/dev/null; then
          git -C "$WT" apply --binary "$patch"
          rm -f "$patch"
        else
          echo "prepare: earlier changes do not apply on $BASE; worktree reset to $BASE, changes saved in $patch"
          printf '%s\n' "$patch" > "$ISSUE_STATE/stale-patch"
        fi
      fi
      node "$FACTORY/src/t3cli.mjs" project add \
        --title "issue-$ISSUE" "$WT" || echo "project already registered"
      bash "$FACTORY/src/prepare-brief.sh"
      if [ -s "$ISSUE_STATE/stale-patch" ]; then
        printf '\n## Earlier changes not applied\n\nYour earlier changes did not apply on the current %s. The worktree was reset to %s; the earlier changes are saved as the patch `%s` (read it, and redo what is still needed).\n' \
          "$BASE" "$BASE" "$(cat "$ISSUE_STATE/stale-patch")" >> "$ISSUE_STATE/brief.md"
      fi

  - id: implement
    depends: prepare
    retry_policy:
      limit: 1
      interval_sec: 5
      exit_code: [10, 40]
    outputs:
      - {name: result}
      - {name: thread_id}
      - {name: model}
      - {name: question}
      - {name: commit}
      - {name: findings}
      - {name: worktree}
    # an empty LINE_TABLE makes the station use the lines.json next to it
    run: |
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      exec node "$FACTORY/src/station.mjs" --line impl \
        --issue "$ISSUE" --run "$DAG_RUN_ID" --project "$WT" \
        --brief "$ISSUE_STATE/brief.md" --t3-home "$T3_HOME" \
        --state "$STATE" --lines "$LINE_TABLE"

  - id: require_pass
    depends: implement
    env:
      - RESULT: ${steps.implement.outputs.result}
      - QUESTION: ${steps.implement.outputs.question}
    run: |
      if [ "$RESULT" != "pass" ]; then
        # blocked is handled by hand until VS3/VS5
        echo "worker result=$RESULT question=$QUESTION" >&2
        exit 1
      fi

  # Independent QA on the uncommitted worktree (a different model family than impl).
  # QA must not change anything (status + diff + untracked content are hashed before and
  # after). On `fail` the findings go once to the implementation thread, the new verdict
  # must pass, and QA runs once more; a second `fail` fails the run.
  - id: qa
    depends: require_pass
    env:
      - IMPL_THREAD: ${steps.implement.outputs.thread_id}
    outputs:
      - {name: result}
      - {name: thread_id}
      - {name: model}
      - {name: question}
      - {name: commit}
      - {name: findings}
      - {name: worktree}
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      snap() {
        ( cd "$WT"
          git status --porcelain
          git diff | sha256sum
          git ls-files -o --exclude-standard -z | xargs -0 -r sha256sum ) | sha256sum | cut -d' ' -f1
      }
      field() { grep "^$2=" "$1" | tail -n 1 | cut -d= -f2- || true; }
      run_qa() {
        local n=$1 brief="$ISSUE_STATE/qa-brief-$1.md" outf="$ISSUE_STATE/qa-out-$1" before after rc=0
        { cat "$ISSUE_STATE/brief.md"
          printf '\n\n## Worktree status (git status --short)\n\n```\n'
          git -C "$WT" status --short
          printf '```\n\n## Worktree diff (git diff)\n\n```diff\n'
          git -C "$WT" diff
          printf '```\n'; } > "$brief"
        : > "$outf"
        before=$(snap)
        DAGU_OUTPUT_FILE="$outf" node "$FACTORY/src/station.mjs" --line qa \
          --issue "$ISSUE" --run "$DAG_RUN_ID-qa$n" --project "$WT" \
          --brief "$brief" --t3-home "$T3_HOME" \
          --state "$STATE" --lines "$LINE_TABLE" >&2 || rc=$?
        after=$(snap)
        if [ "$before" != "$after" ]; then echo "qa changed the worktree" >&2; exit 1; fi
        case "$rc" in 0|10) ;; *) echo "qa station exit $rc" >&2; exit 1 ;; esac
        QA_OUT="$outf"
        QA_RESULT=$(field "$outf" result)
      }
      run_qa 1
      if [ "$QA_RESULT" != "pass" ]; then
        echo "qa result=$QA_RESULT; sending findings to the implementation thread" >&2
        { printf 'QA rejected your work. Fix every finding below (uncommitted, same rules) and answer with the verdict JSON line.\n\nFindings:\n%s\n' \
            "$(field "$QA_OUT" findings)"
          if [ -n "$(field "$QA_OUT" question)" ]; then printf 'Question: %s\n' "$(field "$QA_OUT" question)"; fi
        } > "$ISSUE_STATE/qa-findings.md"
        fixrc=0
        DAGU_OUTPUT_FILE="$ISSUE_STATE/qa-fix-out" node "$FACTORY/src/station.mjs" --line impl \
          --issue "$ISSUE" --run "$DAG_RUN_ID-qafix" --project "$WT" \
          --continue "$IMPL_THREAD" --brief "$ISSUE_STATE/qa-findings.md" \
          --t3-home "$T3_HOME" --state "$STATE" --lines "$LINE_TABLE" >&2 || fixrc=$?
        fixres=$(field "$ISSUE_STATE/qa-fix-out" result)
        if [ "$fixrc" != 0 ] || [ "$fixres" != "pass" ]; then
          echo "implementation after QA findings: result=$fixres exit=$fixrc" >&2
          exit 1
        fi
        run_qa 2
        if [ "$QA_RESULT" != "pass" ]; then
          echo "second QA result=$QA_RESULT: failing the run" >&2
          exit 1
        fi
      fi
      grep -E '^(result|thread_id|model|question|commit|findings|worktree)=' "$QA_OUT" >> "$DAGU_OUTPUT_FILE"

  # Validate the uncommitted work in the worktree before anything is committed.
  - id: validate
    depends: qa
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      cd "$WT"
      # a worker that committed anyway: fold it back into the working tree
      if [ "$(git rev-list --count "$BASE..HEAD")" != 0 ]; then
        git reset -q --soft "$BASE"
      fi
      test -n "$(git status --porcelain)" || { echo "no changes to validate" >&2; exit 1; }
      git add -A -n > "$ISSUE_STATE/changes"
      # factory changes need a selftest receipt for exactly this code (checked once, after every edit of the run)
      node "$FACTORY/src/receipt.mjs" check "$WT" "$ISSUE_STATE/step-failure.json" "$DAG_RUN_ID"
      bash -euo pipefail -c "$GATE"

  # Exclusive integration window (src/lease.mjs): wait here, as a step of its own, until this run holds the
  # integration lease, so `integrate` starts only once the window is ours (Dagu's step times show it). No deadline:
  # a dead holder is reclaimed and a live one ends within its own steps; the wait goes to $ISSUE_STATE/lease-wait.json.
  - id: integration_lease
    depends: validate
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      node "$FACTORY/src/lease.mjs" acquire --state "$STATE" --run "$DAG_RUN_ID" --issue-state "$ISSUE_STATE"

  # One commit per issue, made only now, from the validated worktree.
  - id: integrate
    depends: integration_lease
    outputs:
      - {name: merged_sha}
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      # Exclusive integration window: held since `integration_lease` (taking it again is a no-op for its owner,
      # and takes it when this step runs on its own), held through the `ci` step (which releases it), and released
      # right away if this step fails. Any wait is recorded in $ISSUE_STATE/lease-wait.json.
      lease() { local sub=$1; shift; node "$FACTORY/src/lease.mjs" "$sub" --state "$STATE" --run "$DAG_RUN_ID" "$@"; }
      lease acquire --issue-state "$ISSUE_STATE"
      trap 'rc=$?; if [ "$rc" != 0 ]; then lease release; fi' EXIT
      test "$(git -C "$PRIMARY" branch --show-current)" = "$BASE"
      cd "$WT"
      git add -A
      git commit -q -m "$(cat "$ISSUE_STATE/title") (#$ISSUE)" \
        -m "Factory-Run: $DAG_RUN_ID"
      if [ "$(git merge-base HEAD "$BASE")" != "$(git rev-parse "$BASE")" ]; then
        # the trunk moved since validation: rebase and validate the final candidate
        if ! git rebase -q "$BASE"; then
          files=$(git diff --name-only --diff-filter=U | paste -sd, - | sed 's/,/, /g')
          git rebase --abort || true
          # keep the issue's changes as working-tree changes on its old fork point
          git reset -q "$(git merge-base HEAD "$BASE")" || true
          printf '{"run":"%s","step":"integrate","findings":["rebase-conflict: %s"]}\n' "$DAG_RUN_ID" "$files" > "$ISSUE_STATE/step-failure.json"
          echo "rebase-conflict: $files" >&2
          exit 1
        fi
        bash -euo pipefail -c "$GATE"
      fi
      git -C "$PRIMARY" merge -q --ff-only "$BRANCH"
      if [ "$PUSH" = "true" ]; then git -C "$PRIMARY" push -q origin "$BASE"; fi
      printf 'merged_sha=%s\n' "$(git -C "$PRIMARY" rev-parse HEAD)" >> "$DAGU_OUTPUT_FILE"

  # The trunk is the running system: a red CI on the pushed commit is reverted.
  - id: ci
    depends: integrate
    env:
      - SHA: ${steps.integrate.outputs.merged_sha}
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      # the integration window ends here: green, or the revert pushed (or any failure of this step)
      trap 'node "$FACTORY/src/lease.mjs" release --state "$STATE" --run "$DAG_RUN_ID"' EXIT
      if [ "$PUSH" != "true" ]; then echo "not pushed: no CI to wait for"; exit 0; fi
      origin=$(git -C "$PRIMARY" remote get-url origin)
      cls=$(node "$FACTORY/src/ci.mjs" wait --primary "$PRIMARY" --origin "$origin" --sha "$SHA" --base "$BASE" \
        --workflows "${CI_WORKFLOWS:-CI}" --timeout-min "$CI_TIMEOUT_MIN")
      state=$(printf '%s' "$cls" | jq -r .state)
      target=$(printf '%s' "$cls" | jq -r .target)
      conclusion=$(printf '%s' "$cls" | jq -r .conclusion)
      workflow=$(printf '%s' "$cls" | jq -r .workflow)
      url=$(printf '%s' "$cls" | jq -r .url)
      echo "ci on $target: $state ($conclusion)"
      [ "$state" != "red" ] && exit 0
      # red (failure, timed_out, or no verdict in time): the trunk must not keep an unverified change
      node "$FACTORY/src/ci.mjs" failure --file "$ISSUE_STATE/step-failure.json" --run "$DAG_RUN_ID" \
        --conclusion "$conclusion" --workflow "$workflow" --url "$url" --sha "$target"
      # revert only this run's own commit, and only while it is the tip of the trunk (local and live remote tip);
      # anything else, or a remote that cannot be read, fails as infra and notifies the inbox
      infra() {
        echo "ci: red on $target but not reverting: $1" >&2
        node "$FACTORY/src/ci.mjs" infra --file "$ISSUE_STATE/step-failure.json" --run "$DAG_RUN_ID" \
          --message "CI ($workflow) was '$conclusion' for $target but the revert was not made: $1"
        node "$FACTORY/src/notify.mjs" --event infra --run "$DAG_RUN_ID" --issue "$ISSUE" --inbox "$INBOX_THREAD" \
          --primary "$PRIMARY" --t3-home "$T3_HOME" --state "$STATE" \
          --text "[Fábrica] Run $DAG_RUN_ID · issue #$ISSUE: CI ($workflow) rojo ($conclusion) en $target, pero NO se revirtió: $1. Revisar main a mano." || true
        exit 1
      }
      why=$(node "$FACTORY/src/ci.mjs" revert-check --primary "$PRIMARY" --sha "$SHA" --base "$BASE" --run "$DAG_RUN_ID") || infra "${why:-revert check failed}"
      git -C "$PRIMARY" revert --no-edit "$SHA"
      if ! git -C "$PRIMARY" push -q origin "$BASE"; then
        # the remote moved after the check: undo the local revert, the trunk stays as the remote has it
        git -C "$PRIMARY" reset -q --hard "$SHA"
        infra "the push of the revert of $SHA was refused"
      fi
      gh issue comment "$ISSUE" -R "$origin" \
        --body "Factory: CI ($workflow) concluded '$conclusion' for $target $url; reverted $SHA on $BASE (run $DAG_RUN_ID)." || true
      exit 1

  # Idempotent: safe to re-run after a partial close (src/close.sh).
  - id: close
    depends: ci
    env:
      - SHA: ${steps.integrate.outputs.merged_sha}
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      bash "$FACTORY/src/close.sh"

  # Closing gate: the run only succeeds when the delivery is verifiably closed.
  - id: verify_close
    depends: close
    env:
      - SHA: ${steps.integrate.outputs.merged_sha}
    run: |
      set -euo pipefail
      . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
      bash "$FACTORY/src/verify-close.sh"

# Notifications (VS2): the operator's T3 thread hears about every run outcome, so nobody polls
# Dagu. A handler never fails the run (src/notify.mjs always exits 0).
handler_on:
  success:
    run: |
      # whatever the outcome, the run no longer holds the integration lease
      (
        . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
        node "$FACTORY/src/lease.mjs" release --state "$STATE" --run "$DAG_RUN_ID"
      ) || echo "lease release failed (ignored)" >&2
      (
        . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
        steps=$("${DAGU_EXECUTABLE:-dagu}" status --run-id "$DAG_RUN_ID" "$DAG_NAME" 2>/dev/null \
          | sed -nE 's/^(├|└)─([^ ]+)( \([^)]*\))? \[([a-z_]+)\]$/\2=\4/p' | paste -sd, - || true)
        node "$FACTORY/src/notify.mjs" --event success --run "$DAG_RUN_ID" --issue "$ISSUE" \
          --steps "$steps" --inbox "$INBOX_THREAD" --primary "$PRIMARY" \
          --t3-home "$T3_HOME" --state "$STATE"
      ) || echo "notify failed (ignored)" >&2
      # delivered: the issue is closed by the cycle; drop its factory:running label
      (
        . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
        origin=$(git -C "$PRIMARY" remote get-url origin 2>/dev/null || true)
        if [ -n "$ISSUES_FILE" ]; then where=(--issues-file "$ISSUES_FILE")
        elif [ -n "$origin" ]; then where=(--repo "$origin")
        else exit 0; fi
        node "$FACTORY/src/labels.mjs" success --issue "$ISSUE" --state "$STATE" --run "$DAG_RUN_ID" "${where[@]}"
      ) || echo "label update failed (ignored)" >&2
      # run history for the circuit breaker (src/breaker.mjs)
      (
        . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
        node "$FACTORY/src/breaker.mjs" record --issue "$ISSUE" --run "$DAG_RUN_ID" --state "$STATE"
      ) || echo "breaker record failed (ignored)" >&2
      # delivered: the issue's state leaves $STATE/<n>/ for $STATE/archive/<n>/ so the breaker limits never see it (last: nothing reads it after)
      bash "${FACTORY:-${A4S_FACTORY:-}}/src/archive-state.sh" || echo "archive failed (ignored)" >&2
      exit 0
  failure:
    run: |
      # whatever the outcome, the run no longer holds the integration lease
      (
        . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
        node "$FACTORY/src/lease.mjs" release --state "$STATE" --run "$DAG_RUN_ID"
      ) || echo "lease release failed (ignored)" >&2
      (
        . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
        steps=$("${DAGU_EXECUTABLE:-dagu}" status --run-id "$DAG_RUN_ID" "$DAG_NAME" 2>/dev/null \
          | sed -nE 's/^(├|└)─([^ ]+)( \([^)]*\))? \[([a-z_]+)\]$/\2=\4/p' | paste -sd, - || true)
        node "$FACTORY/src/notify.mjs" --event failure --run "$DAG_RUN_ID" --issue "$ISSUE" \
          --steps "$steps" --inbox "$INBOX_THREAD" --primary "$PRIMARY" \
          --t3-home "$T3_HOME" --state "$STATE"
      ) || echo "notify failed (ignored)" >&2
      # run history for the circuit breaker; before `finish` below changes the issue state (outcome comes from the station state)
      (
        . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
        steps=$("${DAGU_EXECUTABLE:-dagu}" status --run-id "$DAG_RUN_ID" "$DAG_NAME" 2>/dev/null \
          | sed -nE 's/^(├|└)─([^ ]+)( \([^)]*\))? \[([a-z_]+)\]$/\2=\4/p' | paste -sd, - || true)
        node "$FACTORY/src/breaker.mjs" record --issue "$ISSUE" --run "$DAG_RUN_ID" --steps "$steps" --state "$STATE"
      ) || echo "breaker record failed (ignored)" >&2
      # issue state (src/labels.mjs): back to factory:ready (retryable, < 3 runs) or factory:needs-human + comment
      (
        . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
        steps=$("${DAGU_EXECUTABLE:-dagu}" status --run-id "$DAG_RUN_ID" "$DAG_NAME" 2>/dev/null \
          | sed -nE 's/^(├|└)─([^ ]+)( \([^)]*\))? \[([a-z_]+)\]$/\2=\4/p' | paste -sd, - || true)
        origin=$(git -C "$PRIMARY" remote get-url origin 2>/dev/null || true)
        if [ -n "$ISSUES_FILE" ]; then where=(--issues-file "$ISSUES_FILE")
        elif [ -n "$origin" ]; then where=(--repo "$origin")
        else echo "no issue source: labels untouched"; exit 0; fi
        node "$FACTORY/src/labels.mjs" finish --issue "$ISSUE" --state "$STATE" \
          --run "$DAG_RUN_ID" --steps "$steps" "${where[@]}"
      ) || echo "label update failed (ignored)" >&2
      exit 0
  abort:
    run: |
      # whatever the outcome, the run no longer holds the integration lease
      (
        . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
        node "$FACTORY/src/lease.mjs" release --state "$STATE" --run "$DAG_RUN_ID"
      ) || echo "lease release failed (ignored)" >&2
      exit 0
  wait:
    run: |
      (
        . "${FACTORY:-${A4S_FACTORY:-}}/src/cycle-env.sh"
        steps=$("${DAGU_EXECUTABLE:-dagu}" status --run-id "$DAG_RUN_ID" "$DAG_NAME" 2>/dev/null \
          | sed -nE 's/^(├|└)─([^ ]+)( \([^)]*\))? \[([a-z_]+)\]$/\2=\4/p' | paste -sd, - || true)
        node "$FACTORY/src/notify.mjs" --event wait --run "$DAG_RUN_ID" --issue "$ISSUE" \
          --steps "$steps" --inbox "$INBOX_THREAD" --primary "$PRIMARY" \
          --t3-home "$T3_HOME" --state "$STATE"
      ) || echo "notify failed (ignored)" >&2
      exit 0
